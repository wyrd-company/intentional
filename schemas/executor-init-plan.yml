# ---
# relationships:
#   implements: github-release-executor
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/executor-init-plan.yml
title: Intentional executor initialization plan
type: object
additionalProperties: false
required:
  - $schema
  - state
  - source-fingerprint
  - inferred-github
  - candidates
  - planned-operations
properties:
  $schema:
    const: https://intentional.foo/schemas/executor-init-plan.yml
  state:
    enum: [ needs-input, ready ]
  source-fingerprint:
    $ref: "#/$defs/digest"
  inferred-github:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/github"
  candidates:
    type: array
    items:
      $ref: "#/$defs/candidate"
  planned-operations:
    type: array
    items:
      type: string
      minLength: 1
$defs:
  digest:
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  exact-path:
    type: string
    minLength: 1
    not: { const: "." }
    pattern: '^(?!/)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*[*?\[\]{}])[^/]+(?:/[^/]+)*$'
  evidence:
    type: object
    additionalProperties: false
    required: [ path, digest ]
    properties:
      path:
        $ref: "#/$defs/exact-path"
      digest:
        $ref: "#/$defs/digest"
      lines:
        type: array
        uniqueItems: true
        items:
          type: integer
          minimum: 1
  choice:
    type: object
    additionalProperties: false
    required: [ id, label ]
    properties:
      id:
        type: string
        pattern: "^[a-z0-9][a-z0-9._-]*$"
      label:
        type: string
        minLength: 1
      publisher:
        enum: [ npm, cargo, homebrew, rpm, apt, aur, oci ]
      target:
        type: string
        minLength: 1
      packager:
        type: string
        minLength: 1
  candidate:
    type: object
    additionalProperties: false
    required:
      - id
      - kind
      - release-unit
      - capability
      - evidence
      - choices
      - resolution
    properties:
      id:
        type: string
        pattern: "^candidate:[0-9a-f]{64}$"
      kind:
        enum: [ package, publication-intent, packager ]
      release-unit:
        type: string
        minLength: 1
      package:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1
      detector:
        type: string
        minLength: 1
      capability:
        type: string
        minLength: 1
      evidence:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/evidence"
      choices:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/choice"
      recommended:
        type: string
        pattern: "^[a-z0-9][a-z0-9._-]*$"
      resolution:
        type: [ string, "null" ]
        pattern: "^[a-z0-9][a-z0-9._-]*$"
allOf:
  - if:
      properties:
        candidates:
          contains:
            properties:
              kind: { const: package }
            required: [ kind ]
    then:
      properties:
        candidates:
          items:
            if:
              properties:
                kind: { const: package }
              required: [ kind ]
            then:
              required: [ package, path, detector ]
  - if:
      properties:
        state: { const: ready }
    then:
      properties:
        candidates:
          items:
            properties:
              resolution:
                type: string
