# ---
# relationships:
#   implements: intent-driven-polyglot-release
# ---
version: "3"

tasks:
  build:
    desc: Build the complete Rust workspace
    cmds:
      - cargo build --workspace

  test:
    desc: Run all workspace tests
    cmds:
      - cargo test --workspace

  self-check:
    desc: Verify Intentional can load its own release configuration
    cmds:
      - cargo run --quiet -p intentional-cli -- status

  lint:
    desc: Run Clippy with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    desc: Format all Rust code
    cmds:
      - cargo fmt --all

  fmt-check:
    desc: Verify Rust formatting
    cmds:
      - cargo fmt --all -- --check

  ci:
    desc: Run all continuous-integration checks locally
    deps:
      [
        cargo-homebrew:compatibility,
        docs:check,
        fmt-check,
        lint,
        npm:test,
        release:check,
        self-check,
        test,
      ]

  cargo-homebrew:compatibility:
    desc: >-
      Execute emitted Cargo/Homebrew bodies against workspace and older-bsdtar
      contracts
    cmds:
      - >-
        cargo test -p intentional-core cargo_homebrew_platform_contract
        -- --ignored --nocapture

  hosted:check:
    desc: >-
      Require every completed check on a GitHub pull request to pass
    requires:
      vars: [ PR ]
    cmds:
      - gh pr checks {{ .PR }}

  pinned-gnu:test:
    desc: Run all workspace tests through the pinned GNU compatibility baseline
    cmds:
      - |
        set -a
        . scripts/release/linux-gnu-baseline.env
        scripts/ci/install-workflow-test-tools.sh .ci-tools/bin
        . .ci-tools/bin/workflow-test-tools.sh
        RUSTUP_TOOLCHAIN="$RUST_VERSION"
        # Cross mounts the Cargo home containing its own executable. Prefer
        # that bin directory over an unrelated ambient Cargo installation.
        cross_bin="$(command -v cross)"
        PATH="$(dirname "$cross_bin"):$PATH"
        set +a
        # Shared baseline owns the all-target and doc-test argument lists.
        # shellcheck disable=SC2086
        cross test $GNU_CROSS_TEST_ARGUMENTS
        # shellcheck disable=SC2086
        cross test $GNU_CROSS_DOC_TEST_ARGUMENTS

  npm:test:
    desc: Test the public npm launcher and its exact package contents
    cmds:
      - npm test --prefix npm

  release:check:
    desc: Validate release automation and cross-channel version agreement
    cmds:
      - actionlint .github/workflows/*.yml
      - shellcheck scripts/action/*.sh scripts/ci/*.sh scripts/release/*.sh
      - >-
        ryl check .github/workflows/*.yml Taskfile.yml
        .intentional/config.yml github-action-pins.yml
      # Both lines are deliberate. The first attributes a regression to this
      # repository's own action documents; the second attributes it to the
      # gate's own semantics. Dropping either leaves one of those two failures
      # indistinguishable from the other.
      - python3 scripts/release/lint-actions.py
      - scripts/release/test-action-lint.sh
      - python3 scripts/release/verify-versions.py
      - >-
        yq -e
        '[.release-units.intentional.projections[] |
        select(.adapter == "npm" and .file == "npm/package.json" and .mode == "committed")] |
        length == 1'
        .intentional/config.yml >/dev/null
      - scripts/release/test-retry.sh
      # The online pin check itself needs the network, so it stays in its own
      # workflow. Its completeness and retry semantics do not, and are proved
      # here against a stubbed git.
      - scripts/release/test-action-pin-evidence.sh
      - scripts/release/assert-release-workflow-baseline.sh
      - scripts/release/assert-linux-gnu-baseline-provenance.sh
      # As with the action lint above, both lines are deliberate: the first
      # attributes a regression to this repository's own action documents, the
      # second to the gate's own semantics.
      - scripts/release/assert-action-paths.sh
      - scripts/release/test-action-paths.sh
      - scripts/release/assert-consumer-contract.sh
      - scripts/release/test-self-hosted-tag.sh

  self-release:verify:
    desc: Build the workspace binary and verify self-hosted tag acceptance of a sealed plan
    cmds:
      - scripts/release/verify-self-hosted-tag.sh {{ .SEALED_PLAN }}
    requires:
      vars: [ SEALED_PLAN ]

  self-release:tag:
    desc: Create annotated release tags with the materialized workspace binary (explicit operator action)
    cmds:
      - >-
        INTENTIONAL_SELF_RELEASE_CREATE={{ .CREATE_ACK }}
        scripts/release/create-self-hosted-tag.sh {{ .SEALED_PLAN }}
    requires:
      vars: [ SEALED_PLAN, CREATE_ACK ]
    preconditions:
      - sh: '[ "{{.CREATE_ACK}}" = "create-annotated-tag" ]'
        msg: CREATE_ACK must be exactly create-annotated-tag

  docs:demo:
    desc: Regenerate and optimize the public documentation demo
    deps: [ build ]
    cmds:
      - vhs docs/demo.tape
      - gifsicle --batch --optimize=3 --colors 256 docs/assets/demo.gif

  docs:check:
    desc: Validate public documentation and its generated demo
    cmds:
      - bash scripts/check-docs.sh
