# ---
# relationships: { realizes: arch-package }
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/destinations/arch-package/config"
title: Arch Package recipe configuration catalog
$defs:
  package:
    type: object
    additionalProperties: false
    properties:
      maintainer: { type: string, minLength: 1 }
      license: { type: string, minLength: 1 }
  artifact:
    type: object
    additionalProperties: false
    required: [ package-name ]
    properties:
      package-name: { type: string, pattern: "^[a-z0-9][a-z0-9+._-]*$" }
      architecture: { type: string, minLength: 1 }
      install-path: { type: string, pattern: "^/[^*?\\[\\]{}]+$" }
