$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/destinations/github-container-registry/config"
title: GitHub Container Registry recipe configuration catalog
$defs:
  configuration: { type: object, additionalProperties: false }
  destination:
    type: object
    additionalProperties: false
    required: [ repository ]
    properties: { repository: { type: string, pattern: "^[a-z0-9][a-z0-9._/-]*$" } }
