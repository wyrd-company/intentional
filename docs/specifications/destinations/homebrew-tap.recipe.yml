$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships: { realizes: homebrew-tap, part-of: homebrew }
role: distribution
configuration: ./homebrew-tap.config.yml#/$defs/configuration
destination: ./homebrew-tap.config.yml#/$defs/destination
primitives: [ git-file-preflight, github-app-promote-file, git-public-observe, homebrew-verify-formula ]
tools: []
accepted-artifact-kinds: [ homebrew-formula ]
credentials: []
github-permissions:
  distribute:
    contents: read
  observe:
    contents: read
preflight: [ { id: probe-tap-formula, uses: git-file-preflight, with: { agreement: [ path, bytes ] } } ]
distribute: [ { id: promote-tap-formula, uses: github-app-promote-file, with: { authority: short-lived-app-token, commit: deterministic } } ]
observe:
  - { id: observe-tap, uses: git-public-observe, with: { retrieval: public-client, deadline-seconds: 300 } }
verify:
  - { id: verify-tap-formula, uses: homebrew-verify-formula, with: { compare: [ commit-object, formula-bytes, urls, checksums, branch-head ] } }
requirements: [ { id: app-tap-authority, class: authority }, { id: public-tap-readback, class: security-control } ]
control-subtractions: []
guarantees:
  - { id: exact-homebrew-formula, statement: Public tap bytes agree with the sealed formula. }
  - { id: short-lived-tap-authority, statement: Promotion uses repository-scoped short-lived App authority. }
conformance:
  cases:
    - { id: tap-promotion, fixture: fixtures/homebrew/promotion, asserts: [ exact-formula, deterministic-commit, public-readback ] }
    - { id: tap-conflict, fixture: fixtures/homebrew/conflict, asserts: [ conflict-rejection, no-overwrite ] }
  live:
    operation: homebrew-live-conformance
    proves: [ app-authority, public-readback, idempotent-retry ]
