$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships: { realizes: debian-repository, part-of: debian }
role: distribution
configuration: ./debian-repository.config.yml#/$defs/configuration
destination: ./debian-repository.config.yml#/$defs/destination
primitives: [ debian-preflight, invoke-delivery-action, debian-observe, debian-verify ]
tools: []
accepted-artifact-kinds: [ debian-package ]
credentials: [ { id: delivery-token, process-variable: INTENTIONAL_DEBIAN_DELIVERY_TOKEN } ]
github-permissions:
  distribute:
    contents: read
  observe:
    contents: read
preflight: [ { id: probe-debian-index, uses: debian-preflight, with: { agreement: [ package, version, architecture, sha256 ] } } ]
distribute: [ { id: deliver-debian-package, uses: invoke-delivery-action, with: { action: configured-pinned-action, artifact: exact-sealed-package } } ]
observe:
  - { id: observe-debian-index, uses: debian-observe, with: { retrieval: public-client, deadline-seconds: 600 } }
verify:
  - { id: verify-debian-package, uses: debian-verify, with: { compare: [ index, sha256, downloaded-bytes ] } }
requirements: [ { id: pinned-delivery-action, class: authority }, { id: public-apt-readback, class: security-control } ]
control-subtractions: []
guarantees:
  - { id: exact-debian-package, statement: Public repository bytes agree with the sealed Debian package. }
  - { id: repository-owned-delivery, statement: Destination-specific delivery behavior remains in the pinned repository Action. }
conformance:
  cases:
    - { id: debian-delivery, fixture: fixtures/debian/delivery, asserts: [ pinned-action, exact-package, public-index ] }
    - { id: debian-conflict, fixture: fixtures/debian/conflict, asserts: [ conflict-rejection, no-overwrite ] }
  live:
    operation: debian-live-conformance
    proves: [ pinned-action, public-readback, idempotent-retry ]
