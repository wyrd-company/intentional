# ---
# relationships: { realizes: homebrew-tap }
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/destinations/homebrew-tap/config"
title: Homebrew Tap recipe configuration catalog
$defs:
  configuration: { type: object, additionalProperties: false }
  destination:
    type: object
    additionalProperties: false
    required: [ repository ]
    properties: { repository: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._-]*$" } }
