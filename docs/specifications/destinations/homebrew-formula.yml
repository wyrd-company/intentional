$schema: https://refinery.systems/ontology/specification
relationships:
  {
    realizes: [homebrew, ecosystem-recipes, recipe-catalog],
    models: intentional,
  }
description: >-
  Defines credential-free derivation of a Homebrew formula from sealed
  executable archives.
format: json-schema
validation-criteria: >-
  The artifact names every executable-archive prerequisite explicitly. Its
  stable version, platform source URLs, SHA-256 checksums, package identity, and
  install path agree with the Release Plan and consumed Release Artifact records.
  The rendered Ruby formula passes the maintained Homebrew reader. Provenance
  references every consumed artifact record.
