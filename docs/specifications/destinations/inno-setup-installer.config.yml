# ---
# relationships: { realizes: inno-setup-installer }
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/destinations/inno-setup-installer.config.yml
title: Inno Setup installer recipe configuration catalog
$defs:
  version-1:
    type: object
    additionalProperties: false
    required: [ script ]
    properties:
      script:
        $ref: https://intentional.foo/schemas/config.yml#/$defs/exact-path
        description: Tracked root .iss file whose include tree becomes compiler input.
      defines:
        type: object
        description: Stable repository policy passed as non-secret compiler defines.
        propertyNames:
          pattern: "^(?![Ii][Nn][Tt][Ee][Nn][Tt][Ii][Oo][Nn][Aa][Ll]_)[A-Za-z][A-Za-z0-9_]*$"
        additionalProperties:
          type: string
  artifact-version-1:
    type: object
    additionalProperties: false
    required: [ architectures, output-name ]
    properties:
      architectures:
        type: array
        description: Architectures installed by this one setup executable.
        minItems: 1
        uniqueItems: true
        items:
          enum: [ x86, x64, arm64 ]
      output-name:
        type: string
        description: Exact final Release Record asset name.
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*[.]exe$"
