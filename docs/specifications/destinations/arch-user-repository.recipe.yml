$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships: { realizes: arch-user-repository, part-of: arch }
role: distribution
configuration: ./arch-user-repository.config.yml#/$defs/configuration
destination: ./arch-user-repository.config.yml#/$defs/destination
primitives: [ git-file-preflight, aur-promote, git-public-observe, arch-verify-package ]
tools: []
accepted-artifact-kinds: [ arch-package ]
credentials: [ { id: ssh-key, process-variable: INTENTIONAL_AUR_SSH_KEY } ]
github-permissions:
  distribute:
    contents: read
  observe:
    contents: read
preflight: [ { id: probe-aur, uses: git-file-preflight, with: { agreement: [ pkgbuild, srcinfo ] } } ]
distribute: [ { id: promote-aur, uses: aur-promote, with: { commit: deterministic, force: false } } ]
observe:
  - { id: observe-aur, uses: git-public-observe, with: { retrieval: public-client, deadline-seconds: 300 } }
verify:
  - { id: verify-aur, uses: arch-verify-package, with: { compare: [ commit-object, name, version, sources, checksums, branch-head ] } }
requirements: [ { id: aur-ssh-authority, class: authority }, { id: public-git-readback, class: security-control } ]
control-subtractions: []
guarantees:
  - { id: exact-aur-descriptors, statement: Public PKGBUILD and SRCINFO agree with the sealed bundle. }
  - { id: isolated-aur-authority, statement: Only the Arch publisher receives the SSH key. }
conformance:
  cases:
    - { id: aur-promotion, fixture: fixtures/aur/promotion, asserts: [ exact-bundle, deterministic-commit, public-readback ] }
    - { id: aur-conflict, fixture: fixtures/aur/conflict, asserts: [ conflict-rejection, no-force ] }
  live:
    operation: aur-live-conformance
    proves: [ isolated-secret, public-readback, idempotent-retry ]
