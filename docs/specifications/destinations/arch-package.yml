$schema: https://refinery.systems/ontology/specification
relationships:
  { realizes: [arch, ecosystem-recipes, recipe-catalog], models: intentional }
description: >-
  Defines credential-free derivation of Arch package descriptors from sealed
  executable archives.
format: json-schema
validation-criteria: >-
  The artifact names every executable-archive prerequisite explicitly. Its
  stable version, source URLs, checksums, package identity, architecture, and
  install path agree with the Release Plan and consumed Release Artifact records.
  PKGBUILD and SRCINFO agree with each other and pass maintained Arch readers.
  Provenance references every consumed artifact record.
