$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/destinations/arch-user-repository/config"
title: Arch User Repository recipe configuration catalog
$defs:
  configuration: { type: object, additionalProperties: false }
  destination:
    type: object
    additionalProperties: false
    required: [ package-name ]
    properties: { package-name: { type: string, pattern: "^[a-z0-9][a-z0-9+._-]*$" } }
