$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/destinations/arch-user-repository.config.yml
title: Arch User Repository recipe configuration catalog
$defs:
  version-1: { type: object, additionalProperties: false }
  destination-version-1:
