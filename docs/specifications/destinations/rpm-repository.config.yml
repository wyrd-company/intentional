# ---
# relationships: { realizes: rpm-repository }
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/destinations/rpm-repository/config"
title: RPM Repository recipe configuration catalog
$defs:
  configuration:
    type: object
    additionalProperties: false
    required: [ delivery-action ]
    properties: { delivery-action: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._-]*(?:/(?!\.{1,2}(?:/|@))(?!.*\/\.{1,2}(?:/|@))(?!.*//)(?!.*[*?\[\]{}])[^/@]+(?:/[^/@]+)*)?@[0-9a-f]{40}$' } }
  destination:
    type: object
    additionalProperties: false
    required: [ base-url, channel ]
    properties:
      base-url: { type: string, format: uri, pattern: "^https://" }
      channel: { type: string, pattern: "^[a-z0-9][a-z0-9._-]*$" }
