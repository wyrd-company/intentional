# ---
# relationships: { realizes: homebrew-formula }
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/destinations/homebrew-formula.config.yml
title: Homebrew Formula recipe configuration catalog
$defs:
  version-1:
    type: object
    additionalProperties: false
    properties:
      maintainer: { type: string, minLength: 1 }
      license: { type: string, minLength: 1 }
  artifact-version-1:
    type: object
    additionalProperties: false
    required: [package-name]
    properties:
      package-name: { type: string, pattern: "^[a-z0-9][a-z0-9+._-]*$" }
      install-path: { type: string, pattern: "^/[^*?\\[\\]{}]+$" }
