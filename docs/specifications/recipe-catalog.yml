$schema: https://refinery.systems/ontology/specification
relationships:
  realizes: ecosystem-recipes
  models:
    - intentional
description: >-
  Defines the normative machine-readable contract for Intentional-maintained
  recipe catalogs. A catalog has one recipe role and binds exact
  configuration-schema fragments, maintained primitives, tools, requirements,
  guarantees, conformance cases, and the lifecycle operations owned by its role.
  Package catalogs define discovery,
  planning, build, collection, artifact validation, and any accepted prerequisite
  artifact kinds used for derivation. They can also select one declared primitive
  as their native tag contract. Signing catalogs define
  input validation, transformation, and output validation. Direct Distribution
  catalogs define preflight, submission, observation, and verification. A
  review-gated Distribution catalog instead defines a callback contract whose
  validated event continues into its nested observation and verification
  operations. Signing and
  Distribution catalogs declare their exact GitHub token permission additions
  and logical credentials independently. Signing catalogs also declare every
  recipe-fixed GitHub variable used for non-secret authority routing and every
  resolved configuration property injected from workspace settings.
  `docs/specifications/recipe-catalog.schema.yml` is the machine-readable
  definition.
format: json-schema
validation-criteria: >-
  A conforming catalog validates against
  `docs/specifications/recipe-catalog.schema.yml` as YAML interpreted by JSON
  Schema Draft 2020-12. Its filename stem supplies recipe identity. Operation
  IDs, tool IDs,
  requirement IDs, guarantee IDs, artifact-kind IDs, credential IDs, matrix IDs,
  and conformance IDs are unique within their owning collections. Every artifact
  kind declares native or Intentional asset-name authority. Primitive and
  runner references resolve to entries compiled into the exact Intentional
  binary. Configuration and destination references resolve to role-named
  fragments in the same recipe family's config asset and have disjoint top-level
  property names so Release Workspace `with` values normalize without precedence
  rules. Every operation
  binds declared inputs and outputs through its primitive's typed contract.
  Semantic validation rejects missing references, reference cycles, duplicate
  producers, role-incompatible primitives, undeclared authority, incoherent
  security-control subtraction, direct Distribution catalogs without top-level
  observation and verification, review-gated catalogs with operations outside
  their callback, Signing variables outside the Intentional namespace, duplicate
  logical or physical variable identities, authored values for injected Signing
  properties, missing injection sources, and conformance cases that name absent
  behavior.
  Catalog compilation expands every catalog canonically and compares it with its
  committed conformance expectations. Recipe shape and behavior changes
  contribute directly to the Intentional semantic version.
