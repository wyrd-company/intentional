$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - repository-initialization
  models:
    - intentional
description: >-
  Defines the normative `.intentional/init-plan.yml` contract and equivalent
  structured output for Release Workspace reconciliation. The plan binds
  repository evidence to inferred configuration, explicit ownership and
  exclusion decisions, imported-tool parity, planned operations, and computed
  readiness.
  `docs/specifications/initialization-plan.schema.yml` is the machine-readable
  definition.
format: json-schema
validation-criteria: >-
  A conforming plan validates against
  `docs/specifications/initialization-plan.schema.yml` as YAML interpreted by
  JSON Schema Draft 2020-12 and passes Intentional's semantic validation.
  Unknown fields are rejected. Candidate identifiers and retained resolutions
  must agree with current evidence. Every accepted candidate has one Release
  Unit ownership outcome or an evidence-bound exclusion. `ready` is valid only
  when every diagnostic and candidate is resolved, imported parity is
  equivalent, the source fingerprint is current, and the inferred Release
  Workspace configuration is valid. A plan with no imported release tool
  represents parity as `equivalent` with an empty Release Unit comparison.
  Human-readable and structured renderings must expose the same decisions and
  planned operations. Ordinary successful initialization emits a `ready` plan
  with the configuration under `inferred-config`. Optional `next-actions` lists
  the ordered release process handoff after planned operations: `intentional
  model` only if the model remains absent, then `apply a release process
  template`. A needs-input result omits this member. The post-commit baseline
  command precedes the handoff during takeover. Next actions are computed on
  every run; editing them grants no authority.
