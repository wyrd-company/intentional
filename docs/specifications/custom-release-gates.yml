$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - extensions
    - repository-initialization
  models:
    - intentional
description: >-
  Defines the extracted GitHub reusable-workflow interfaces accepted at
  `.github/workflows/intentional-custom-candidate-release-gate.yml` and
  `.github/workflows/intentional-custom-release-unit-record-gate.yml`. The Custom
  Candidate Release Gate receives candidate Release Plan and source identity
  before repository authority. The Custom Release Unit Record Gate receives
  established Release and Release Unit identity plus the complete expected
  artifact identity set before evidence assembly. Both interfaces receive
  read-only repository authority, inherit no secrets, and pass or block their
  transition through workflow completion. The Custom Release Unit Record Gate
  emits Evidence Contributions only through the contribution Action.
  `custom-release-gates.schema.yml` is the machine-readable extracted-interface
  definition.
format: json-schema
validation-criteria: >-
  Intentional parses each reserved workflow as GitHub Actions YAML, projects its
  `workflow_call` interface into the normalized record defined by
  `docs/specifications/custom-release-gates.schema.yml`, and validates exact
  agreement. Custom Candidate Release Gate requires string inputs `plan-digest`,
  `source-commit`, `source-tree`, `interpretation-contract`, and
  `generator-version`. Custom Release Unit Record Gate requires string inputs
  `plan-digest`, `global-tag`, `release-unit-id`, `release-unit-tag`,
  `target-commit`, and `artifact-record-digests-json`. Every input is required.
  Neither interface declares outputs or callable secrets. The generated caller
  grants only `contents: read`; the called workflow can reduce but cannot
  increase that GitHub token ceiling. A successful workflow passes its
  transition. A failed or cancelled workflow blocks it. Display name, internal
  jobs, runners, Actions, and user-owned environments remain repository-owned.
