# ---
# relationships:
#   realizes: transport-manifest
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/0.2/transport-manifest
title: Intentional cross-job transport manifest
type: object
additionalProperties: false
required: [ $schema, digest, kind, semantic-owner, producer, release, files ]
properties:
  $schema:
    const: https://intentional.foo/schemas/0.2/transport-manifest
  digest:
    $ref: "https://intentional.foo/schemas/0.2/release-plan#/$defs/digest"
  kind:
    enum:
      - release-candidate
      - release-artifact
      - evidence-contribution
      - tag-record
      - release-evidence
  semantic-owner:
    type: string
    minLength: 1
  producer:
    $ref: "#/$defs/producer"
  release:
    oneOf:
      - $ref: "#/$defs/candidate-release"
      - $ref: "https://intentional.foo/schemas/0.2/release-artifact#/$defs/release-identity"
  files:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/file"
$defs:
  stable-id:
    $ref: "https://intentional.foo/schemas/0.2/config#/$defs/stable-id"
  exact-path:
    $ref: "https://intentional.foo/schemas/0.2/config#/$defs/exact-path"
  digest:
    $ref: "https://intentional.foo/schemas/0.2/release-plan#/$defs/digest"
  git-object:
    $ref: "https://intentional.foo/schemas/0.2/release-plan#/$defs/git-object"
  candidate-release:
    type: object
    additionalProperties: false
    required: [ plan-digest, source-commit, source-tree ]
    properties:
      plan-digest: { $ref: "#/$defs/digest" }
      source-commit: { $ref: "#/$defs/git-object" }
      source-tree: { $ref: "#/$defs/git-object" }
  producer:
    type: object
    additionalProperties: false
    required: [ workflow, job, role ]
    properties:
      workflow: { $ref: "#/$defs/exact-path" }
      job: { $ref: "#/$defs/stable-id" }
      role:
        enum:
          - prepare
          - custom-candidate-release-gate
          - custom-release-unit-record-gate
          - materialize
          - establish
          - build
          - sign
          - upload
          - assemble
          - close
  file:
    type: object
    additionalProperties: false
    required: [ semantic-id, path, media-type, size, digest ]
    properties:
      semantic-id:
        type: string
        minLength: 1
      path: { $ref: "#/$defs/exact-path" }
      media-type:
        type: string
        pattern: "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$"
      size:
        type: integer
        minimum: 0
      digest: { $ref: "#/$defs/digest" }
