$schema: https://refinery.systems/ontology/specification
relationships:
  realizes: [ inno-setup, ecosystem-recipes, recipe-catalog ]
  models: intentional
description: >-
  Defines Authenticode-enabled final Inno Setup compilation from one sealed
  inno-installer-input artifact.
format: json-schema
validation-criteria: >-
  The Signing job verifies the complete input artifact before importing the
  configured certificate. It runs the pinned Inno Setup compiler with its fixed
  SignTool integration so the setup executable and generated uninstaller are
  both signed. It verifies the expected certificate thumbprint, digest algorithm,
  setup signature, and uninstaller signature before emitting one inno-installer
  Release Artifact. Provenance names the unsigned input artifact. Signing
  credentials are erased with the isolated job and never reach Package or
  Distribution roles.
