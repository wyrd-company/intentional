$schema: https://refinery.systems/ontology/specification
relationships:
  realizes: [ inno-setup, azure-artifact-signing, recipe-catalog ]
  models: intentional
description: >-
  Defines final Inno Setup compilation whose setup executable and generated
  uninstaller receive Azure Artifact Signing Public Trust Authenticode
  signatures.
format: json-schema
validation-criteria: >-
  The Signing job verifies the complete inno-installer-input artifact before it
  enters the protected release environment. It authenticates to Azure through a
  GitHub OpenID Connect token and resolves the recipe-fixed organization
  variables. The pinned Inno Setup compiler invokes the pinned Artifact Signing
  SignTool client during compilation so both setup and generated uninstaller are
  signed. Every signature uses SHA-256 and the recipe-maintained Microsoft RFC
  3161 timestamp service. Output validation proves the Public Trust chain,
  Authenticode code-signing usage, Artifact Signing Public Trust marker,
  workspace-configured durable subscriber identity, trusted timestamp,
  certificate validity at that timestamp, setup signature, and uninstaller
  signature. The resulting inno-installer Release Artifact
  records both signatures, resolved Azure account and profile, Release-derived
  correlation ID, and provenance reference to the unsigned input artifact.
  Signing failure emits no installer.
