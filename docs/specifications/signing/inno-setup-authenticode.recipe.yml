$schema: https://intentional.foo/schemas/recipe-catalog.yml
relationships: { realizes: inno-setup-authenticode, part-of: inno-setup }
role: signing
versions:
  1:
    configuration: ./inno-setup-authenticode.config.yml#/$defs/version-1
    primitives:
      - { id: verify-input-artifacts, version: 1 }
      - { id: import-pfx-certificate, version: 1 }
      - { id: compile-inno-installer, version: 1 }
      - { id: verify-authenticode, version: 1 }
      - { id: write-release-artifact, version: 1 }
    tools:
      - id: inno-setup
        resolution: { exact: 7.0.2 }
        install: { id: install-inno-setup, version: 1 }
      - id: windows-signtool
        resolution: { windows-sdk: runner-pinned }
        install: { id: select-windows-sdk-tool, version: 1 }
    accepted-artifact-kinds: [ inno-installer-input ]
    output-artifact-kind: inno-installer
    input-validation:
      - id: verify-inno-input
        uses: { id: verify-input-artifacts, version: 1 }
        with: { kind: inno-installer-input, inventory: complete }
    signing:
      - id: import-certificate
        uses: { id: import-pfx-certificate, version: 1 }
        with: { scope: ephemeral-user-store, thumbprint: configured }
      - id: compile-signed-installer
        uses: { id: compile-inno-installer, version: 1 }
        with:
          { signtool: sha256, targets: [ setup, uninstaller ], input: sealed }
    output-validation:
      - id: verify-signed-installer
        uses: { id: verify-authenticode, version: 1 }
        with:
          { targets: [ setup, uninstaller ], thumbprint: configured, digest: sha256 }
      - id: record-signed-installer
        uses: { id: write-release-artifact, version: 1 }
        with:
          schema: https://intentional.foo/schemas/release-artifact.yml
          provenance: input-artifact
    credentials:
      - id: authenticode-certificate
        process-variable: INTENTIONAL_AUTHENTICODE_CERTIFICATE
      - id: authenticode-certificate-password
        process-variable: INTENTIONAL_AUTHENTICODE_CERTIFICATE_PASSWORD
    github-permissions:
      sign: { contents: read }
    requirements:
      - { id: ephemeral-certificate-import, class: authority }
      - { id: signed-setup-and-uninstaller, class: operational }
    control-subtractions: []
    guarantees:
      - id: signed-inno-output
        statement: Setup and generated uninstaller carry the configured Authenticode identity.
      - id: input-bound-signing
        statement: Signed installer provenance names the exact sealed compiler input.
    conformance:
      cases:
        - id: signed-installer
          fixture: fixtures/inno-setup/signed
          asserts: [ setup-signature, uninstaller-signature, exact-provenance ]
        - id: certificate-conflict
          fixture: fixtures/inno-setup/certificate-conflict
          asserts: [ thumbprint-conflict, no-output ]
