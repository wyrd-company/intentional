$schema: https://intentional.foo/schemas/recipe-catalog.yml
relationships:
  realizes: inno-setup-azure-artifact-signing
  part-of: inno-setup
role: signing
versions:
  1:
    configuration: ./inno-setup-azure-artifact-signing.config.yml#/$defs/version-1
    primitives:
      - { id: verify-input-artifacts, version: 1 }
      - { id: authenticate-azure-oidc, version: 1 }
      - { id: compile-inno-installer, version: 1 }
      - { id: verify-azure-authenticode, version: 1 }
      - { id: write-release-artifact, version: 1 }
    tools:
      - id: inno-setup
        resolution: { exact: 7.0.2 }
        install: { id: install-inno-setup, version: 1 }
      - id: azure-artifact-signing-client-tools
        resolution: { exact: 1.0.4 }
        install: { id: install-azure-artifact-signing-client-tools, version: 1 }
      - id: windows-signtool
        resolution: { windows-sdk: 10.1.26100.4188 }
        install: { id: select-windows-sdk-tool, version: 1 }
    accepted-artifact-kinds: [ inno-installer-input ]
    output-artifact-kind: inno-installer
    input-validation:
      - id: verify-inno-input
        uses: { id: verify-input-artifacts, version: 1 }
        with: { kind: inno-installer-input, inventory: complete }
    signing:
      - id: authenticate-artifact-signing
        uses: { id: authenticate-azure-oidc, version: 1 }
        with:
          {
            environment: intentional-release,
            variables: recipe-contract,
            secret: none,
          }
      - id: compile-signed-installer
        uses: { id: compile-inno-installer, version: 1 }
        with:
          {
            signtool: azure-artifact-signing,
            targets: [ setup, uninstaller ],
            digest: sha256,
            timestamp: http://timestamp.acs.microsoft.com,
            correlation: release-derived,
            input: sealed,
          }
    output-validation:
      - id: verify-signed-installer
        uses: { id: verify-azure-authenticode, version: 1 }
        with:
          {
            targets: [ setup, uninstaller ],
            trust: public,
            marker-eku: 1.3.6.1.4.1.311.97.1.0,
            subscriber-identity: configured,
            digest: sha256,
            timestamp: required,
          }
      - id: record-signed-installer
        uses: { id: write-release-artifact, version: 1 }
        with:
          schema: https://intentional.foo/schemas/release-artifact.yml
          provenance: input-artifact
          signatures: complete
    credentials: []
    variables:
      - { id: azure-client-id, github-variable: INTENTIONAL_AZURE_CLIENT_ID }
      - { id: azure-tenant-id, github-variable: INTENTIONAL_AZURE_TENANT_ID }
      - {
          id: azure-subscription-id,
          github-variable: INTENTIONAL_AZURE_SUBSCRIPTION_ID,
        }
      - {
          id: artifact-signing-endpoint,
          github-variable: INTENTIONAL_AZURE_ARTIFACT_SIGNING_ENDPOINT,
        }
      - {
          id: artifact-signing-account,
          github-variable: INTENTIONAL_AZURE_ARTIFACT_SIGNING_ACCOUNT,
        }
      - {
          id: artifact-signing-profile,
          github-variable: INTENTIONAL_AZURE_ARTIFACT_SIGNING_PROFILE,
        }
    configuration-injections:
      - {
          property: expected-subscriber-identity,
          workspace-setting: azure-artifact-signing-subscriber-identity,
        }
    github-permissions:
      sign: { contents: read, id-token: write }
    requirements:
      - { id: protected-signing-environment, class: authority }
      - { id: artifact-signing-oidc-federation, class: authority }
      - { id: artifact-signing-profile-signer-role, class: authority }
      - { id: public-trust-profile, class: security-control }
      - { id: signed-setup-and-uninstaller, class: operational }
    control-subtractions: []
    guarantees:
      - id: signed-inno-output
        statement: >-
          Setup and generated uninstaller carry the configured durable Public
          Trust subscriber identity.
      - id: secretless-signing-authority
        statement: >-
          Azure signing authority is exchanged from the protected job's GitHub
          OpenID Connect identity.
      - id: input-bound-signing
        statement: Signed installer provenance names the exact sealed compiler input.
    conformance:
      cases:
        - id: signed-installer
          fixture: fixtures/inno-setup/azure-signed
          asserts:
            [ setup-signature, uninstaller-signature, timestamp, exact-provenance ]
        - id: subscriber-conflict
          fixture: fixtures/inno-setup/subscriber-conflict
          asserts: [ subscriber-identity-conflict, no-output ]
        - id: missing-oidc
          fixture: fixtures/inno-setup/missing-oidc
          asserts: [ authority-unavailable, no-output ]
