$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships: { realizes: windows-pe-azure-artifact-signing, part-of: azure-artifact-signing }
role: signing
configuration: ./windows-pe-azure-artifact-signing.config.yml#/$defs/configuration
primitives:
  - verify-input-artifacts
  - authenticate-azure-oidc
  - sign-windows-pe-archive
  - verify-azure-authenticode
  - write-release-artifact
tools:
  - id: azure-artifact-signing-client-tools
    resolution: { exact: 1.0.4 }
    install: install-azure-artifact-signing-client-tools
  - id: windows-signtool
    resolution: { windows-sdk: 10.1.26100.4188 }
    install: select-windows-sdk-tool
accepted-artifact-kinds: [ executable-archive ]
output-artifact-kind: executable-archive
input-validation:
  - id: verify-windows-executable-archive
    uses: verify-input-artifacts
    with: { kind: executable-archive, platform: windows, payload: exactly-one-portable-executable, signature: absent }
signing:
  - id: authenticate-artifact-signing
    uses: authenticate-azure-oidc
    with: { environment: intentional-release, variables: recipe-contract, secret: none }
  - id: sign-portable-executable
    uses: sign-windows-pe-archive
    with: { digest: sha256, timestamp: 'http://timestamp.acs.microsoft.com', correlation: release-derived, archive-layout: preserve-canonical }
output-validation:
  - id: verify-signed-portable-executable
    uses: verify-azure-authenticode
    with: { targets: [ executable ], trust: public, marker-eku: 1.3.6.1.4.1.311.97.1.0, subscriber-identity: configured, digest: sha256, timestamp: required }
  - id: record-signed-executable-archive
    uses: write-release-artifact
    with:
      schema: https://intentional.foo/schemas/0.2/release-artifact
      provenance: input-artifact
      signatures: complete
credentials: []
variables:
  - { id: azure-client-id, github-variable: INTENTIONAL_AZURE_CLIENT_ID }
  - { id: azure-tenant-id, github-variable: INTENTIONAL_AZURE_TENANT_ID }
  - { id: azure-subscription-id, github-variable: INTENTIONAL_AZURE_SUBSCRIPTION_ID }
  - { id: artifact-signing-endpoint, github-variable: INTENTIONAL_AZURE_ARTIFACT_SIGNING_ENDPOINT }
  - { id: artifact-signing-account, github-variable: INTENTIONAL_AZURE_ARTIFACT_SIGNING_ACCOUNT }
  - { id: artifact-signing-profile, github-variable: INTENTIONAL_AZURE_ARTIFACT_SIGNING_PROFILE }
configuration-injections:
  - { property: expected-subscriber-identity, workspace-setting: azure-artifact-signing-subscriber-identity }
github-permissions:
  sign:
    contents: read
    id-token: write
requirements:
  - { id: protected-signing-environment, class: authority }
  - { id: artifact-signing-oidc-federation, class: authority }
  - { id: artifact-signing-profile-signer-role, class: authority }
  - { id: public-trust-profile, class: security-control }
  - { id: signed-windows-portable-executable, class: operational }
control-subtractions: []
guarantees:
  - id: signed-portable-executable
    statement: >-
      The archive's executable carries the configured durable Public Trust subscriber identity.
  - id: secretless-signing-authority
    statement: >-
      Azure signing authority is exchanged from the protected job's GitHub OpenID Connect identity.
  - id: input-bound-signing
    statement: Signed archive provenance names the exact unsigned executable archive.
conformance:
  cases:
    - id: signed-executable-archive
      fixture: fixtures/windows-pe/azure-signed
      asserts: [ executable-signature, canonical-archive, timestamp, exact-provenance ]
    - id: rotating-leaf-certificate
      fixture: fixtures/windows-pe/rotating-leaf
      asserts: [ subscriber-identity-agreement, leaf-thumbprint-not-pinned ]
    - id: subscriber-conflict
      fixture: fixtures/windows-pe/subscriber-conflict
      asserts: [ subscriber-identity-conflict, no-output ]
    - id: missing-oidc
      fixture: fixtures/windows-pe/missing-oidc
      asserts: [ authority-unavailable, no-output ]
