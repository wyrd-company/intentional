$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - evidence
    - managed-workflow
  models:
    - intentional
description: >-
  Defines the typed inventory attached to every temporary cross-job bundle in
  managed workflow. The manifest identifies the bundle kind and semantic owner,
  binds it to candidate or established Release identity, names the producing job
  role, and inventories every transported file by exact path, media type, byte
  size, and SHA-256 digest. Temporary GitHub Actions artifact names and workflow
  run identifiers can locate transport but never determine semantic identity.
  `transport-manifest.schema.yml` is the machine-readable definition.
format: json-schema
validation-criteria: >-
  A conforming manifest validates against
  `docs/specifications/transport-manifest.schema.yml` as canonical JSON under
  JSON Schema Draft 2020-12. Its digest is the `sha256:` digest of canonical JSON
  with only `digest` omitted. File paths are exact, relative, unique, and sorted
  lexically. Semantic IDs are unique. Every downloaded byte has one inventory
  entry and every entry has one file. The receiver validates manifest digest,
  Release identity, expected producer role and semantic IDs, file size, and file
  digest before parsing any transported record. Missing, extra, duplicate,
  renamed, or disagreeing contents reject the bundle.
