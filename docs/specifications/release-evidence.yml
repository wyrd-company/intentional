$schema: https://refinery.systems/ontology/specification
relationships: {}
format: json-schema
description: >-
  `intentional-evidence.yml` is the durable, human-readable release-wide
  evidence statement produced by `intentional evidence assemble` in an output
  directory beside an `attachments/` directory containing accepted contributed
  files. The statement is attached to the draft GitHub Release and frozen when that
  Release is published. It identifies S, R, the global tag and tag object, the
  sealed plan, and the producing GitHub workflow run. That release identity is
  derived by proving the assembling checkout: assembly resolves the annotated
  global release tag the checked-out commit publishes and rebuilds the release
  from the accepted source commit, refusing the checkout unless the rebuilt plan
  digest, tree, commit, tag object and tag name all match the published tag. It
  is not taken from the publisher evidence fragments and not read from an
  unproved checkout, so a repository that configures no publication still
  produces a complete statement, and a fragment identifying some other release
  is refused however many other fragments agree with it. The plan digest
  recorded there is the digest the reproduced plan's own payload determines, so
  the statement's plan binding rests on a derivation rather than on agreement
  between claims. Its deterministic
  release-unit sections contain the complete accepted publisher-evidence
  fragments. Repository-owned contribution values appear unchanged under their
  isolated namespaces without interpretation by Intentional. The separate
  `contribution-attachments` inventory binds every accepted contributed Release
  asset's flat name and SHA-256 digest to its contributor namespace.
validation-criteria: >-
  A statement conforms when it validates against
  `release-evidence.json-schema.yml`, its artifact attestation verifies the
  exact asset digest and producing workflow, its release identity matches the
  immutable GitHub Release, and assembly confirms exactly one expected fragment
  for every configured publisher target with no unexpected identities or
  semantic disagreement with applicable phase-tag evidence. A release that
  configures no publisher target expects no fragment and conforms with an empty
  `release-units` section; its identity requirements do not weaken. Assembly also
  verifies that `contribution-attachments` and its output directory contain exactly
  the accepted contributed files. `intentional
  verify release VERSION` performs durable-record verification; its `--live`
  form additionally performs fresh post-closure public retrieval and
  destination readback. Live verification reports its current observation and
  never rewrites the immutable Release evidence assembled before closure.
