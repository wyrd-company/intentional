$schema: https://intentional.foo/schemas/security-postures.yml
relationships:
  realizes: security-postures
controls:
  - id: repository-owner-app
    statement: Repository writes use short-lived installation tokens minted from an owner-operated GitHub App.
    removes-guarantee-ids:
      - owner-controlled-release-authority
  - id: protected-default-branch
    statement: Default-branch release writes pass an active ruleset with the release App as the named bypass actor.
    removes-guarantee-ids:
      - protected-release-source
  - id: protected-managed-tags
    statement: Managed tag creation, update, and deletion are restricted to the release App authority.
    removes-guarantee-ids:
      - unforgeable-managed-trigger
  - id: protected-release-environment
    statement: Every credential-bearing repository job enters the fixed reviewed release environment.
    removes-guarantee-ids:
      - reviewed-privileged-transition
  - id: immutable-github-release
    statement: Closure publishes a GitHub Release whose assets and state are immutable.
    removes-guarantee-ids:
      - immutable-durable-record
  - id: artifact-attestations
    statement: Closure creates and verifies attestations for the final evidence statement and release assets.
    removes-guarantee-ids:
      - independently-verifiable-assets
  - id: pinned-actions
    statement: Every maintained GitHub Action executes at an immutable revision recorded by generation.
    removes-guarantee-ids:
      - reviewed-execution-code
guarantees:
  - id: owner-controlled-release-authority
    statement: Intentional never possesses the repository owner's release credential.
  - id: protected-release-source
    statement: Release source reaches the default branch only through the configured ruleset authority path.
  - id: unforgeable-managed-trigger
    statement: Only the protected release authority can create the tag that starts managed Release Record assembly.
  - id: reviewed-privileged-transition
    statement: A distinct owner-approved environment gate precedes every privileged repository transition.
  - id: immutable-durable-record
    statement: Closure leaves one immutable GitHub Release per affected Release Unit containing its complete durable evidence record.
  - id: independently-verifiable-assets
    statement: Attestations and annotated tags provide independent verification paths for release assets and identity.
  - id: reviewed-execution-code
    statement: Generated jobs execute only maintained Actions selected at immutable revisions.
profiles:
  robust:
    1:
      removed-controls: []
      guarantees:
        - owner-controlled-release-authority
        - protected-release-source
        - unforgeable-managed-trigger
        - reviewed-privileged-transition
        - immutable-durable-record
        - independently-verifiable-assets
        - reviewed-execution-code
      required-settings:
        - id: release-app-installation
          scope: repository
          configuration:
            owner-operated: true
            repository-selection: selected
            permissions:
              contents: write
          verification: observable
        - id: default-branch-ruleset
          scope: repository
          configuration:
            enforcement: active
            target: default-branch
            bypass-actor: release-app
            bypass-mode: always
          verification: observable
        - id: managed-tag-ruleset
          scope: repository
          configuration:
            enforcement: active
            target: managed-tag-namespaces
            create-update-delete-actor: release-app
          verification: observable
        - id: release-environment
          scope: environment
          configuration:
            name: intentional-release
            protected-refs-only: true
            required-reviewers: 1
            prevent-self-review: true
            administrator-bypass: false
          verification: observable
        - id: release-app-identifier
          scope: environment
          configuration:
            kind: variable
          verification: observable
        - id: release-app-private-key
          scope: environment
          configuration:
            kind: secret
          verification: presence-only
        - id: immutable-releases
          scope: repository
          configuration:
            enabled: true
          verification: observable
        - id: artifact-attestations
          scope: repository
          configuration:
            enabled: true
          verification: observable
        - id: actions-policy
          scope: repository
          configuration:
            maintained-actions-pinned: true
          verification: observable
