# ---
# relationships:
#   realizes: release-artifact
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/release-artifact.yml
title: Intentional Release Artifact
type: object
additionalProperties: false
required:
  - $schema
  - digest
  - operation
  - release
  - package
  - artifact
  - provenance
  - contents
  - attached-components
properties:
  $schema:
    const: https://intentional.foo/schemas/release-artifact.yml
  digest:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
  operation:
    $ref: "#/$defs/operation"
  release:
    $ref: "#/$defs/release-identity"
  package:
    $ref: "#/$defs/package"
  artifact:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/artifact-expectation"
  provenance:
    $ref: "#/$defs/provenance"
  contents:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/content"
  attached-components:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/attached-component"
allOf:
  - if:
      properties:
        operation:
          properties:
            role:
              const: sign
          required: [role]
      required: [operation]
    then:
      properties:
        provenance:
          required: [input-artifact]
    else:
      properties:
        provenance:
          not:
            required: [input-artifact]
  - if:
      properties:
        artifact:
          required: [prerequisite-artifacts]
      required: [artifact]
    then:
      properties:
        provenance:
          required: [input-artifacts]
$defs:
  stable-id:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/stable-id"
  exact-path:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/exact-path"
  asset-name:
    type: string
    minLength: 1
    pattern: "^[^/]+$"
  digest:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
  git-object:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/git-object"
  semver:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/semver"
  operation:
    type: object
    additionalProperties: false
    required: [role, id]
    properties:
      role:
        enum: [build, sign]
      id:
        $ref: "#/$defs/stable-id"
  release-identity:
    type: object
    additionalProperties: false
    required:
      - global-tag
      - identity-tags
      - target-commit
      - plan-digest
      - interpretation-contract
      - generator
      - security-posture
    properties:
      global-tag:
        $ref: "#/$defs/global-tag"
      identity-tags:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/tag-object-reference"
      target-commit:
        $ref: "#/$defs/git-object"
      plan-digest:
        $ref: "#/$defs/digest"
      interpretation-contract:
        const: contract-1
      generator:
        $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/generator"
      security-posture:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/profile-ref"
  global-tag:
    type: object
    additionalProperties: false
    required: [id, name, object]
    properties:
      id:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/workspace-tag-id"
      name:
        $ref: "#/$defs/semver"
      object:
        $ref: "#/$defs/git-object"
  tag-object-reference:
    type: object
    additionalProperties: false
    required: [tag-id, tag-object]
    properties:
      tag-id:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/tag-id"
      tag-object:
        $ref: "#/$defs/git-object"
  package:
    type: object
    additionalProperties: false
    required: [id, release-unit, version]
    properties:
      id:
        $ref: "#/$defs/stable-id"
      release-unit:
        $ref: "#/$defs/stable-id"
      version:
        $ref: "#/$defs/semver"
  provenance:
    type: object
    additionalProperties: false
    required: [source, builder, recipe, parameters]
    properties:
      source:
        $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/source"
      builder:
        $ref: "#/$defs/builder"
      recipe:
        $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/resolved-recipe"
      parameters:
        type: object
      input-artifact:
        $ref: "#/$defs/artifact-record-reference"
      input-artifacts:
        type: array
        minItems: 1
        uniqueItems: true
        items: { $ref: "#/$defs/input-artifact-reference" }
  artifact-record-reference:
    type: object
    additionalProperties: false
    required: [id, record-digest]
    properties:
      id:
        $ref: "#/$defs/stable-id"
      record-digest:
        $ref: "#/$defs/digest"
  input-artifact-reference:
    type: object
    additionalProperties: false
    required: [release-unit-id, package-id, artifact-id, record-digest]
    properties:
      release-unit-id: { $ref: "#/$defs/stable-id" }
      package-id: { $ref: "#/$defs/stable-id" }
      artifact-id: { $ref: "#/$defs/stable-id" }
      record-digest: { $ref: "#/$defs/digest" }
  builder:
    type: object
    additionalProperties: false
    required: [provider, workflow, job]
    properties:
      provider:
        const: github-actions
      workflow:
        $ref: "#/$defs/exact-path"
      job:
        $ref: "#/$defs/stable-id"
  content:
    type: object
    additionalProperties: false
    required: [id, kind, digests]
    properties:
      id:
        $ref: "#/$defs/stable-id"
      kind:
        enum: [file, image]
      path:
        $ref: "#/$defs/exact-path"
      size:
        type: integer
        minimum: 0
      reference:
        type: string
        minLength: 1
      digests:
        $ref: "#/$defs/content-digests"
    allOf:
      - if:
          properties:
            kind:
              const: file
          required: [kind]
        then:
          required: [path, size]
          not:
            required: [reference]
      - if:
          properties:
            kind:
              const: image
          required: [kind]
        then:
          required: [reference]
          not:
            anyOf:
              - required: [path]
              - required: [size]
  content-digests:
    type: object
    minProperties: 1
    required: [sha256]
    propertyNames:
      $ref: "#/$defs/stable-id"
    properties:
      sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
    additionalProperties:
      type: string
      minLength: 1
  attached-component:
    type: object
    additionalProperties: false
    required: [id, kind, identity, content-ids]
    properties:
      id:
        $ref: "#/$defs/stable-id"
      kind:
        $ref: "#/$defs/stable-id"
      identity:
        type: object
      content-ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/stable-id"
