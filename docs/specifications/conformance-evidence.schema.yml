# ---
# relationships:
#   realizes: conformance-evidence
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/conformance-evidence.yml
title: Intentional recipe conformance evidence
type: object
additionalProperties: false
required:
  - $schema
  - digest
  - generator
  - recipe
  - case
  - mode
  - assertions
  - authority-checks
  - outcome
properties:
  $schema:
    const: https://intentional.foo/schemas/conformance-evidence.yml
  digest:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
  generator:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/generator"
  recipe:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/resolved-recipe"
  case:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/stable-id"
  mode:
    enum: [hermetic, live]
  fixture:
    $ref: "#/$defs/fixture"
  destination:
    type: object
  assertions:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/assertion"
  authority-checks:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/authority-check"
  outcome:
    enum: [supported, unsupported, incomplete]
allOf:
  - if:
      properties:
        mode: { const: hermetic }
      required: [mode]
    then:
      required: [fixture]
      not: { required: [destination] }
  - if:
      properties:
        mode: { const: live }
      required: [mode]
    then:
      required: [destination]
      not: { required: [fixture] }
$defs:
  stable-id:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/stable-id"
  digest:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
  fixture:
    type: object
    additionalProperties: false
    required: [path, digest]
    properties:
      path:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/exact-path"
      digest: { $ref: "#/$defs/digest" }
  assertion:
    type: object
    additionalProperties: false
    required: [id, state, observations]
    properties:
      id: { $ref: "#/$defs/stable-id" }
      state:
        enum: [passed, failed, unobserved]
      observations:
        type: object
  authority-check:
    type: object
    additionalProperties: false
    required: [id, kind, state]
    properties:
      id: { $ref: "#/$defs/stable-id" }
      kind:
        enum: [credential-presence, setting]
      state:
        enum: [present, absent, unverifiable, agreeing, conflicting]
