$schema: https://refinery.systems/ontology/specification
relationships: {}
format: json-schema
description: >-
  A publication observation is the schema-backed YAML result a repository-local
  recipe writes after it reads one destination back and performs its applicable
  closure-time consumer retrieval. Intentional commands never mutate a registry
  and never hold publisher credentials, so the secret-bearing readback runs in
  repository-local recipe steps and this document is the only thing
  `intentional verify publication` learns about a destination. Its
  `--observation` option names the file.

  The observation identifies one publication by release unit, publisher, and
  canonical target, and reports what the readback found as `state`. `present`
  records the observed subject, the packager that produced it, native build
  provenance, the metadata components actually attached, the destination
  readback, the closure-time retrieval, and the mutable destination aliases
  read back after promotion. `pending` reports a destination that accepted the
  publication but has not made it observable, and `absent` reports a
  destination holding no release under the expected identity; neither carries
  destination detail. `conflict` names the observed identity, checksum, or
  digest that disagrees with the expected release.

  `subject.version` and `destination.version` both carry the version the sealed
  release plan assigns that release unit, spelled exactly as the plan spells it.
  Verification compares both against the plan, which is what stops a stale
  observation from an earlier release of the same publication being accepted
  under this release's identity. An ecosystem that decorates or normalizes the
  version it reports back records its own spelling as a `destination-aliases`
  entry rather than in `destination.version`, so a recipe never has to choose
  between reporting the destination faithfully and passing the binding check.

  `retrieval.mode` identifies what the retrieval actually proved. `public`
  means the recipe retrieved the release through the destination's normal
  unauthenticated consumer path. `authenticated-draft` means the target
  depended on an asset of the still-draft GitHub Release and retrieved those
  bytes through the authenticated GitHub API. `authenticated-registry` means the
  destination admits no anonymous read at all, so its normal client path is an
  authenticated one and the recipe drove that path with a credential whose
  authority bounds what the observation proves. The GitHub Package Registry
  recipe retrieves in a separate job whose job-scoped `GITHUB_TOKEN` has
  `packages: read` and no package-write authority. It therefore proves that a
  consumer-equivalent reader can retrieve the published package. A maintained
  recipe that instead reuses a publishing credential proves only that a holder
  of that credential can retrieve the release. The verification command records
  the observed mode unchanged and refuses any mode but the one the destination's
  maintained recipe fixes, so a public destination cannot claim an authenticated
  check it did not perform and a destination that serves no anonymous client
  cannot claim a public one.

  `retrieval.client` and `retrieval.version` describe the client that performed
  the retrieval, not the release it retrieved: the consumer tool the recipe
  drove and that tool's own version. The release version is `subject.version`
  and `destination.version`, and a client version is never compared with either.

  `retrieval.digest` holds the bytes the client actually retrieved, spelled in
  whatever form that client reports — an npm integrity string, a registry
  checksum, an OCI descriptor digest — rather than a canonical form the protocol
  imposes on every ecosystem. The observation therefore states what was
  retrieved; it does not by itself state that what was retrieved is the
  published subject. Establishing that equality is the recipe's obligation,
  discharged with the client's own tooling before the observation is written,
  because only the recipe holds the credentials and the ecosystem knowledge to
  compare a client-side artifact with a destination-side one. Verification
  records the digest unchanged and compares it only against later observations
  of the same publication. A client that reports no digest of its own records
  one the recipe computes over the bytes it retrieved, because the field states
  what the client received; the destination's own published checksum is a
  destination-side claim and belongs in `destination.digest`.

  `authenticated-draft` is the one mode whose retrieved bytes the protocol can
  check for itself. Those bytes are an asset of the still-draft GitHub Release,
  and the draft-asset handoff already verifies each retrieved asset against the
  canonical `sha256:` inventory the release sealed. A recipe therefore records
  that same canonical `sha256:` digest as `retrieval.digest` for this mode, so
  the handoff's verified result and the observation's claim are the same value
  and joining them is a comparison rather than a translation.

  The observation contains no timestamps or other wall-clock values, so the
  publisher-evidence fragment derived from it is byte-identical across runs and
  across runners.
validation-criteria: >-
  An observation conforms when it validates against
  `publication-observation.json-schema.yml`; its release unit, publisher, and
  canonical target name a publication the workspace configuration selects; its
  destination identity is the configured registry or repository; its subject and
  destination versions are the release plan's version for that release unit; and
  its state carries exactly the members that state admits. `intentional verify
  publication` re-reads the document under the adapter's bounded
  eventual-consistency policy: a missing document and a `pending` state remain
  pending until the deadline, a `conflict` fails immediately, an `absent`
  observation after a completed publish attempt fails, and reaching the
  deadline is a distinct retryable failure. The command writes its
  publisher-evidence fragment only after a `present` observation passes every
  check, including that `retrieval.mode` is the mode the destination's
  maintained recipe fixes. An `authenticated-draft` retrieval spells its digest
  in the canonical `sha256:` form the draft-asset inventory uses; every other
  mode spells it in the retrieving client's own form.
