# ---
# relationships:
#   realizes: release-candidate-bundle
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/release-candidate-bundle.yml
title: Intentional release candidate bundle
type: object
additionalProperties: false
required:
  - $schema
  - digest
  - source
  - plan
  - materialization
  - expected-tag-ids
  - tag-order
  - release-notes
properties:
  $schema:
    const: https://intentional.foo/schemas/release-candidate-bundle.yml
  digest:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
  source:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/source"
  plan:
    $ref: "https://intentional.foo/schemas/release-plan.yml"
  materialization:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/operation"
  expected-tag-ids:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "https://intentional.foo/schemas/config.yml#/$defs/tag-id"
  tag-order:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "https://intentional.foo/schemas/config.yml#/$defs/tag-id"
  release-notes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/release-note"
$defs:
  exact-path:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/exact-path"
  digest:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
  stable-id:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/stable-id"
  operation:
    type: object
    additionalProperties: false
    required: [kind, path, before-digest, after-digest]
    properties:
      kind:
        enum: [write, delete]
      path: { $ref: "#/$defs/exact-path" }
      before-digest:
        oneOf:
          - { const: absent }
          - { $ref: "#/$defs/digest" }
      after-digest:
        oneOf:
          - { const: absent }
          - { $ref: "#/$defs/digest" }
  release-note:
    type: object
    additionalProperties: false
    required: [release-unit, path, digest]
    properties:
      release-unit: { $ref: "#/$defs/stable-id" }
      path: { $ref: "#/$defs/exact-path" }
      digest: { $ref: "#/$defs/digest" }
