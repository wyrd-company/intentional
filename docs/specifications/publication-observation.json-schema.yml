# ---
# relationships:
#   implements: github-release-executor
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/publication-observation/v1
title: Intentional publication observation
type: object
additionalProperties: false
required:
  - $schema
  - contract
  - release-unit
  - publisher
  - target
  - state
properties:
  $schema:
    const: https://intentional.foo/schemas/publication-observation/v1
  contract:
    const: publication-observation-1
  release-unit:
    type: string
    minLength: 1
  publisher:
    enum: [ npm, cargo, homebrew, rpm, apt, aur, oci ]
  target:
    type: string
    minLength: 1
  state:
    enum: [ present, pending, absent, conflict ]
  subject:
    $ref: "#/$defs/subject"
  packager:
    type: object
    additionalProperties: false
    required: [ id, version ]
    properties:
      id:
        type: string
        minLength: 1
      version:
        type: string
        minLength: 1
  build-provenance:
    type: array
    items:
      $ref: "#/$defs/evidence-reference"
  attached-metadata:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [ kind, digest ]
      properties:
        kind:
          enum: [ sbom, provenance, signature ]
        digest:
          type: string
          minLength: 1
        reference:
          type: string
          minLength: 1
  destination:
    type: object
    additionalProperties: false
    required: [ identity, version, digest ]
    properties:
      identity:
        type: string
        minLength: 1
      version:
        description: >-
          Release version the destination reports, carried verbatim as the
          release plan spells it. An ecosystem's own spelling of that version
          belongs in destination-aliases.
        type: string
        minLength: 1
      digest:
        type: string
        minLength: 1
  retrieval:
    type: object
    additionalProperties: false
    required: [ mode, client, version, digest ]
    properties:
      mode:
        description: >-
          Consumer path the retrieval actually used. The maintained recipe for
          the destination fixes which one is admissible, so a recipe never
          chooses between describing its retrieval faithfully and passing
          verification.
        enum: [ public, authenticated-draft, authenticated-registry ]
      client:
        description: >-
          Consumer tool the recipe drove to retrieve the release.
        type: string
        minLength: 1
      version:
        description: >-
          Version of the retrieving client itself, not of the release it
          retrieved. The release version is subject.version and
          destination.version.
        type: string
        minLength: 1
      digest:
        description: >-
          Bytes the client actually retrieved, spelled in that client's own
          form. Establishing that those bytes are the published subject is the
          recipe's obligation, discharged before the observation is written. An
          authenticated-draft retrieval is the exception: its bytes are a draft
          Release asset, so it records the canonical sha256: digest the
          draft-asset inventory uses.
        type: string
        minLength: 1
    allOf:
      - if:
          required: [ mode ]
          properties:
            mode:
              const: authenticated-draft
        then:
          properties:
            digest:
              $ref: "#/$defs/sha256"
  destination-aliases:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [ name, digest ]
      properties:
        name:
          type: string
          minLength: 1
        digest:
          type: string
          minLength: 1
  conflict:
    type: string
    minLength: 1
allOf:
  - if:
      required: [ state ]
      properties:
        state:
          const: present
    then:
      required: [ subject, packager, destination, retrieval ]
  - if:
      required: [ state ]
      properties:
        state:
          enum: [ pending, absent ]
    then:
      allOf:
        - not: { required: [ subject ] }
        - not: { required: [ packager ] }
        - not: { required: [ build-provenance ] }
        - not: { required: [ attached-metadata ] }
        - not: { required: [ destination ] }
        - not: { required: [ retrieval ] }
        - not: { required: [ destination-aliases ] }
  - if:
      required: [ state ]
      properties:
        state:
          const: conflict
    then:
      required: [ conflict ]
    else:
      not: { required: [ conflict ] }
$defs:
  sha256:
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  subject:
    type: object
    additionalProperties: false
    required: [ kind, identity, version, digest ]
    properties:
      kind:
        type: string
        minLength: 1
      identity:
        type: string
        minLength: 1
      version:
        type: string
        minLength: 1
      digest:
        $ref: "#/$defs/sha256"
  evidence-reference:
    type: object
    additionalProperties: false
    required: [ kind, digest ]
    properties:
      kind:
        type: string
        minLength: 1
      digest:
        type: string
        minLength: 1
      reference:
        type: string
        minLength: 1
