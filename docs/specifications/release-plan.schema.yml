# ---
# relationships:
#   realizes: release-plan
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/0.2/release-plan
title: Intentional Release Plan
type: object
additionalProperties: false
required:
  - $schema
  - digest
  - generator
  - source
  - release-units
  - tags
  - tag-order
properties:
  $schema:
    const: https://intentional.foo/schemas/0.2/release-plan
  digest:
    $ref: "#/$defs/digest"
  generator:
    $ref: "#/$defs/generator"
  source:
    $ref: "#/$defs/source"
  channel:
    $ref: "#/$defs/channel"
  release-units:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/release-unit"
  tags:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/tag"
  tag-order:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/tag-id"
$defs:
  stable-id:
    $ref: "https://intentional.foo/schemas/0.2/config#/$defs/stable-id"
  digest:
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  git-object:
    type: string
    pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
  semver:
    type: string
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
  channel:
    type: string
    pattern: "^[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*$"
  generator:
    type: object
    additionalProperties: false
    required: [ tool, version ]
    properties:
      tool:
        const: intentional
      version:
        $ref: "#/$defs/semver"
  source:
    type: object
    additionalProperties: false
    required: [ commit, tree ]
    properties:
      commit:
        $ref: "#/$defs/git-object"
      tree:
        $ref: "#/$defs/git-object"
  release-unit:
    type: object
    additionalProperties: false
    required:
      - id
      - old-version
      - new-version
      - bump
      - contributing-intent-ids
      - tag-ids
      - release-notes
    properties:
      id:
        $ref: "#/$defs/stable-id"
      old-version:
        $ref: "#/$defs/semver"
      new-version:
        $ref: "#/$defs/semver"
      bump:
        enum: [ major, minor, patch ]
      contributing-intent-ids:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/stable-id"
      tag-ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/tag-id"
      release-notes:
        type: string
        minLength: 1
  tag-id:
    $ref: "https://intentional.foo/schemas/0.2/config#/$defs/tag-id"
  tag:
    type: object
    additionalProperties: false
    required: [ id, kind, name, version, tag-after ]
    properties:
      id:
        $ref: "#/$defs/tag-id"
      kind:
        enum: [ release-unit, workspace ]
      name:
        type: string
        minLength: 1
      version:
        $ref: "#/$defs/semver"
      release-unit:
        $ref: "#/$defs/stable-id"
      role:
        enum: [ primary, projection ]
      require-phase:
        $ref: "https://intentional.foo/schemas/0.2/config#/$defs/tag-phase"
      tag-after:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/tag-id"
    allOf:
      - if:
          properties:
            kind:
              const: release-unit
        then:
          required: [ release-unit, role ]
      - if:
          properties:
            kind:
              const: workspace
        then:
          not:
            anyOf:
              - required: [ release-unit ]
              - required: [ role ]
