# ---
# relationships:
#   realizes: release-plan
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/0.2/release-plan
title: Intentional Release Plan
type: object
additionalProperties: false
required:
  - digest
  - contract
  - generator
  - release_units
  - tags
  - tag_order
properties:
  $schema:
    const: https://intentional.foo/schemas/0.2/release-plan
  digest:
    $ref: "#/$defs/digest"
  contract:
    const: contract-1
  generator:
    $ref: "#/$defs/generator"
  source:
    $ref: "#/$defs/source"
  channel:
    $ref: "#/$defs/channel"
  release_units:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/release-unit"
  tags:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/tag"
  tag_order:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/tag-id"
$defs:
  stable-id:
    $ref: "https://intentional.foo/schemas/0.2/config#/$defs/stable-id"
  digest:
    type: string
    pattern: "^sha256:[0-9a-f]{64}$"
  git-object:
    type: string
    pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
  semver:
    type: string
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$'
  channel:
    type: string
    pattern: "^[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*$"
  generator:
    type: object
    additionalProperties: false
    required: [ tool, version ]
    properties:
      tool:
        const: intentional
      version:
        $ref: "#/$defs/semver"
  source:
    type: object
    additionalProperties: false
    required: [ commit, tree ]
    properties:
      commit:
        $ref: "#/$defs/git-object"
      tree:
        $ref: "#/$defs/git-object"
  release-unit:
    type: object
    additionalProperties: false
    required:
      - id
      - old_version
      - new_version
      - bump
      - contributing_intent_ids
      - tag_ids
      - release_notes
    properties:
      id:
        $ref: "#/$defs/stable-id"
      old_version:
        $ref: "#/$defs/semver"
      new_version:
        $ref: "#/$defs/semver"
      bump:
        enum: [ major, minor, patch ]
      contributing_intent_ids:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/stable-id"
      tag_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/tag-id"
      release_notes:
        type: string
        minLength: 1
  tag-id:
    $ref: "https://intentional.foo/schemas/0.2/config#/$defs/tag-id"
  tag:
    type: object
    additionalProperties: false
    required: [ id, name, version ]
    properties:
      id:
        $ref: "#/$defs/tag-id"
      name:
        type: string
        minLength: 1
      version:
        $ref: "#/$defs/semver"
      release_unit:
        $ref: "#/$defs/stable-id"
      role:
        enum: [ primary, projection ]
      require_phase:
        $ref: "https://intentional.foo/schemas/0.2/config#/$defs/tag-phase"
      tag_after:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/tag-id"
    if:
      properties:
        id:
          pattern: "^workspace/"
    then:
      not:
        anyOf:
          - required: [ release_unit ]
          - required: [ role ]
    else:
      required: [ release_unit, role ]
