$schema: https://refinery.systems/ontology/specification
relationships:
  realizes: [python, ecosystem-recipes, recipe-catalog]
  models: [intentional]
description: >-
  Defines the maintained Python Package recipe family. Version 1 resolves Python
  and locked build state, invokes the native PEP 517 backend through uv, emits
  selected wheels and source distributions, validates their metadata and archive
  contents, and records Release Artifacts. Config and recipe assets share the
  `python-package` stem.
format: json-schema
validation-criteria: >-
  Version 1 accepts Python 3.14.6 and uv 0.11.21 defaults or exact project pins.
  Selected distribution kinds are non-empty and unique. Static or supported
  dynamic native version equals the Release Plan. Locked build requirements are
  current. Each produced filename, normalized project name, version, metadata,
  platform tag, inventory, archive safety result, and digest agrees with its
  expectation. A Task entrypoint declares exact output paths. Build roles receive
  no index credential and produce no unexpected distribution.
