# ---
# relationships:
#   realizes: github-npm-registry
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/ecosystems/github-npm-registry.config.yml
title: GitHub npm Registry recipe configuration catalog
$defs:
  version-1:
    type: object
    additionalProperties: false
  destination-version-1:
    type: object
    additionalProperties: false
    required: [owner, repository]
    properties:
      owner:
        type: string
        pattern: "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$"
      repository:
        type: string
        pattern: "^[A-Za-z0-9._-]+$"
      dist-tags:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
