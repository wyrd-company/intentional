$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships: { realizes: devcontainer-package, part-of: devcontainers }
role: package
package-configuration: ./devcontainer-package.config.yml#/$defs/package
artifact-configuration: ./devcontainer-package.config.yml#/$defs/artifact
primitives: [ devcontainer-discover, devcontainer-package, oci-validate-layout, write-release-artifact ]
tools:
  - { id: devcontainer, resolution: { default: 0.88.0 }, install: install-devcontainer-cli }
matrix: []
artifact-kinds:
  - { id: devcontainer-feature-layout, content: file, asset-name-source: intentional, native-kinds: [ feature ] }
  - { id: devcontainer-template-layout, content: file, asset-name-source: intentional, native-kinds: [ template ] }
discovery: [ { id: discover-devcontainers, uses: devcontainer-discover, with: { tracked-only: true } } ]
planning: [ { id: plan-devcontainer-collections, uses: devcontainer-discover, with: { aliases: [ major, major-minor ] } } ]
build: [ { id: package-devcontainer, uses: devcontainer-package, with: { output: oci-layout, registry-push: denied } } ]
collection: [ { id: collect-devcontainer-layout, uses: oci-validate-layout, with: { cardinality: selected-collections } } ]
validation:
  - { id: validate-devcontainer-layout, uses: oci-validate-layout, with: { compare: [ identity, version, metadata, contents ] } }
  - { id: record-devcontainer-artifact, uses: write-release-artifact, with: { schema: 'https://intentional.foo/schemas/0.2/release-artifact' } }
requirements: [ { id: exact-devcontainer-cli, class: operational }, { id: credential-free-package, class: authority } ]
control-subtractions: []
guarantees:
  - { id: native-devcontainer-authority, statement: Native Feature and Template metadata remain authoritative. }
  - { id: exact-devcontainer-layout, statement: Distribution receives the exact validated native package layout. }
conformance:
  cases:
    - { id: feature-collection, fixture: fixtures/devcontainers/features, asserts: [ options, dependencies, install-contents ] }
    - { id: template-collection, fixture: fixtures/devcontainers/templates, asserts: [ metadata, contents, aliases ] }
