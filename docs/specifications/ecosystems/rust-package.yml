$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - rust
    - ecosystem-recipes
    - recipe-catalog
  models:
    - intentional
description: >-
  Defines the maintained Rust Package recipe family. Version 1 discovers Cargo
  packages and distributable targets, resolves exact Rust and Task tools, plans
  locked build units, executes canonical Cargo or named Task entrypoints,
  collects Cargo-reported outputs, constructs crate and platform archives, and
  emits validated Release Artifact records. The family supports crate archives,
  the shared executable-archive artifact kind, `cdylib` archives, and `staticlib`
  archives. Task is its only custom entrypoint contract; another repository
  build runner participates through a named Task target.
  `rust-package.config.yml` defines versioned Package and artifact configuration
  fragments. `rust-package.recipe.yml` defines the declarative recipe catalog.
format: json-schema
validation-criteria: >-
  A conforming Rust Package selection names recipe `rust-package` and a version
  present in `rust-package.recipe.yml`. Package `configuration` validates against
  that version's Package fragment; each artifact `configuration` validates
  against its artifact fragment. Version 1 accepts Rust 1.85.0 as its exact
  maintained default, Task 3.52.0 for custom entrypoints, and the target triples
  declared by its recipe matrix. It uses Cross 0.2.5 for
  `aarch64-unknown-linux-gnu`. An exact project toolchain pin replaces the Rust
  default; mutable channel and minimum-Rust declarations constrain it.
  Semantic validation proves one Cargo package per Intentional Package, unique
  native target selection, common Release Unit ownership for one inherited
  workspace version, current tracked Cargo.lock state, supported target and
  runner mapping, Cargo profile and feature arguments, exact Task output paths,
  and artifact-kind compatibility. Omitted feature configuration uses Cargo's
  native default behavior. Omitted profile uses Cargo `release`. Omitted archive
  format uses ZIP on Windows and compressed tar elsewhere.

  A target-independent crate expectation retains the configured artifact ID. A
  target-specific expectation uses `<artifact-id>.<target-triple>` as its stable
  Release Plan ID. Platform asset stems use `<artifact-id>-<platform>` and prepend
  `settings.artifact-namespace-prefix` when configured. Version 1 platform names
  are `linux-x86_64`, `linux-arm64`, `macos-arm64`, and `windows-x86_64`. Windows
  assets use `.zip`; other platform archives use `.tar.gz`. Archive roots equal
  their asset stem and contain exactly one declared executable or native library
  payload with canonical permissions.

  Conformance validates Cargo metadata without dependency loading or network,
  locked planning and execution, Cargo JSON message selection, crate contents,
  platform archive structure, dirty local-result handling, authoritative-source
  evidence, and rejection of missing, duplicate, renamed, or undeclared outputs.
  Recipe and config version keys agree, every primitive and runner reference
  resolves, and retained version 1 expands identically to its compatibility
  snapshot.
