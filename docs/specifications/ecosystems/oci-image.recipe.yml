$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships: { realizes: oci-image, part-of: oci }
role: package
package-configuration: ./oci-image.config.yml#/$defs/package
artifact-configuration: ./oci-image.config.yml#/$defs/artifact
primitives: [ oci-discover, buildx-build-layout, oci-validate-layout, write-release-artifact ]
tools:
  - { id: buildx, resolution: { default: 0.17.0 }, install: install-buildx }
matrix: []
artifact-kinds: [ { id: oci-image-layout, content: file, asset-name-source: intentional, native-kinds: [ image-index ] } ]
discovery: [ { id: discover-oci-image, uses: oci-discover, with: { network: denied } } ]
planning: [ { id: plan-oci-image, uses: oci-discover, with: { platforms: configured, aliases: release-plan } } ]
build: [ { id: build-oci-layout, uses: buildx-build-layout, with: { network: dependency-only, registry-output: denied } } ]
collection: [ { id: collect-oci-layout, uses: oci-validate-layout, with: { content-addressed: true } } ]
validation:
  - { id: validate-oci-layout, uses: oci-validate-layout, with: { compare: [ platforms, labels, descriptors, sbom, provenance ] } }
  - { id: record-oci-artifact, uses: write-release-artifact, with: { schema: 'https://intentional.foo/schemas/0.2/release-artifact' } }
requirements: [ { id: exact-platform-index, class: operational }, { id: credential-free-build, class: authority }, { id: digest-pinned-base-images, class: operational } ]
control-subtractions: []
guarantees:
  - { id: sealed-oci-subject, statement: Registry publication receives one verified content-addressed image layout. }
  - { id: source-bound-image, statement: Image labels and provenance bind the release source and version. }
conformance:
  cases:
    - { id: image-index, fixture: fixtures/oci/index, asserts: [ amd64, arm64, exact-descriptors ] }
    - { id: provenance, fixture: fixtures/oci/provenance, asserts: [ source-labels, sbom, source-commit ] }
    - { id: base-images, fixture: fixtures/oci/base-images, asserts: [ digest-pinned, tag-only-rejected ] }
