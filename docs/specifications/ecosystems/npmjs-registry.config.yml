# ---
# relationships:
#   realizes: npmjs-registry
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/ecosystems/npmjs-registry/config"
title: npmjs Registry recipe configuration catalog
$defs:
  configuration:
    type: object
    additionalProperties: false
  destination:
    type: object
    additionalProperties: false
    required: [ registry, access ]
    properties:
      registry: { const: npmjs }
      access: { enum: [ public, restricted ] }
      dist-tags:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
