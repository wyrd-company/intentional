$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - node
    - ecosystem-recipes
    - recipe-catalog
  models: [ intentional ]
description: >-
  Defines the maintained Node Package recipe family. It discovers Node
  workspace packages, resolves exact package-manager and lock state, executes a
  configured native build script or Task entrypoint without credentials, packs
  the selected Package through npm, validates npm's pack inventory, and emits one
  exact `npm-package-tarball` Release Artifact. `node-package.config.yml` owns
  configuration and `node-package.recipe.yml` owns the recipe catalog.
format: json-schema
validation-criteria: >-
  The recipe accepts Node 24.18.0 and npm 11.16.0 defaults or exact project-native
  pins. One selected lockfile agrees with all included workspace manifests.
  Package identity and version equal the Release Plan. The canonical entrypoint
  can run one named package script before `npm pack`; a custom entrypoint names a
  Task target and exact tarball path. Package scripts run only in the build job.
  The resulting tarball name, package name, version, file inventory, modes, size,
  SHA-256 digest, and npm SHA-512 integrity agree with the plan and npm's JSON
  report. Missing, duplicate, private-for-publication, or undeclared output fails.
