$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships:
  realizes: rust-package
  part-of: rust
role: package
package-configuration: ./rust-package.config.yml#/$defs/package
artifact-configuration: ./rust-package.config.yml#/$defs/artifact
primitives:
  - cargo-discover
  - rust-plan-build-units
  - cargo-build
  - cargo-package
  - task-run
  - install-cross
  - cargo-collect-output
  - deterministic-archive
  - rust-validate-artifact
  - write-release-artifact
tools:
  - id: rust-toolchain
    resolution:
      project-pins:
        - rust-toolchain.toml
        - rust-toolchain
      mutable-constraints:
        - stable
        - beta
        - nightly
        - package.rust-version
      default: 1.85.0
    install: rustup-install-toolchain
  - id: cargo
    resolution:
      bundled-with: rust-toolchain
  - id: task
    resolution:
      required-for: task-entrypoint
      default: 3.52.0
    install: install-task
  - id: cross
    resolution:
      required-for:
        - aarch64-unknown-linux-gnu
      default: 0.2.5
    install: install-cross
matrix:
  - id: target
    values:
      - id: x86_64-unknown-linux-gnu
        runner: github-ubuntu-x64
        configuration:
          platform: linux-x86_64
          archive-format: tar-gz
      - id: aarch64-unknown-linux-gnu
        runner: github-ubuntu-x64
        configuration:
          platform: linux-arm64
          archive-format: tar-gz
          builder: cross
      - id: aarch64-apple-darwin
        runner: github-macos-arm64
        configuration:
          platform: macos-arm64
          archive-format: tar-gz
      - id: x86_64-pc-windows-msvc
        runner: github-windows-x64
        configuration:
          platform: windows-x86_64
          archive-format: zip
artifact-kinds:
  - id: crate-archive
    content: file
    asset-name-source: native
    native-kinds:
      - cargo-package
    configuration:
      extension: .crate
      target-independent: true
  - id: executable-archive
    content: file
    asset-name-source: intentional
    native-kinds:
      - bin
    configuration:
      target-matrix: target
  - id: cdylib-archive
    content: file
    asset-name-source: intentional
    native-kinds:
      - cdylib
    configuration:
      target-matrix: target
  - id: staticlib-archive
    content: file
    asset-name-source: intentional
    native-kinds:
      - staticlib
    configuration:
      target-matrix: target
discovery:
  - id: discover-cargo-workspace
    uses: cargo-discover
    with:
      dependency-loading: false
      network: denied
      tracked-only: true
  - id: classify-rust-artifacts
    uses: cargo-discover
    with:
      artifact-kinds:
        - crate-archive
        - executable-archive
        - cdylib-archive
        - staticlib-archive
planning:
  - id: resolve-rust-build-units
    uses: rust-plan-build-units
    with:
      lock-mode: locked
      default-profile: release
      default-features: native
      matrix: target
  - id: resolve-rust-output-identities
    uses: rust-plan-build-units
    with:
      target-id-template: "{artifact-id}.{target-triple}"
      namespace-setting: settings.artifact-namespace-prefix
build:
  - id: build-cargo-targets
    uses: cargo-build
    with:
      locked: true
      message-format: json-render-diagnostics
      profile-default: release
  - id: package-cargo-crate
    uses: cargo-package
    with:
      locked: true
      verify: true
  - id: run-task-entrypoint
    uses: task-run
    with:
      interface: intentional-rust-build-1
      outputs: exact
collection:
  - id: collect-cargo-reported-output
    uses: cargo-collect-output
    with:
      match:
        - package-id
        - target-name
        - target-kind
        - target-triple
      cardinality: exactly-one
  - id: construct-platform-archive
    uses: deterministic-archive
    with:
      root: asset-stem
      entries: exactly-one
      permissions: canonical
validation:
  - id: validate-rust-artifact
    uses: rust-validate-artifact
    with:
      source: sealed
      lockfile: required
      unexpected-outputs: reject
  - id: record-rust-artifact
    uses: write-release-artifact
    with:
      schema: https://intentional.foo/schemas/0.2/release-artifact
requirements:
  - id: tracked-current-cargo-lock
    class: operational
  - id: exact-supported-toolchain
    class: operational
  - id: sealed-source
    class: operational
  - id: credential-free-build
    class: authority
control-subtractions: []
guarantees:
  - id: native-cargo-authority
    statement: Cargo manifests and configuration remain authoritative for native Rust behavior.
  - id: locked-dependency-resolution
    statement: Every managed Rust artifact uses the tracked sealed Cargo dependency resolution.
  - id: exact-output-collection
    statement: Every output is selected by sealed native identity or an exact configured path.
  - id: build-authority-isolation
    statement: Rust build execution receives no signing or publication credential.
conformance:
  cases:
    - id: workspace-discovery
      fixture: fixtures/rust/workspace
      asserts:
        - package-boundaries
        - inherited-version-ownership
        - artifact-candidates
        - virtual-workspace-boundary
        - package-root-workspace-boundary
        - explicit-version-ownership
    - id: dependency-shapes
      fixture: fixtures/rust/dependencies
      asserts:
        - renamed-dependency-preservation
        - workspace-dependency-preservation
        - dependency-version-propagation
    - id: publication-restrictions
      fixture: fixtures/rust/publish-restrictions
      asserts:
        - default-registry-capability
        - denied-registry-rejection
        - named-registry-restriction
    - id: target-discovery
      fixture: fixtures/rust/targets
      asserts:
        - implicit-target-discovery
        - explicit-target-discovery
        - binary-artifact-candidates
        - native-library-artifact-candidates
    - id: toolchain-constraints
      fixture: fixtures/rust/toolchain-constraints
      asserts:
        - exact-project-pin
        - maintained-default-resolution
        - incompatible-constraint-rejection
    - id: lockfile-failures
      fixture: fixtures/rust/lockfile-failures
      asserts:
        - missing-lockfile-rejection
        - untracked-lockfile-rejection
        - stale-lockfile-rejection
    - id: locked-cargo-build
      fixture: fixtures/rust/locked-build
      asserts:
        - exact-toolchain
        - locked-resolution
        - cargo-message-selection
    - id: crate-package
      fixture: fixtures/rust/crate-package
      asserts:
        - normalized-manifest
        - embedded-lockfile
        - sealed-source-identity
    - id: platform-archives
      fixture: fixtures/rust/platform-archives
      asserts:
        - canonical-asset-names
        - canonical-archive-layout
        - exact-content-digests
    - id: task-entrypoint
      fixture: fixtures/rust/task-entrypoint
      asserts:
        - fixed-task-interface
        - exact-output-paths
        - development-state-reporting
