$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - rust
    - ecosystem-recipes
    - recipe-catalog
  models:
    - intentional
description: >-
  Defines the maintained Cargo Registry Distribution recipe family. It
  accepts a validated `crate-archive` Release Artifact, resolves one explicit
  Cargo-compatible registry, probes the immutable package-version identity,
  submits the exact sealed crate bytes through the Cargo registry publish
  protocol, and observes the registry index and normal download path. Cargo
  registry distribution has no mutable alias operation. `cargo-registry.config.yml`
  defines recipe and destination configuration fragments.
  `cargo-registry.recipe.yml` defines the declarative recipe catalog.
format: json-schema
validation-criteria: >-
  A conforming Cargo Registry target uses recipe `cargo-registry`. Its authored
  `with` values validate against the recipe and destination fragments. The recipe identifies
  the default registry as `crates-io`; its recipe owns the canonical sparse
  index, publish API, and download URL. Another registry destination names its
  exact index URL, publish API URL, and Cargo download URL. The download URL is
  the registry index `config.json` `dl` value. It can be a base URL or use Cargo's
  package and version placeholders. Its registry ID and index URL agree with
  tracked Cargo configuration and the Package manifest's publish policy. The
  Release Plan records the normalized complete destination, Cargo package name,
  semantic version, crate artifact identity, crate SHA-256 digest, registry
  checksum, and prerequisite Distribution IDs.

  Preflight reads the exact package and version from the registry index. Absence
  permits submission. Existing state is agreement only when the index checksum
  equals the checksum of the sealed crate and a normal consumer download returns
  the exact sealed bytes. Any other state is conflict. Submission uses one
  logical `token` credential through the fixed
  `INTENTIONAL_CARGO_REGISTRY_TOKEN` process variable. It sends the sealed crate
  bytes and metadata required by the Cargo registry protocol without rebuilding,
  repackaging, or running Package lifecycle code.

  Observation polls for at most 600 seconds at a 10-second interval. It reads the
  consumer-visible index entry, verifies package name, version, checksum, and
  exact downloaded bytes, and emits no alias observations. A target whose normal
  consumer reads require authentication performs bounded authenticated-normal
  observation in its distributor job. A publicly readable target uses a separate
  public-client verifier. Before submission, the target independently verifies
  consumer-visible agreement for every prerequisite Distribution named by the
  Release Plan. Consumer-visible agreement is required for the current workflow
  to succeed. Conformance
  covers absent, agreeing, and conflicting preflight states; exact submission;
  delayed index and download visibility; authenticated and public observation;
  ordered package distribution; idempotent retry; and malformed or inconsistent
  registry responses.
