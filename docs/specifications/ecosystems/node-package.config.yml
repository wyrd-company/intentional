# ---
# relationships:
#   realizes: node-package
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/ecosystems/node-package.config.yml
title: Node Package recipe configuration catalog
$defs:
  package-manager:
    enum: [npm, pnpm, yarn]
  task-target:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]*$"
  version-1:
    type: object
    additionalProperties: false
    properties:
      package-manager: { $ref: "#/$defs/package-manager" }
      build-script:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]*$"
      pack-directory:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/relative-root-path"
      entrypoint:
        type: object
        additionalProperties: false
        required: [task]
        properties:
          task: { $ref: "#/$defs/task-target" }
  artifact-version-1:
    type: object
    additionalProperties: false
    properties:
      output-path:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/exact-path"
