# ---
# relationships:
#   realizes: python-package
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/ecosystems/python-package.config.yml
title: Python Package recipe configuration catalog
$defs:
  version-1:
    type: object
    additionalProperties: false
    properties:
      python-version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      distributions:
        type: array
        minItems: 1
        uniqueItems: true
        items: { enum: [wheel, sdist] }
      entrypoint:
        type: object
        additionalProperties: false
        required: [task]
        properties:
          task:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]*$"
  artifact-version-1:
    type: object
    additionalProperties: false
    properties:
      kind: { enum: [wheel, sdist] }
      output-path:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/exact-path"
