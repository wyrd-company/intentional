$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/ecosystems/nuget-registry/config"
title: NuGet Registry recipe configuration catalog
$defs:
  configuration: { type: object, additionalProperties: false }
  destination:
    type: object
    additionalProperties: false
    required: [ registry, service-index ]
    properties:
      registry: { const: nuget-org }
      service-index: { const: 'https://api.nuget.org/v3/index.json' }
