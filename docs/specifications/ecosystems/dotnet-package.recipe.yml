$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships:
  realizes: dotnet-package
  part-of: dotnet
role: package
package-configuration: ./dotnet-package.config.yml#/$defs/package
artifact-configuration: ./dotnet-package.config.yml#/$defs/artifact
primitives:
  - msbuild-discover
  - dotnet-locked-restore
  - dotnet-pack
  - nuget-validate
  - write-release-artifact
tools:
  - { id: dotnet, resolution: { project-pins: [ global.json ], default: 10.0.110 }, install: install-dotnet }
  - { id: nuget, resolution: { default: 7.0.3 }, install: install-nuget }
matrix: []
artifact-kinds:
  - { id: nuget-package, content: file, asset-name-source: native, native-kinds: [ nupkg ] }
  - { id: nuget-symbol-package, content: file, asset-name-source: native, native-kinds: [ snupkg ] }
discovery:
  - { id: discover-dotnet-project, uses: msbuild-discover, with: { build: false, network: denied } }
planning:
  - { id: plan-dotnet-build, uses: msbuild-discover, with: { build: false, network: denied, validate: [ lockfile-current, package-identity, outputs ] } }
build:
  - { id: restore-dotnet-lock, uses: dotnet-locked-restore, with: { locked-mode: true } }
  - { id: pack-dotnet-project, uses: dotnet-pack, with: { no-restore: true, output: isolated-staging } }
collection:
  - { id: collect-nuget-packages, uses: nuget-validate, with: { unexpected-outputs: reject } }
validation:
  - { id: validate-nuget-packages, uses: nuget-validate, with: { compare: [ id, version, frameworks, dependencies, inventory ] } }
  - { id: record-nuget-artifacts, uses: write-release-artifact, with: { schema: 'https://intentional.foo/schemas/0.2/release-artifact' } }
requirements:
  - { id: exact-dotnet-sdk, class: operational }
  - { id: locked-restore, class: operational }
  - { id: credential-free-build, class: authority }
control-subtractions: []
guarantees:
  - { id: evaluated-msbuild-authority, statement: Package behavior comes from MSBuild evaluation under the resolved SDK. }
  - { id: exact-nuget-files, statement: Every sealed NuGet file passes native package validation. }
conformance:
  cases:
    - { id: msbuild-evaluation, fixture: fixtures/dotnet/evaluation, asserts: [ multi-targeting, central-packages, exact-version ] }
    - { id: locked-pack, fixture: fixtures/dotnet/pack, asserts: [ network-free-planning, locked-restore, nupkg, snupkg ] }
