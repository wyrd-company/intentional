$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships:
  realizes: nuget-registry
  part-of: dotnet
role: distribution
configuration: ./nuget-registry.config.yml#/$defs/configuration
destination: ./nuget-registry.config.yml#/$defs/destination
primitives:
  - nuget-preflight
  - nuget-trusted-login
  - nuget-push
  - nuget-observe
  - nuget-verify
tools:
  - { id: dotnet, resolution: { default: 10.0.110 }, install: install-dotnet }
accepted-artifact-kinds: [ nuget-package, nuget-symbol-package ]
credentials: []
github-permissions:
  distribute:
    contents: read
    id-token: write
  observe:
    contents: read
preflight:
  - { id: probe-nuget-version, uses: nuget-preflight, with: { agreement: [ package-set, downloaded-bytes ] } }
distribute:
  - id: obtain-nuget-temporary-key
    uses: nuget-trusted-login
    with: { identity: github-oidc, lifetime: destination-bounded }
  - { id: push-nuget-set, uses: nuget-push, with: { artifacts: exact-sealed-set, authentication: trusted-publishing, skip-duplicate: false } }
observe:
  - { id: observe-nuget-version, uses: nuget-observe, with: { retrieval: public-client, deadline-seconds: 600 } }
verify:
  - { id: verify-nuget-version, uses: nuget-verify, with: { compare: [ id, version, package-set, downloaded-bytes ] } }
requirements:
  - { id: nuget-trusted-publisher, class: authority }
  - { id: public-package-readback, class: security-control }
control-subtractions: []
guarantees:
  - { id: exact-nuget-distribution, statement: Consumer-visible NuGet bytes agree with the sealed package set. }
  - { id: short-lived-nuget-authority, statement: nuget.org exchanges repository-bound OpenID Connect identity for a one-use temporary key. }
conformance:
  cases:
    - { id: absent-version, fixture: fixtures/nuget/absent, asserts: [ exact-push, oidc-only ] }
    - { id: conflict, fixture: fixtures/nuget/conflict, asserts: [ conflict-rejection, no-overwrite ] }
  live:
    operation: nuget-live-conformance
    proves: [ trusted-publishing, public-readback, idempotent-retry ]
