$schema: https://intentional.foo/schemas/recipe-catalog.yml
relationships:
  realizes: dart-package
  part-of: dart
role: package
versions:
  1:
    package-configuration: ./dart-package.config.yml#/$defs/version-1
    artifact-configuration: ./dart-package.config.yml#/$defs/artifact-version-1
    primitives:
      - { id: dart-discover, version: 1 }
      - { id: dart-plan-package, version: 1 }
      - { id: dart-pack, version: 1 }
      - { id: dart-validate-package, version: 1 }
      - { id: write-release-artifact, version: 1 }
    tools:
      - id: dart
        resolution:
          { project-pins: [.tool-versions, mise.toml], default: 3.12.2 }
        install: { id: install-dart, version: 1 }
    matrix: []
    artifact-kinds:
      - {
          id: dart-package-archive,
          content: file,
          asset-name-source: native,
          native-kinds: [pub-package],
        }
    discovery:
      - {
          id: discover-dart-package,
          uses: { id: dart-discover, version: 1 },
          with: { network: denied },
        }
    planning:
      - {
          id: plan-dart-package,
          uses: { id: dart-plan-package, version: 1 },
          with: { inventory: native-pub },
        }
    build:
      - {
          id: build-dart-package,
          uses: { id: dart-pack, version: 1 },
          with: { output: isolated-staging },
        }
    collection:
      - {
          id: collect-dart-package,
          uses: { id: dart-validate-package, version: 1 },
          with: { cardinality: one },
        }
    validation:
      - {
          id: validate-dart-package,
          uses: { id: dart-validate-package, version: 1 },
          with: { compare: [name, version, inventory, bytes] },
        }
      - {
          id: record-dart-artifact,
          uses: { id: write-release-artifact, version: 1 },
          with:
            { schema: https://intentional.foo/schemas/release-artifact.yml },
        }
    requirements:
      - { id: exact-dart-toolchain, class: operational }
      - { id: credential-free-build, class: authority }
    control-subtractions: []
    guarantees:
      - {
          id: native-pub-authority,
          statement: pubspec and pub inventory rules remain authoritative.,
        }
      - {
          id: exact-dart-archive,
          statement: The sealed archive is the exact artifact submitted to pub.dev.,
        }
    conformance:
      cases:
        - {
            id: pub-inventory,
            fixture: fixtures/dart/inventory,
            asserts: [workspace, exclusions, safe-paths],
          }
        - {
            id: deterministic-archive,
            fixture: fixtures/dart/archive,
            asserts: [exact-bytes, exact-version],
          }
