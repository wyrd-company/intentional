$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships:
  realizes: dart-package
  part-of: dart
role: package
package-configuration: ./dart-package.config.yml#/$defs/package
artifact-configuration: ./dart-package.config.yml#/$defs/artifact
primitives:
  - dart-discover
  - dart-plan-package
  - dart-pack
  - dart-validate-package
  - write-release-artifact
tools:
  - id: dart
    resolution: { project-pins: [ .tool-versions, mise.toml ], default: 3.12.2 }
    install: install-dart
matrix: []
artifact-kinds:
  - { id: dart-package-archive, content: file, asset-name-source: native, native-kinds: [ pub-package ] }
discovery:
  - { id: discover-dart-package, uses: dart-discover, with: { network: denied } }
planning:
  - { id: plan-dart-package, uses: dart-plan-package, with: { inventory: native-pub } }
build:
  - { id: build-dart-package, uses: dart-pack, with: { output: isolated-staging } }
collection:
  - { id: collect-dart-package, uses: dart-validate-package, with: { cardinality: one } }
validation:
  - { id: validate-dart-package, uses: dart-validate-package, with: { compare: [ name, version, inventory, bytes ] } }
  - { id: record-dart-artifact, uses: write-release-artifact, with: { schema: 'https://intentional.foo/schemas/0.2/release-artifact' } }
requirements:
  - { id: exact-dart-toolchain, class: operational }
  - { id: credential-free-build, class: authority }
control-subtractions: []
guarantees:
  - { id: native-pub-authority, statement: pubspec and pub inventory rules remain authoritative. }
  - { id: exact-dart-archive, statement: The sealed archive is the exact artifact submitted to pub.dev. }
conformance:
  cases:
    - { id: pub-inventory, fixture: fixtures/dart/inventory, asserts: [ workspace, exclusions, safe-paths ] }
    - { id: deterministic-archive, fixture: fixtures/dart/archive, asserts: [ exact-bytes, exact-version ] }
