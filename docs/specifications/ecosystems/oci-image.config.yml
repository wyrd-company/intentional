# ---
# relationships: { realizes: oci-image }
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/ecosystems/oci-image/config"
title: OCI Image recipe configuration catalog
$defs:
  package:
    type: object
    additionalProperties: false
    required: [ context, dockerfile, platforms ]
    properties:
      context: { $ref: "https://intentional.foo/schemas/0.2/config#/$defs/relative-root-path" }
      dockerfile: { $ref: "https://intentional.foo/schemas/0.2/config#/$defs/exact-path" }
      platforms:
        type: array
        minItems: 1
        uniqueItems: true
        items: { enum: [ linux/amd64, linux/arm64 ] }
      task: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]*$" }
  artifact: { type: object, additionalProperties: false }
