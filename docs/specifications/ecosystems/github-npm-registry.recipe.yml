$schema: https://intentional.foo/schemas/0.2/recipe-catalog
relationships:
  realizes: github-npm-registry
  part-of: node
role: distribution
configuration: ./github-npm-registry.config.yml#/$defs/configuration
destination: ./github-npm-registry.config.yml#/$defs/destination
primitives:
  - npm-registry-preflight
  - npm-publish-tarball
  - npm-observe-package
  - npm-verify-package
tools:
  - id: npm
    resolution: { default: 11.16.0 }
    install: install-node-package-manager
accepted-artifact-kinds: [ npm-package-tarball ]
credentials: []
github-permissions:
  distribute:
    contents: read
    packages: write
  observe:
    contents: read
    packages: read
preflight:
  - id: probe-github-package
    uses: npm-registry-preflight
    with:
      registry: https://npm.pkg.github.com
      authentication: github-packages-read
      agreement: [ dist-integrity, downloaded-byte-digest ]
distribute:
  - id: publish-github-tarball
    uses: npm-publish-tarball
    with:
      artifact: exact-sealed-tarball
      authentication: github-packages-write
      lifecycle-scripts: denied
  - id: update-github-dist-tags
    uses: npm-publish-tarball
    with:
      aliases: release-plan
      after: immutable-version-agreement
observe:
  - id: observe-github-package
    uses: npm-observe-package
    with:
      retrieval: narrow-consumer
      deadline-seconds: 300
      interval-seconds: 10
verify:
  - id: verify-github-package
    uses: npm-verify-package
    with:
      compare: [ name, version, dist-integrity, downloaded-bytes, dist-tags ]
requirements:
  - { id: github-package-scope, class: operational }
  - { id: github-packages-write, class: authority }
  - { id: github-packages-readback, class: security-control }
control-subtractions: []
guarantees:
  - id: exact-github-npm-package
    statement: GitHub Packages integrity and downloaded bytes agree with the sealed tarball.
  - id: job-token-only-authority
    statement: Distribution uses no named secret and only the target job's GitHub packages permission.
  - id: authenticated-consumer-verification
    statement: A packages-read consumer role verifies immutable version and aliases.
conformance:
  cases:
    - id: absent-version
      fixture: fixtures/github-npm/absent
      asserts: [ exact-publish, packages-write-only ]
    - id: agreeing-version
      fixture: fixtures/github-npm/agreement
      asserts: [ idempotent-acceptance, no-republish ]
    - id: conflicting-version
      fixture: fixtures/github-npm/conflict
      asserts: [ conflict-rejection, no-overwrite ]
    - id: authenticated-readback
      fixture: fixtures/github-npm/readback
      asserts: [ packages-read-only, exact-downloaded-bytes ]
  live:
    operation: github-npm-live-conformance
    proves: [ job-token-routing, exact-distribution, authenticated-readback, idempotent-retry ]
