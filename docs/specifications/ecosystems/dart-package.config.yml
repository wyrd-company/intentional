# ---
# relationships:
#   realizes: dart-package
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/ecosystems/dart-package/config"
title: Dart Package recipe configuration catalog
$defs:
  package:
    type: object
    additionalProperties: false
    properties:
      dart-version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
  artifact:
    type: object
    additionalProperties: false
