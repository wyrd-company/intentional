# ---
# relationships:
#   realizes: dotnet-package
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/ecosystems/dotnet-package.config.yml
title: .NET Package recipe configuration catalog
$defs:
  version-1:
    type: object
    additionalProperties: false
    properties:
      sdk-version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
      symbols: { type: boolean, default: true }
  artifact-version-1:
    type: object
    additionalProperties: false
    properties: { kind: { enum: [package, symbols] } }
