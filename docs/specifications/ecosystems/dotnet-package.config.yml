# ---
# relationships:
#   realizes: dotnet-package
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: "https://intentional.foo/schemas/0.2/ecosystems/dotnet-package/config"
title: .NET Package recipe configuration catalog
$defs:
  package:
    type: object
    additionalProperties: false
    properties:
      sdk-version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
      symbols: { type: boolean, default: true }
  artifact:
    type: object
    additionalProperties: false
    properties: { kind: { enum: [ package, symbols ] } }
