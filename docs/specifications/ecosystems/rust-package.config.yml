# ---
# relationships:
#   realizes: rust-package
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/ecosystems/rust-package.config.yml
title: Rust Package recipe configuration catalog
$defs:
  rust-version:
    type: string
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  cargo-profile:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  cargo-feature:
    type: string
    minLength: 1
    pattern: "^[^\\s,]+$"
  task-target:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]*$"
  target-triple-version-1:
    enum:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - aarch64-apple-darwin
      - x86_64-pc-windows-msvc
  version-1:
    type: object
    additionalProperties: false
    properties:
      toolchain:
        $ref: "#/$defs/rust-version"
      entrypoint:
        type: object
        additionalProperties: false
        required: [task]
        properties:
          task:
            $ref: "#/$defs/task-target"
  artifact-version-1:
    type: object
    additionalProperties: false
    properties:
      targets:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/target-triple-version-1"
      profile:
        $ref: "#/$defs/cargo-profile"
      features:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/cargo-feature"
      no-default-features:
        type: boolean
      archive-format:
        enum: [tar-gz, zip]
      output-paths:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "https://intentional.foo/schemas/config.yml#/$defs/exact-path"
