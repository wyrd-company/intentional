# ---
# relationships:
#   realizes: tag-record
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/tag-record.yml
title: Intentional Tag Record
description: >-
  The protocol fields encoded in an Intentional annotated Git tag message.
type: object
additionalProperties: false
required:
  - contract
  - generator
  - plan-digest
  - tag-id
  - tag-role
  - version
  - target
  - baseline
  - prerequisites
properties:
  contract:
    const: contract-1
  generator:
    type: string
    pattern: '^intentional (0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*|\d*[A-Za-z-][\dA-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][\dA-Za-z-]*))*))?(?:\+(?:[\dA-Za-z-]+(?:\.[\dA-Za-z-]+)*))?$'
  plan-digest:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
  tag-id:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/tag-id"
  tag-role:
    enum: [primary, projection, workspace]
  version:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/semver"
  target:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/git-object"
  baseline:
    type: boolean
  prerequisites:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/prerequisite"
allOf:
  - if:
      properties:
        tag-id:
          pattern: "^workspace/"
      required: [tag-id]
    then:
      properties:
        tag-role:
          const: workspace
    else:
      properties:
        tag-role:
          enum: [primary, projection]
$defs:
  baseline-digest-payload:
    type: object
    additionalProperties: false
    required: [contract, generator, versions, baseline]
    properties:
      contract:
        const: contract-1
      generator:
        $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/semver"
      versions:
        type: object
        minProperties: 1
        propertyNames:
          oneOf:
            - $ref: "https://intentional.foo/schemas/config.yml#/$defs/stable-id"
            - $ref: "https://intentional.foo/schemas/config.yml#/$defs/workspace-tag-id"
        additionalProperties:
          $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/semver"
      baseline:
        const: true
  prerequisite:
    type: object
    additionalProperties: false
    required: [tag-id, tag-object]
    properties:
      tag-id:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/tag-id"
      tag-object:
        $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/git-object"
