$schema: https://commonclischema.org/draft/2026-04/schema
relationships:
  specifies:
    - intent-driven-polyglot-release
    - github-release-executor
  related-to: github-release-executor
tool:
  name: intentional
  mode: interactive
  summary: Intent-driven polyglot releases.
global-options:
  - name: directory
    flags:
      - -C
      - --directory
    kind: option
    description: Workspace directory used as the root for the command.
    required: false
    repeatable: false
    default: .
    value:
      type: directory
      arity:
        min: 1
        max: 1
commands:
  - name: init
    summary: Scan supported manifests and create the release-unit inventory.
    mode: non-interactive
    options:
      - name: take-over
        flags:
          - --take-over
        kind: flag
        description: Perform the explicit authority handoff from a ready Changesets plan.
        required: false
        repeatable: false
      - name: json
        flags:
          - --json
        kind: flag
        description: Emit stable structured JSON instead of human-readable initialization output.
        required: false
        repeatable: false
      - name: dry-run
        flags:
          - --dry-run
        kind: flag
        description: Print planned mutations without changing the workspace.
        required: false
        repeatable: false
    output:
      modes:
        - name: human-readable
          description: >-
            Prints the initialization state, planned operations, and unresolved
            plan path.
          machine-readable: false
        - name: json
          description: Prints the stable structured initialization result selected by --json.
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: Initialization, a ready adoption plan, or takeover completed successfully.
        - code: 1
          meaning: Input was invalid or an operational failure occurred.
        - code: 2
          meaning: The initialization plan requires resolutions or verified repository edits.
    examples:
      - intentional init
      - intentional init --json
      - intentional init --take-over --dry-run
  - name: add
    summary: Author a pending change intent.
    mode: interactive
    options:
      - name: release-unit
        flags:
          - --release-unit
        kind: option
        description: Release-unit identifier and bump separated by a colon.
        required: false
        repeatable: true
        examples:
          - sample-library:minor
        value:
          type: string
          arity:
            min: 1
            max: 1
      - name: message
        flags:
          - --message
        kind: option
        description: Changelog prose for the intent.
        required: false
        repeatable: false
        value:
          type: string
          arity:
            min: 1
            max: 1
      - name: dry-run
        flags:
          - --dry-run
        kind: flag
        description: Print the planned intent-file write without changing the workspace.
        required: false
        repeatable: false
    output:
      modes:
        - name: human-readable
          description: Prompts for omitted intent inputs and prints the planned intent-file write.
          machine-readable: false
      exit-codes:
        - code: 0
          meaning: The intent was written or its dry-run operation was printed.
        - code: 1
          meaning: Input was invalid or an operational failure occurred.
    examples:
      - intentional add
      - >-
        intentional add --release-unit sample-library:minor --message "Add a
        user-visible capability."
    notes:
      - >-
        When every --release-unit option is omitted, the command prompts for
        one release-unit identifier and bump.
      - When --message is omitted, the command prompts for changelog prose.
      - >-
        Each --release-unit value has the form id:major, id:minor, or id:patch;
        duplicate identifiers fail.
  - name: status
    summary: Show pending intents and computed release-unit versions.
    mode: non-interactive
    output:
      modes:
        - name: human-readable
          description: >-
            Prints pending intents, missing baselines, tag-record issues,
            versions, and projection drift.
          machine-readable: false
      exit-codes:
        - code: 0
          meaning: Workspace status was computed and printed.
        - code: 1
          meaning: Workspace state was invalid or could not be read.
    examples:
      - intentional status
  - name: plan
    summary: Emit canonical digest-bound release-plan JSON.
    mode: non-interactive
    options:
      - name: channel
        flags:
          - --channel
        kind: option
        description: Release channel identifier, such as beta.
        required: false
        repeatable: false
        value:
          type: string
          arity:
            min: 1
            max: 1
    output:
      modes:
        - name: canonical-json
          description: Prints the compact canonical digest-bound release plan as JSON.
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: The release plan was computed and printed.
        - code: 1
          meaning: Planning input or workspace state was invalid.
    examples:
      - intentional plan
      - intentional plan --channel beta
  - name: apply
    summary: Materialize versions, changelogs, dependencies, and intent consumption.
    mode: non-interactive
    options:
      - name: channel
        flags:
          - --channel
        kind: option
        description: Release channel identifier, such as beta.
        required: false
        repeatable: false
        value:
          type: string
          arity:
            min: 1
            max: 1
      - name: dry-run
        flags:
          - --dry-run
        kind: flag
        description: Print mutations without changing the workspace.
        required: false
        repeatable: false
    output:
      modes:
        - name: operations
          description: Prints the ordered working-tree operations performed or previewed.
          machine-readable: false
      exit-codes:
        - code: 0
          meaning: Release mutations were applied or previewed.
        - code: 1
          meaning: Planning, mutation, or workspace validation failed.
    examples:
      - intentional apply
      - intentional apply --channel beta --dry-run
  - name: stamp
    summary: Write computed versions into injected projections only.
    mode: non-interactive
    options:
      - name: prerelease
        flags:
          - --prerelease
        kind: option
        description: Prerelease identifier composed with first-parent tag height.
        required: false
        repeatable: false
        value:
          type: string
          arity:
            min: 1
            max: 1
      - name: dry-run
        flags:
          - --dry-run
        kind: flag
        description: Print mutations without changing the workspace.
        required: false
        repeatable: false
    output:
      modes:
        - name: operations
          description: Prints the ordered injected-projection writes performed or previewed.
          machine-readable: false
      exit-codes:
        - code: 0
          meaning: Projection versions were stamped or previewed.
        - code: 1
          meaning: Version calculation, projection validation, or mutation failed.
    examples:
      - intentional stamp
      - intentional stamp --prerelease alpha --dry-run
  - name: tag
    summary: Create annotated release records or establish baseline tags.
    mode: non-interactive
    options:
      - name: channel
        flags:
          - --channel
        kind: option
        description: Release channel identifier, such as beta.
        required: false
        repeatable: false
        conflicts-with:
          - baseline
        value:
          type: string
          arity:
            min: 1
            max: 1
      - name: baseline
        flags:
          - --baseline
        kind: flag
        description: Establish initial annotated tag authority from projections.
        required: false
        repeatable: false
        conflicts-with:
          - channel
          - plan
      - name: version
        flags:
          - --version
        kind: option
        description: Explicit baseline version assignment.
        required: false
        repeatable: true
        requires:
          - baseline
        examples:
          - sample-library=1.2.3
          - workspace/release=1.2.3
        value:
          type: string
          arity:
            min: 1
            max: 1
      - name: phase
        flags:
          - --phase
        kind: option
        description: Executor phase declaration required by configured release tags.
        required: false
        repeatable: false
        value:
          type: enum
          values:
            - before-publication
            - after-publication
          arity:
            min: 1
            max: 1
      - name: evidence
        flags:
          - --evidence
        kind: option
        description: >-
          Directory of built-subject and publisher-evidence documents the
          declared phase seals.
        required: false
        repeatable: false
        requires:
          - phase
        conflicts-with:
          - baseline
        value:
          type: directory
          arity:
            min: 1
            max: 1
      - name: sealed-output
        flags:
          - --sealed-output
        kind: option
        description: >-
          Directory in which to write the phase evidence the declared phase
          sealed, as its own schema-identified document.
        required: false
        repeatable: false
        requires:
          - phase
        conflicts-with:
          - baseline
        value:
          type: directory
          arity:
            min: 1
            max: 1
      - name: plan
        flags:
          - --plan
        kind: option
        description: Digest-sealed release plan to verify before creating release tags.
        required: false
        repeatable: false
        conflicts-with:
          - baseline
        value:
          type: file
          arity:
            min: 1
            max: 1
      - name: dry-run
        flags:
          - --dry-run
        kind: flag
        description: Print tag operations without changing Git state.
        required: false
        repeatable: false
    output:
      modes:
        - name: operations
          description: Prints each missing annotated-tag operation performed or previewed.
          machine-readable: false
      exit-codes:
        - code: 0
          meaning: Selected release records were verified, created, or previewed.
        - code: 1
          meaning: Arguments, release state, plan verification, or tag creation failed.
    examples:
      - intentional tag --plan release-plan.json
      - >-
        intentional tag --plan release-plan.json --phase before-publication
        --evidence phase-evidence
      - intentional tag --baseline --version sample-library=1.2.3
    notes:
      - >-
        Relative --plan, --evidence, and --sealed-output paths are resolved from
        --directory rather than from the process working directory.
      - Repeating --version for the same identifier fails.
      - >-
        A phased tag encodes canonical phase evidence in its annotated record
        when the configuration declares the one global release tag that
        evidence binds to. Such a configuration requires --evidence with
        --phase. A configuration that declares no global release tag seals no
        phase evidence and therefore accepts no --evidence, because accepting a
        directory it cannot bind would silently discard the claim it carries.
        --evidence is invalid without --phase in either case.
      - >-
        --sealed-output writes what the phase sealed as one
        `phase-tag-evidence` document named for the phase, so evidence assembly
        can classify it by document identity. The document is written whether or
        not this invocation created a tag, because a rerun that finds its phase
        tags already present carries the same sealed claim. It fails when the
        configuration seals no phase evidence at all.
      - >-
        A before-publication phase seals the built subjects and the configured
        intended destinations, and refuses to seal an empty subject set for a
        release that has publications to make. An after-publication phase seals
        the completed publisher-evidence fragments whole, and refuses to seal
        fewer than the configuration selects.
  - name: check
    summary: Validate config, intents, and deterministic planning for continuous integration.
    mode: non-interactive
    output:
      modes:
        - name: human-readable
          description: Prints check passed after successful validation.
          machine-readable: false
      exit-codes:
        - code: 0
          meaning: Workspace validation passed.
        - code: 1
          meaning: >-
            Configuration, intent, tag, baseline, drift, or deterministic
            planning validation failed.
    examples:
      - intentional check
  - name: skill
    summary: Print the agent-facing Intentional workflow skill.
    mode: non-interactive
    output:
      modes:
        - name: markdown
          description: Prints the complete SKILL.md embedded in the installed executable.
          machine-readable: false
      exit-codes:
        - code: 0
          meaning: The embedded workflow skill was printed.
        - code: 1
          meaning: Standard output could not be written.
    examples:
      - intentional skill
  - name: executor
    summary: Configure and reconcile the repository release protocol.
    mode: non-interactive
    subcommands:
      - name: init
        summary: Configure the GitHub executor and explicit publication intent.
        mode: non-interactive
        options:
          - name: dry-run
            flags:
              - --dry-run
            kind: flag
            description: Print planned configuration mutations without changing the workspace.
            required: false
            repeatable: false
        output:
          modes:
            - name: human-readable
              description: >-
                Prints discovery evidence, unresolved-plan location, and
                configuration operations.
              machine-readable: false
          exit-codes:
            - code: 0
              meaning: Executor configuration is complete or its mutations were previewed.
            - code: 1
              meaning: Configuration input was invalid or an operational failure occurred.
            - code: 2
              meaning: The executor initialization plan requires explicit resolutions.
        examples:
          - intentional executor init
          - intentional executor init --dry-run
        notes:
          - >-
            Unresolved publication choices are written to
            .intentional/executor-init-plan.yml for an agent or human to edit
            before rerunning the command.
          - >-
            Planned operations report that the repository GitHub App must be a
            ruleset bypass actor for the protected default branch and every
            Intentional-managed release tag namespace. The command does not
            mutate repository settings.
      - name: diff
        summary: Compare a managed workflow with its derived executor contract.
        mode: non-interactive
        positional-arguments:
          - name: workflow-role
            description: Executor role of the workflow being compared.
            position: 0
            required: true
            repeatable: false
            value:
              type: enum
              values:
                - release
                - publish
              arity:
                min: 1
                max: 1
        options:
          - name: workflow
            flags:
              - --workflow
            kind: option
            description: >-
              Workflow file to compare instead of the path configured for the
              selected role.
            required: false
            repeatable: false
            value:
              type: file
              arity:
                min: 1
                max: 1
          - name: format
            flags:
              - --format
            kind: option
            description: Representation of the semantic comparison result.
            required: false
            repeatable: false
            default: patch
            value:
              type: enum
              values:
                - patch
                - json
              arity:
                min: 1
                max: 1
          - name: apply
            flags:
              - --apply
            kind: flag
            description: >-
              Apply the syntax-aware transformation to the selected workflow
              and print the applied comparison.
            required: false
            repeatable: false
        output:
          modes:
            - name: patch
              description: >-
                Prints a unified patch bound to a digest of the exact workflow
                input.
              machine-readable: false
            - name: json
              description: >-
                Prints a structured comparison bound to a digest of the exact
                workflow input.
              machine-readable: true
          exit-codes:
            - code: 0
              meaning: The workflow comparison or requested transformation completed.
            - code: 1
              meaning: >-
                Configuration, recipe derivation, workflow parsing, comparison,
                stale-input protection, or mutation failed.
        examples:
          - intentional executor diff release
          - intentional executor diff publish --format json
          - intentional executor diff release --apply
          - intentional executor diff release --workflow /tmp/candidate.yml
        notes:
          - >-
            A comparison that finds drift still completes successfully and
            communicates the drift through its selected output mode. Diff
            reports; executor check is the command that fails on drift, so
            continuous integration gates on check rather than on this exit code.
          - >-
            A conformant or different result can carry advisory diagnostics
            naming consequences of the proposed transformation, such as
            workflow-level permission scopes the safe default withdraws.
          - >-
            The comparison reads a workflow of at most 2000 lines, for the
            configured path and a --workflow override alike, and refuses a
            larger one with a blocked workflow-too-large diagnostic.
          - >-
            Without --apply the command is read-only. With --apply it changes
            only the selected workflow file.
      - name: check
        summary: Check configured workflows against their derived executor contracts.
        mode: non-interactive
        output:
          modes:
            - name: human-readable
              description: >-
                Reports missing or drifted reserved slices, permissions, gate
                dependencies, contract revisions, and Action revisions.
              machine-readable: false
          exit-codes:
            - code: 0
              meaning: Every configured executor workflow conforms.
            - code: 1
              meaning: >-
                A configured workflow is nonconforming or executor validation
                could not complete.
        examples:
          - intentional executor check
  - name: release
    summary: Construct release protocol artifacts.
    mode: non-interactive
    subcommands:
      - name: prepare
        summary: Resolve the source and construct its deterministic release candidate.
        mode: non-interactive
        options:
          - name: output
            flags:
              - --output
            kind: option
            description: Directory in which to write the release-candidate handoff.
            required: true
            repeatable: false
            value:
              type: directory
              arity:
                min: 1
                max: 1
        output:
          modes:
            - name: release-candidate
              description: >-
                Writes a schema-backed release-candidate handoff containing the
                verified source commit, release commit, global tag, plan,
                changed-tree evidence, materialized candidate, and a verified
                Git bundle carrying the release commit and annotated tag objects.
                It prints one `candidate-path`, `source-sha`, `release-sha`,
                `global-tag`, and `plan-digest` identity line, each projected
                from that handoff.
              machine-readable: true
          exit-codes:
            - code: 0
              meaning: The deterministic release candidate and handoff were written.
            - code: 1
              meaning: >-
                Source resolution, remote default-branch verification,
                planning, application, candidate construction, or validation
                failed.
        examples:
          - intentional release prepare --output release-candidate
        notes:
          - >-
            The credential-free prepare-release Action wraps this command. Its
            outputs are exactly candidate-path, source-sha, release-sha,
            global-tag, and plan-digest, projected from the authoritative
            release-candidate handoff.
          - >-
            Source resolution and verification that the remote default branch
            identifies the same source commit are invariants of this command.
          - >-
            The command requires a workspace that still matches the accepted
            source commit and constructs the release commit as Git objects
            without writing release content into that workspace. It records the
            annotated global tag under a reserved ref rather than the rendered
            release tag name, because tags carry version authority and the
            release has not been accepted yet.
          - >-
            The output directory must be absent or empty. It receives the
            manifest, the sealed plan, the Git bundle, and the materialized
            release content of every added or modified path.
          - >-
            The handoff inventories a Git bundle so a later fresh privileged
            job can verify and materialize the exact unpushed commit and tag
            objects without trusting GitHub step outputs as object transport.
  - name: evidence
    summary: Construct schema-backed release evidence artifacts.
    mode: non-interactive
    subcommands:
      - name: built-subject
        summary: Record one built publishable subject produced from the released commit.
        mode: non-interactive
        options:
          - name: release-unit
            flags:
              - --release-unit
            kind: option
            description: Release-unit identifier the built subject belongs to.
            required: true
            repeatable: false
            value:
              type: string
              arity:
                min: 1
                max: 1
          - name: identity
            flags:
              - --identity
            kind: option
            description: Subject identity every configured destination resolves.
            required: true
            repeatable: false
            value:
              type: string
              arity:
                min: 1
                max: 1
          - name: subject
            flags:
              - --subject
            kind: option
            description: File or directory holding the bytes the build produced.
            required: true
            repeatable: false
            value:
              type: path
              arity:
                min: 1
                max: 1
          - name: output
            flags:
              - --output
            kind: option
            description: File in which to write the schema-backed built-subject document.
            required: true
            repeatable: false
            value:
              type: file
              arity:
                min: 1
                max: 1
        output:
          modes:
            - name: built-subject
              description: >-
                Writes one built-subject document and prints the subject,
                version, digest, and document path.
              machine-readable: true
          exit-codes:
            - code: 0
              meaning: The built subject was recorded.
            - code: 1
              meaning: >-
                The global release tag did not verify, the release unit
                publishes nothing in it, the produced bytes were absent, or the
                output already existed.
        examples:
          - >-
            intentional evidence built-subject --release-unit sample-library
            --identity sample-library --subject build/sample-library.tgz
            --output staged/built-subject.yml
        notes:
          - >-
            The version is the one the verified global release tag reproduces
            for that release unit and the digest is computed over the bytes at
            --subject, so neither is asserted by the caller. A directory digests
            as its ordered member manifest, so a renamed member is a different
            subject.
          - >-
            The command runs in a checkout of the released commit. A release
            unit the release does not publish is refused rather than recorded
            under another unit's version.
      - name: contribute
        summary: Construct one repository-owned evidence contribution bundle.
        mode: non-interactive
        options:
          - name: namespace
            flags:
              - --namespace
            kind: option
            description: Unique namespace assigned to the contribution value.
            required: true
            repeatable: false
            value:
              type: string
              arity:
                min: 1
                max: 1
          - name: value-file
            flags:
              - --value-file
            kind: option
            description: File containing any valid YAML value for the namespace.
            required: false
            repeatable: false
            groups:
              - contribution-content
            value:
              type: file
              arity:
                min: 1
                max: 1
          - name: attachment
            flags:
              - --attachment
            kind: option
            description: Exact file path to include as a GitHub Release attachment.
            required: false
            repeatable: true
            groups:
              - contribution-content
            value:
              type: file
              arity:
                min: 1
                max: 1
          - name: output
            flags:
              - --output
            kind: option
            description: Directory in which to write the contribution bundle.
            required: true
            repeatable: false
            value:
              type: directory
              arity:
                min: 1
                max: 1
        groups:
          - name: contribution-content
            members:
              - value-file
              - attachment
            rule: at-least-one
            description: A contribution contains a value, one or more attachments, or both.
        output:
          modes:
            - name: contribution
              description: >-
                Writes a schema-backed contribution manifest and its
                digest-checked attachment bundle.
              machine-readable: true
          exit-codes:
            - code: 0
              meaning: The contribution bundle was constructed.
            - code: 1
              meaning: >-
                Contribution inputs, YAML parsing, attachment resolution, or
                bundle construction failed.
        examples:
          - >-
            intentional evidence contribute --namespace malware-scan
            --value-file report-summary.yml --attachment malware-report.json
            --output contribution
        notes:
          - >-
            The credential-free contribution Action maps its newline-separated
            attachments input to repeated --attachment options, invokes this
            command, and uploads the resulting bundle as a temporary workflow
            artifact.
          - The contribution Action defines no GitHub step outputs.
      - name: assemble
        summary: Assemble publisher fragments and contributions into final release evidence.
        mode: non-interactive
        options:
          - name: input
            flags:
              - --input
            kind: option
            description: >-
              Directory containing downloaded publisher, phase-tag, and
              contribution artifacts.
            required: true
            repeatable: false
            value:
              type: directory
              arity:
                min: 1
                max: 1
          - name: output
            flags:
              - --output
            kind: option
            description: >-
              Directory in which to write the closed final-evidence bundle.
            required: true
            repeatable: false
            value:
              type: directory
              arity:
                min: 1
                max: 1
        output:
          modes:
            - name: release-evidence
              description: >-
                Writes a closed bundle containing intentional-evidence.yml and
                accepted files under attachments/.
              machine-readable: true
          exit-codes:
            - code: 0
              meaning: Final release evidence and accepted attachments were assembled.
            - code: 1
              meaning: >-
                Required evidence was missing, unexpected, conflicting,
                malformed, incorrectly bound, or failed a mechanical digest
                check.
        examples:
          - >-
            intentional evidence assemble --input evidence-artifacts --output
            release-evidence
        notes:
          - >-
            The credential-free assemble-evidence Action wraps this command and
            defines no GitHub step outputs.
          - >-
            Assembly proves the checkout it is given rather than trusting it or
            being handed a document about it. It resolves the annotated global
            release tag the checked-out commit publishes, rebuilds the release
            from the accepted source commit in an isolated local clone, and
            refuses the checkout unless the rebuilt plan digest, tree, commit,
            tag object and tag name all match what the published tag carries.
            The release identity, and the sealed release plan, come from that
            one derivation. A release that configures no publication therefore
            assembles a complete statement, because naming the release does not
            depend on a publisher having run, and a fragment identifying some
            other release is refused however many others agree with it.
          - >-
            The plan digest every accepted fragment agrees on is the digest the
            reproduced plan's own payload determines. The global release tag and
            every published subject's version are held to what that plan seals.
            The expected publication set is derived from the checkout's
            configuration and reconciled against the same plan: a release unit
            with publishers and no version bump is not in the plan, and a
            publication configured for it publishes nothing this release sealed.
          - >-
            The configuration and the manifests the publication selection
            consults are read from the working tree, so each of those reads is
            proved against the release commit: for every path assembly opens,
            the bytes on disk are compared with the blob that commit carries,
            and a path that differs or exists on only one side is reported with
            every other path that differs. Whether the checkout is otherwise
            dirty is not asked, so files assembly never opens are not reported.
            With every read held to the release commit, the configuration read
            is the configuration at the proved release commit.
          - >-
            The output directory is the complete assembly handoff. Its
            intentional-evidence.yml is the schema-backed release evidence and
            each accepted Release attachment is stored at
            attachments/<asset-basename>.
  - name: verify
    summary: Verify release protocol identities, handoffs, and evidence.
    mode: non-interactive
    subcommands:
      - name: handoff
        summary: Independently verify a prepared release-candidate handoff.
        mode: non-interactive
        positional-arguments:
          - name: handoff
            description: Release-candidate handoff directory to verify.
            position: 0
            required: true
            repeatable: false
            value:
              type: directory
              arity:
                min: 1
                max: 1
        output:
          modes:
            - name: verified-identities
              description: >-
                Prints one `source-sha`, `release-sha`, `global-tag`, and
                `plan-digest` identity line, each projected from the verified
                handoff. The identity lines are the machine-readable surface the
                verify-handoff Action reads.
              machine-readable: true
          exit-codes:
            - code: 0
              meaning: The handoff and deterministic candidate agree.
            - code: 1
              meaning: Handoff identity, digest, tree, tag, or candidate validation failed.
        examples:
          - intentional verify handoff release-candidate
        notes:
          - >-
            The credential-free verify-handoff Action wraps this command. Its
            outputs are exactly source-sha, release-sha, global-tag, and
            plan-digest, projected from the verified handoff.
          - >-
            Before exposing outputs, verification validates and imports the
            handoff's Git bundle and proves its release commit and annotated tag
            objects match the candidate. The privileged atomic-push step consumes
            those verified outputs; it does not consume unverified prepare-release
            outputs.
          - >-
            Verification rebuilds the candidate from the accepted source commit
            in an isolated clone, so the verifying repository must carry the
            release tags that hold version authority.
          - >-
            Successful verification imports the verified release commit and
            annotated global tag into the repository the privileged job pushes
            from. An identical existing record is accepted so a retry recovers,
            and a conflicting one is refused.
      - name: release-tag
        summary: Verify the current global release tag before publication.
        mode: non-interactive
        output:
          modes:
            - name: human-readable
              description: >-
                Prints the verified global tag, release commit, source parent,
                and release-plan identity.
              machine-readable: false
          exit-codes:
            - code: 0
              meaning: >-
                The current global tag, release commit, sole source parent,
                sealed plan, and materialized release state agree.
            - code: 1
              meaning: >-
                Global-tag identity, commit ancestry, plan binding, projection,
                changelog, or consumed-intent validation failed.
        examples:
          - intentional verify release-tag
        notes:
          - >-
            The credential-free verify-release-tag Action wraps this command
            for the initial job in the generated publication workflow. Its
            outputs are exactly source-sha, release-sha, global-tag, and
            plan-digest, projected from the verified release identity.
      - name: publication
        summary: Verify one destination publication and write its affirmative evidence.
        mode: non-interactive
        options:
          - name: release-unit
            flags:
              - --release-unit
            kind: option
            description: Release-unit identifier whose publication is verified.
            required: true
            repeatable: false
            value:
              type: string
              arity:
                min: 1
                max: 1
          - name: package
            flags:
              - --package
            kind: option
            description: Package identifier whose publication is verified.
            required: true
            repeatable: false
            value:
              type: string
              arity:
                min: 1
                max: 1
          - name: publisher
            flags:
              - --publisher
            kind: option
            description: Configured publisher adapter identifier.
            required: true
            repeatable: false
            value:
              type: enum
              values:
                - npm
                - cargo
                - homebrew
                - rpm
                - apt
                - aur
                - oci
              arity:
                min: 1
                max: 1
          - name: target
            flags:
              - --target
            kind: option
            description: >-
              Publisher target selector; a publisher with a primary target
              accepts omission or primary.
            required: false
            repeatable: false
            examples:
              - primary
              - npmjs
              - crates.io
              - github
              - dockerhub
              - ghcr
            value:
              type: string
              arity:
                min: 1
                max: 1
          - name: observation
            flags:
              - --observation
            kind: option
            description: >-
              Publication-observation document the recipe's readback and
              retrieval steps produced.
            required: true
            repeatable: false
            value:
              type: file
              arity:
                min: 1
                max: 1
          - name: output
            flags:
              - --output
            kind: option
            description: File in which to write schema-backed publisher evidence.
            required: true
            repeatable: false
            value:
              type: file
              arity:
                min: 1
                max: 1
          - name: draft-handoff
            flags:
              - --draft-handoff
            kind: option
            description: >-
              Draft-Release asset handoff document a draft-dependent publisher
              consumed. Required for a publisher whose consumer path resolves a
              GitHub Release asset, and refused for every other publisher.
            required: false
            repeatable: false
            value:
              type: file
              arity:
                min: 1
                max: 1
        output:
          modes:
            - name: publisher-evidence
              description: >-
                Writes a schema-backed publisher evidence fragment after
                destination readback and the recipe's applicable preclosure
                retrieval verification succeed.
              machine-readable: true
          exit-codes:
            - code: 0
              meaning: >-
                Destination readback and either normal public client retrieval
                or authenticated draft-asset retrieval prove the applicable
                preclosure contract, and its evidence was written.
            - code: 1
              meaning: >-
                Publication is conflicting, could not be verified, or remained
                unavailable past its bounded observation deadline.
        examples:
          - >-
            intentional verify publication --release-unit sample-library
            --package library --publisher npm --observation observation.yml --output
            publisher-evidence.yml
          - >-
            intentional verify publication --release-unit sample-application
            --package application --publisher oci --target ghcr --observation observation.yml
            --output publisher-evidence.yml
        notes:
          - >-
            The credential-free verify-publication Action wraps this command.
            Its only GitHub step output is evidence-path, which identifies the
            authoritative publisher-evidence file.
          - >-
            Publisher credentials and registry clients stay in repository-owned
            recipe steps, so the destination is read there and reported through
            the schema-backed publication-observation document this command
            consumes. The command is the protocol authority over that
            observation: it selects the configured publication, binds it to the
            verified release identity, classifies the observation against the
            adapter's bounded eventual-consistency policy, and writes the
            fragment only once every check succeeds.
          - >-
            A deadline failure is safe to retry at workflow level; a rerun
            reads the destination before deciding whether publication is
            already complete, pending, or absent.
          - >-
            A target independent of draft GitHub Release assets completes its
            normal public clean-client retrieval before Release closure and
            records that result in publisher evidence.
          - >-
            When a target's normal client depends on an asset held by the draft
            GitHub Release, preclosure verification downloads the exact draft
            asset through authenticated GitHub access, verifies its identity
            and digest, and records that authenticated retrieval. It does not
            represent the target as publicly client-retrievable before Release
            closure.
          - >-
            When the selected publisher defines a primary target, omitting
            --target or passing --target primary selects it. The resulting
            publisher evidence records target as primary and records the
            concrete registry or repository under the destination fields.
          - >-
            npm accepts npmjs as an alias for its constrained primary target;
            evidence normalizes the alias to primary. Its GitHub Package
            Registry target is selected explicitly as github.
          - >-
            Cargo accepts crates.io as an alias only when native Cargo
            configuration makes crates.io the primary registry. The alias
            fails when a custom registry is primary; omission or primary
            selects that custom primary without misidentifying it as crates.io.
          - >-
            A publisher without a primary target requires --target. OCI accepts
            only dockerhub or ghcr and fails when --target is omitted or set to
            primary.
      - name: release
        summary: Verify an Intentional GitHub Release and its evidence.
        mode: non-interactive
        positional-arguments:
          - name: version
            description: Release version whose GitHub Release is verified.
            position: 0
            required: true
            repeatable: false
            value:
              type: string
              arity:
                min: 1
                max: 1
        options:
          - name: live
            flags:
              - --live
            kind: flag
            description: >-
              Perform post-closure destination readback and public client
              retrieval in addition to verifying recorded evidence.
            required: false
            repeatable: false
          - name: observations
            flags:
              - --observations
            kind: option
            description: >-
              Directory of post-closure publication-observation documents a
              public consumer client produced. Requires --live. Each
              publication is read from one file whose name is its publication
              identity with every character outside A-Za-z0-9._- written as %
              and its two uppercase hexadecimal digits, followed by .yml, so
              component/package/homebrew/primary is read from
              component%2Fpackage%2Fhomebrew%2Fprimary.yml.
            required: false
            repeatable: false
            value:
              type: directory
              arity:
                min: 1
                max: 1
        output:
          modes:
            - name: human-readable
              description: >-
                Reports Release evidence, identity-chain, phase-tag,
                provenance, subject-digest, and destination verification.
              machine-readable: false
          exit-codes:
            - code: 0
              meaning: The GitHub Release and all required evidence verify.
            - code: 1
              meaning: >-
                The Release, evidence asset, attestation, identity chain, phase
                tags, provenance, subject digest, or requested live readback
                failed verification.
        examples:
          - intentional verify release 1.2.3
          - intentional verify release 1.2.3 --live
        notes:
          - >-
            Without --live, verification uses the durable recorded evidence
            and does not query publication destinations.
          - >-
            With --live, verification reads every recorded publication again
            after immutable Release closure. A draft-dependent publication is
            read back from the closed Release asset under the operator's own
            GitHub credentials, which proves the asset still carries the
            recorded subject digest and claims nothing about unauthenticated
            retrieval.
          - >-
            Live verification of a publication whose subject does not live in
            the GitHub Release requires a destination adapter for that
            publisher. Without one, --live reports the publication as
            unverifiable and names the publisher whose adapter is missing.
          - >-
            --observations supplies that adapter as documents rather than as a
            registry client. A public consumer client resolves and retrieves
            each release and writes what it found, and live verification reads
            those documents through the same publication-observation contract a
            repository-local readback uses. This is where a draft-dependent
            publisher's deferred public consumer check is performed, because
            before closure it could not truthfully claim public retrieval. A
            publication no supplied observation covers is reported rather than
            passed.
          - >-
            --observations adds the consumer check to the closed-Release
            readback rather than replacing it. A draft-dependent publication is
            read back from the Release asset whether or not observations are
            supplied, because that read and a consumer client's retrieval prove
            different claims and the richer invocation must not prove less.
            The file-name encoding is reversible, so no two publications can
            resolve to one document.
          - >-
            Live verification reports its current result and never replaces,
            appends to, or otherwise rewrites intentional-evidence.yml or any
            immutable GitHub Release asset.
notes:
  - >-
    The root invocation accepts --help and --version; every command accepts
    --help. These framework-provided controls do not form part of command input
    semantics.
  - Command-line parsing failures exit with code 2 before command execution.
