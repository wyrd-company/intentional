$schema: https://refinery.systems/ontology/specification
relationships: {}
format: json-schema
description: >-
  The contribution manifest is the YAML transport authority generated by
  `intentional evidence contribute`, normally through the credential-free
  Intentional contribution Action. It identifies one
  contributor namespace, carries an optional arbitrary YAML value, and
  inventories optional attachment files by flat GitHub Release asset name,
  bundle-relative path, and SHA-256 digest. At least a value or one attachment
  is present. The manifest is transported in a temporary workflow artifact;
  repository authors normally supply the Action inputs rather than authoring
  this document.
validation-criteria: >-
  A manifest conforms when it validates against
  `contribution.json-schema.yml`, every inventoried path resolves to a regular
  file inside the contribution bundle, each basename and digest matches, and
  assembly finds no namespace or Release-asset collision after retry
  resolution. `intentional evidence assemble` consumes the accepted manifest
  and writes accepted files beneath its output directory's `attachments/`
  subdirectory; the contributed value receives no domain validation.
