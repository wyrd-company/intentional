$schema: https://refinery.systems/ontology/specification
relationships: {}
format: json-schema
description: >-
  Intentional workspace configuration is a closed YAML document stored at
  `.intentional/config.yml`. The adjacent JSON Schema asset defines the
  `contract-2` interpretation contract, global versioning settings, fixed and
  linked release-unit groups, workspace tags, discovery dispositions, release
  units, package boundaries, version projections, dependency edges,
  annotated-tag declarations, GitHub workflow integration, and explicit
  package publisher opt-ins.
  The schema retains the published runtime identifier
  `https://intentional.foo/schemas/config.yml`.

  Release-unit and tag identifiers are mapping keys. A release unit identifies
  its workspace-relative path and one or more tags. Projections select a
  maintained ecosystem or format adapter, a release-unit-relative file, and a
  materialization mode. Generic JSON, TOML, and YAML projections also identify
  their version field by pointer. Intentional applies semantic validation after
  deserialization for graph references, tag templates and ordering, projection
  requirements, path ownership, and release-unit relationships that JSON Schema
  cannot express in isolation. Publisher properties are valid only when the
  top-level `github` property exists. Publisher properties belong to a named
  package, never directly to a release unit. Recipe selection also validates
  each configured publisher against derived package capabilities, native
  packager configuration, and compatible primary destinations.

  Publication is opt-in at the destination level. `npm.npmjs`, `npm.github`,
  and `cargo.registry` are independent target declarations. Empty npm and Cargo
  publisher mappings select no target. npmjs and Cargo use trusted publishing
  where available and their conventional bootstrap token-secret names
  otherwise, `NPM_TOKEN` and `CARGO_REGISTRY_TOKEN`. The npmjs and Cargo registry
  targets accept an optional direct `token-secret` override. GitHub Package
  Registry accepts the repository-scoped workflow token and exposes no secret
  setting.
  Docker Hub accepts direct `username-var` and
  `token-secret` overrides. Omitting these fields selects the maintained
  recipe's conventional names and trusted-publishing-first behavior; configuration
  contains identifiers for GitHub variables and secrets, never credential values.

  Every concrete publisher target whose maintained recipe defines omittable
  attached components owns an optional `omit` list. Allowed component names
  come from that target's maintained recipe. OCI targets currently define `sbom`,
  `provenance`, and
  `signature`; adapters with no omittable components do not expose the property.
  Unknown or recipe-inapplicable names fail validation.
  Release evidence records only components that were produced.
validation-criteria: >-
  A document conforms when it validates against `config.json-schema.yml` and
  Intentional's configuration loader accepts it. Core tests deserialize the
  adjacent schema, exercise closed-field and enum constraints, and verify the
  semantic invariants enforced by the loader. `intentional check` validates the
  base workspace contract, and `intentional executor check` validates its
  GitHub executor and publication extensions.
