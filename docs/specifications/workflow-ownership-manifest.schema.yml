# ---
# relationships:
#   realizes: workflow-ownership-manifest
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/workflow-ownership-manifest.yml
title: Intentional Workflow Ownership Manifest
type: object
additionalProperties: false
required:
  - $schema
  - digest
  - contract
  - generator
  - configuration-digest
  - posture
  - recipes
  - actions
  - files
properties:
  $schema:
    const: https://intentional.foo/schemas/workflow-ownership-manifest.yml
  digest:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
  contract:
    const: contract-1
  generator:
    $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/generator"
  configuration-digest:
    $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
  posture:
    $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/posture"
  recipes:
    type: array
    uniqueItems: true
    items:
      $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/resolved-recipe"
  actions:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/action-pin"
  files:
    type: array
    minItems: 2
    uniqueItems: true
    items:
      $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/owned-file"
$defs:
  stable-id:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/stable-id"
  generator:
    type: object
    additionalProperties: false
    required: [identity, source-revision, binaries]
    properties:
      identity:
        $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/generator"
      source-revision:
        $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/git-object"
      binaries:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/binary"
  binary:
    type: object
    additionalProperties: false
    required: [platform, digests]
    properties:
      platform:
        $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/stable-id"
      digests:
        $ref: "https://intentional.foo/schemas/release-artifact.yml#/$defs/content-digests"
  posture:
    type: object
    additionalProperties: false
    required:
      - security-posture
      - required-settings
      - removed-controls
      - guarantees
    properties:
      security-posture:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/profile-ref"
      required-settings:
        type: array
        uniqueItems: true
        items:
          $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/setting-requirement"
      removed-controls:
        type: array
        uniqueItems: true
        items:
          $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/stable-id"
      guarantees:
        type: array
        uniqueItems: true
        items:
          $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/stable-id"
  action-pin:
    type: object
    additionalProperties: false
    required: [id, source, revision, responsibility]
    properties:
      id:
        $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/stable-id"
      source:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._-]*$"
      path:
        $ref: "https://intentional.foo/schemas/config.yml#/$defs/exact-path"
      revision:
        $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/git-object"
      responsibility:
        $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/responsibility"
  owned-file:
    type: object
    additionalProperties: false
    required: [path, role, digest, responsibility, action-ids]
    allOf:
      - if:
          properties:
            path:
              const: .github/workflows/intentional-release.yml
        then:
          properties:
            role:
              const: release-workflow
      - if:
          properties:
            path:
              const: .github/workflows/intentional-release-record.yml
        then:
          properties:
            role:
              const: release-record-workflow
      - if:
          properties:
            path:
              pattern: '^\.github/workflows/intentional-distribute-[a-z0-9][a-z0-9._-]*\.yml$'
        then:
          properties:
            role:
              const: distribution-target-workflow
      - if:
          properties:
            role:
              const: release-workflow
        then:
          properties:
            path:
              const: .github/workflows/intentional-release.yml
      - if:
          properties:
            role:
              const: release-record-workflow
        then:
          properties:
            path:
              const: .github/workflows/intentional-release-record.yml
      - if:
          properties:
            role:
              const: distribution-target-workflow
        then:
          properties:
            path:
              pattern: '^\.github/workflows/intentional-distribute-[a-z0-9][a-z0-9._-]*\.yml$'
      - if:
          properties:
            path:
              pattern: '^\.github/workflows/intentional-internal-[a-z0-9][a-z0-9._-]*\.yml$'
        then:
          properties:
            role:
              const: reusable-workflow
      - if:
          properties:
            role:
              const: reusable-workflow
        then:
          properties:
            path:
              pattern: '^\.github/workflows/intentional-internal-[a-z0-9][a-z0-9._-]*\.yml$'
    properties:
      path:
        $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/owned-path"
      role:
        enum:
          - release-workflow
          - release-record-workflow
          - distribution-target-workflow
          - reusable-workflow
          - support-script
          - metadata
      digest:
        $ref: "https://intentional.foo/schemas/release-plan.yml#/$defs/digest"
      responsibility:
        $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/responsibility"
      action-ids:
        type: array
        uniqueItems: true
        items:
          $ref: "https://intentional.foo/schemas/workflow-ownership-manifest.yml#/$defs/stable-id"
  responsibility:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind:
            const: generator
      - type: object
        additionalProperties: false
        required: [kind, recipe]
        properties:
          kind:
            const: recipe
          recipe:
            $ref: "https://intentional.foo/schemas/config.yml#/$defs/versioned-ref"
            unevaluatedProperties: false
  owned-path:
    oneOf:
      - const: .github/workflows/intentional-release.yml
      - const: .github/workflows/intentional-release-record.yml
      - type: string
        pattern: '^\.github/workflows/intentional-distribute-[a-z0-9][a-z0-9._-]*\.yml$'
      - type: string
        pattern: '^\.github/workflows/intentional-internal-[a-z0-9][a-z0-9._-]*\.yml$'
      - type: string
        pattern: '^\.intentional/workflows/(?!ownership-manifest\.json$)(?!\.{1,2}(?:/|$))(?!.*//)(?!.*\/\.{1,2}(?:/|$))(?!.*[*?\[\]{}])[^/]+(?:/[^/]+)*$'
