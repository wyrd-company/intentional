# ---
# relationships:
#   realizes: security-postures
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/security-postures.yml
title: Intentional security posture catalog
type: object
additionalProperties: false
required: [$schema, relationships, controls, guarantees, profiles]
properties:
  $schema:
    const: https://intentional.foo/schemas/security-postures.yml
  relationships:
    $ref: "https://intentional.foo/schemas/recipe-catalog.yml#/$defs/relationships"
  controls:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/control"
  guarantees:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "https://intentional.foo/schemas/recipe-catalog.yml#/$defs/guarantee"
  profiles:
    type: object
    minProperties: 1
    propertyNames:
      $ref: "https://intentional.foo/schemas/config.yml#/$defs/stable-id"
    additionalProperties:
      type: object
      minProperties: 1
      propertyNames:
        pattern: "^[1-9][0-9]*$"
      additionalProperties:
        $ref: "#/$defs/profile"
$defs:
  stable-id:
    $ref: "https://intentional.foo/schemas/config.yml#/$defs/stable-id"
  control:
    type: object
    additionalProperties: false
    required: [id, statement, removes-guarantee-ids]
    properties:
      id:
        $ref: "#/$defs/stable-id"
      statement:
        type: string
        minLength: 1
      removes-guarantee-ids:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/stable-id"
  setting:
    type: object
    additionalProperties: false
    required: [id, scope, configuration, verification]
    properties:
      id:
        $ref: "#/$defs/stable-id"
      scope:
        enum: [repository, environment, organization]
      configuration:
        type: object
      verification:
        enum: [observable, presence-only, owner-attested]
  profile:
    type: object
    additionalProperties: false
    required: [removed-controls, guarantees, required-settings]
    properties:
      removed-controls:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/stable-id"
      guarantees:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/stable-id"
      required-settings:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/setting"
