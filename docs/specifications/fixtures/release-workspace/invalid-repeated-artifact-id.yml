# ---
# relationships:
#   tests: release-workspace
# ---
$schema: https://intentional.foo/schemas/0.2/config
workflow:
  adoption: declined
release-units:
  application:
    path: .
    packages:
      command:
        path: .
        uses: rust-package
        artifacts:
          - id: linux
            with:
              archive-format: tar-gz
    tags:
      primary:
        role: primary
        template: "application/{version}"
