$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - generation
    - managed-workflow
  models:
    - intentional
description: >-
  Defines the generated ownership record at
  `.intentional/workflows/ownership-manifest.json`. The manifest binds the entire
  repository-resident managed workflow output to the interpretation contract,
  generating Intentional source and binary release, selected security posture,
  canonical Release Workspace configuration, resolved recipes, immutable Action
  pins, and exact generated file bytes. It is the only authority generation uses
  to recognize stale Intentional-owned paths during reconciliation.
  `docs/specifications/workflow-ownership-manifest.schema.yml` is the
  machine-readable definition.
format: json-schema
validation-criteria: >-
  A conforming manifest validates against
  `docs/specifications/workflow-ownership-manifest.schema.yml` as canonical JSON
  interpreted by JSON Schema Draft 2020-12. Its `digest` is the lowercase SHA-256
  digest of the complete canonical object with only `digest` omitted. Object keys
  sort lexically; generator binaries sort by platform; recipes by ID and version;
  Action pins by ID; owned files by path; settings, controls, guarantees, and
  action IDs by stable identity. Canonical record fields use kebab-case. The
  configuration digest identifies the complete canonical Release Workspace input.
  Generator identity records the Intentional version, source revision, and every
  released binary platform and checksum required by the generated jobs. Posture
  records the selected profile version and its exact required settings, removed
  controls, and resulting guarantees. Recipes equal the complete resolved recipe
  set used by the generated protocol graph. Every Action has one immutable
  revision, optional repository-relative subpath, and generator or recipe
  responsibility. An omitted subpath means repository root. The file inventory
  contains the release and Release Record entrypoints, one independently
  event-triggered workflow per configured Distribution Target, and every
  generated reusable workflow, support script, and metadata file. A Distribution
  workflow path uses the canonical reversible, collision-free path token derived
  from the complete
  `distribution/<release-unit-id>/<package-id>/<target-id>` identity.
  Each path
  occurs once, lies in a
  reserved protocol namespace, and records its role, exact-byte digest,
  responsibility, and referenced Action IDs. Every referenced Action ID exists in
  the pin inventory. Each Action source is an `owner/repository` identity. A
  repository-owned delivery Action is recorded under its admitting recipe's
  responsibility. Owned paths are exact paths without glob syntax. The manifest does not list its own
  fixed path; its top-level digest protects its canonical bytes without a
  self-reference. Generation stages and validates the complete desired set,
  writes all other files, and publishes this manifest last. Reconciliation
  replaces any expected path whose bytes disagree, removes a stale path only when
  the prior valid manifest names it, and never treats comments or path shape
  alone as proof of ownership. Conformance
  reconstructs the desired graph and requires exact agreement in generator,
  configuration, posture, recipes, pins, file set, roles, and bytes.
