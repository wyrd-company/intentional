# ---
# relationships:
#   realizes: interpretation-contract
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://intentional.foo/schemas/interpretation-contract.yml
title: Intentional interpretation contract catalog
type: object
additionalProperties: false
required: [$schema, relationships, contracts]
properties:
  $schema:
    const: https://intentional.foo/schemas/interpretation-contract.yml
  relationships:
    $ref: "https://intentional.foo/schemas/recipe-catalog.yml#/$defs/relationships"
  contracts:
    type: object
    minProperties: 1
    propertyNames:
      pattern: "^contract-[1-9][0-9]*$"
    additionalProperties:
      $ref: "#/$defs/contract"
$defs:
  primitive-ref:
    $ref: "https://intentional.foo/schemas/recipe-catalog.yml#/$defs/primitive-ref"
  contract:
    type: object
    additionalProperties: false
    required:
      - bump-aggregation
      - pre-1-0-mapping
      - release-groups
      - dependency-propagation
      - channels
      - changelog
      - canonical-serialization
      - record-digest
      - tag-record
      - intent-consumption
      - recovery
    properties:
      bump-aggregation: { $ref: "#/$defs/primitive-ref" }
      pre-1-0-mapping: { $ref: "#/$defs/primitive-ref" }
      release-groups: { $ref: "#/$defs/primitive-ref" }
      dependency-propagation: { $ref: "#/$defs/primitive-ref" }
      channels: { $ref: "#/$defs/primitive-ref" }
      changelog: { $ref: "#/$defs/primitive-ref" }
      canonical-serialization: { $ref: "#/$defs/primitive-ref" }
      record-digest: { $ref: "#/$defs/primitive-ref" }
      tag-record: { $ref: "#/$defs/primitive-ref" }
      intent-consumption: { $ref: "#/$defs/primitive-ref" }
      recovery: { $ref: "#/$defs/primitive-ref" }
