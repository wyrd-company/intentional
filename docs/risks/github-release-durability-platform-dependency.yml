# GAP-SCHEMA: the risk schema is marked WIP and has two defects, flagged rather
# than followed: (1) it requires `slug`, which conflicts with the standing
# artifact-id-from-filename rule; (2) it requires `response` while defining
# `response-strategy`. This artifact uses the defined property.
$schema: https://refinery.systems/ontology/risk
title: GitHub release durability depends on comparatively new platform surfaces

# GAP-EDGE: the risk schema defines no relationship types. `applies-to` links
# this specific risk to the less-specific managed-workflow design.
relationships:
  applies-to: managed-workflow

description: >-
  Intentional's managed protocol depends on GitHub immutable releases to freeze
  its durable release record and on GitHub App-scoped ruleset bypass to publish
  authoritative commits and tags through protected namespaces. These
  comparatively new platform surfaces can change, become unavailable, or behave
  differently from the protocol's assumptions. Loss of either surface can block
  Release Record closure or invalidate the managed release trust boundary. Annotated tag
  records and GitHub artifact attestations provide independent verification paths
  for release identity and asset digests, reducing dependence on the immutable
  GitHub Release as the only durable representation.

categories:
  - technical
  - operational

likelihood: 3
impact: 4

response-strategy: mitigate

status: mitigated
