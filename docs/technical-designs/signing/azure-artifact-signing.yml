$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: ecosystem-recipes
  realizes: intentional
objective: >-
  Sign every released Windows portable executable with Azure Artifact Signing
  Public Trust authority while preserving a sealed credential-free build input.
proposed-design:
  artifact-scope: >-
    The Windows signing family transforms portable single-executable archives
    and Inno Setup compiler-input artifacts. A portable executable Signing job
    signs the archive's one declared Portable Executable file and emits a
    distinct signed executable archive. An Inno Signing job invokes the same
    authority through Inno's SignTool integration and emits setup and generated
    uninstaller signatures. Derived packages and Distribution Targets consume
    only the signed Windows artifact selected by the Release Plan.
  authority: >-
    Azure Artifact Signing Public Trust is the signing authority. The protected
    release environment grants GitHub `id-token: write`; Azure federated identity
    configuration trusts that repository and environment, and its service
    principal holds Artifact Signing Certificate Profile Signer on the selected
    profile. The job exchanges its GitHub OpenID Connect identity for short-lived
    Azure authority. No certificate, private key, password, or Azure client
    secret enters GitHub.
  operator-configuration: >-
    Organization GitHub variables named by the maintained recipe provide Azure
    client, tenant, subscription, Artifact Signing endpoint, account, and Public
    Trust profile identifiers. Workspace configuration records the expected
    durable Public Trust subscriber identity Extended Key Usage value. Planning
    seals the variable contract and expected identity without resolving current
    operator values. Intentional reports the required variables, protected
    environment, federated credential, profile type, and Azure role assignment.
  signing-operation: >-
    The Signing job verifies one unsigned Release Artifact and record, installs
    exact maintained client tools, authenticates through OpenID Connect, and
    submits only file digests to Azure. SignTool uses SHA-256 and the fixed
    Microsoft RFC 3161 endpoint `http://timestamp.acs.microsoft.com`. Every
    request carries a correlation ID
    derived from Release, Package, artifact, plan, and job identity. Any signing
    or timestamp failure emits no signed artifact.
  identity-verification: >-
    Output validation proves the Windows trust chain, Authenticode code-signing
    usage, Azure Artifact Signing Public Trust marker, expected durable
    subscriber identity, SHA-256 file signature, trusted timestamp, and that the
    end-entity certificate was valid at that timestamp. End-entity
    certificate thumbprint, serial, subject, issuer, validity, timestamp, Azure
    account and profile, and correlation ID are observations recorded with the
    Release Artifact. Trust never pins the rotating leaf certificate or mutable
    subject distinguished name.
  portable-operation: >-
    `intentional sign --plan <path> --artifact <qualified-id>` is the public
    recipe-generic signing operation. It resolves one planned Signing
    transformation, verifies canonical staged input, and emits the signed bundle
    and Release Artifact record. Generated workflows invoke the same command.
    A user-managed GitHub workflow can invoke it from the configured protected
    environment. Local builds produce and verify the unsigned precursor and
    report the planned signing transformation as deferred.
  robust-contract: >-
    Every released Windows Portable Executable selected by the robust managed
    posture has an Azure Artifact Signing transformation. Windows executable
    archives consumed by npm executable packages, system packages, installers,
    and direct downloads therefore identify the same signed executable bytes.
    WinGet accepts only an Inno installer whose setup and uninstaller signatures
    carry the expected subscriber identity.
  release-record: >-
    Unsigned executable archives and inno-installer-input bundles are sealed
    intermediate artifacts. The immutable Release Unit record attaches the final
    signed executable archive and signed Inno installer when each is a planned
    consumer artifact. Signed Release Artifact provenance identifies its
    unsigned input record and complete signature observations.
  conformance: >-
    Hermetic fixtures cover input binding, Public Trust marker and subscriber
    identity validation, certificate rotation, timestamp validation, missing
    OpenID Connect authority, unexpected leaf identity, signed executable archive
    reconstruction, Inno setup and uninstaller signing, derived-package use, and
    absence of unsigned fallback. Live conformance signs a generic disposable
    executable with the configured profile and validates its durable identity.
