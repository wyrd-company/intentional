$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: intent-driven-polyglot-release
  realizes: intentional
objective: >-
  Project Release Workspace state into a fixed, reviewable GitHub Actions
  protocol that introduces authority only after verified inputs and coordinates
  independent Release Unit records and independently operating post-release
  Distribution Targets.
proposed-design:
  protocol-boundary: >-
    Managed workflow is generated orchestration. It owns triggers, dependencies,
    job roles, permissions, environments, setup, credentials, typed extension
    calls, and evidence transport. Portable release rules execute through the
    Intentional binary. Privileged and repository-specific command sequences
    execute through generated checked-in scripts. Maintained Package, Signing,
    Release Record, and Distribution recipes supply typed operations selected by Release
    Workspace configuration.

  security-postures: >-
    Managed workflow applies one explicit named security posture, with the robust
    posture canonical and relaxed postures defined as deliberate subtractions
    rather than inferred fallbacks, while child workflow designs describe the
    robust graph and generation applies the selected subtraction profile. The
    maintained profile catalog and validation contract are defined by
    `docs/specifications/security-postures.yml`.

  owned-output: >-
    Intentional is sole writer of
    `.github/workflows/intentional-release.yml`,
    `.github/workflows/intentional-release-record.yml`,
    one
    `.github/workflows/intentional-distribute-<distribution-path-token>.yml` for
    every configured Distribution Target, any recipe-required
    `.github/workflows/intentional-validate-<callback-path-token>.yml`,
    generated reusable workflows
    named `.github/workflows/intentional-internal-<stable-id>.yml`, and
    `.intentional/workflows/`. The support directory contains generated scripts
    and an ownership manifest. These files are committed for review and runner
    availability, regenerated after Intentional upgrades, and replaced as a
    complete output set.

  entrypoints: >-
    Release workflow begins through manual dispatch and establishes source and
    tag authority plus one draft GitHub Release for every affected Release Unit.
    Release Record workflow begins only from the verified global release tag and
    builds, signs, uploads, assembles, and independently closes those records.
    Every configured Distribution Target workflow responds independently to an
    immutable GitHub Release published event. It exits without authority when
    the released unit does not contain its target. First execution and recovery
    derive from the same immutable Release Record; a target can also be retried
    without coordinating another target. A review-gated recipe can add a
    repository_dispatch validation entrypoint whose untrusted callback is
    verified and resolved to exactly one target before consumer observation.

  job-roles: >-
    Each job has one authority role: read and prepare, call the Custom Candidate
    Release Gate, call the Custom Release Unit Record Gate, materialize, establish
    release authority, build, sign one artifact, upload, assemble one Release
    Unit's evidence, close one Release Record, distribute to one destination, or
    observe one destination. Dependencies
    order jobs so untrusted or
    invalid inputs are rejected before a job receives credentials. A Signing job
    receives only its sealed unsigned artifact and signing authority. A
    Distribution workflow receives only its own protected environment and
    credential contract.
    A derived build receives only the verified Release Artifacts named by its
    sealed artifact prerequisites.

  coordinator-model: >-
    Workflow verifies candidate state before establishing a Release, then creates
    one independent Release Record path for each affected Release Unit. Artifact
    prerequisite edges delay a derived build until every named input artifact is
    verified. Closing one Release Record emits its immutable Distribution source
    without waiting for another unit. Each Distribution Target workflow derives
    applicability and input identity from the published immutable Release Record.
    A target verifies consumer-visible state for every prerequisite Distribution
    named by the Release Plan rather than depending on another workflow result.
    Reruns reconstruct durable progress from annotated tags and immutable Release
    Records and probe current destination state.

  destination-isolation: >-
    Each configured Distribution Target owns one generated submission workflow.
    Recipe-required callback workflows route a validated event to exactly one
    target's credential-free observation and verification jobs. Permissions,
    protected environments, credentials, scripts, retries, observation, and live
    status remain inside one target trust boundary. Target
    workflows do not propagate results to one another. File length does not
    define a protocol boundary.

  setup-and-pinning: >-
    Every generated job installs Intentional before it receives or mints
    authority. Generation pins the setup Action to the generator's source commit
    and supplies the exact released binary version and checksum. Maintained
    external Actions are pinned to immutable revisions. Project and signing tools
    install through commands and versions fixed by the selected recipe;
    repository-owned Custom Release Gates control their own tools.

  extension-points: >-
    The protocol recognizes one optional Custom Candidate Release Gate and one
    optional Custom Release Unit Record Gate at fixed paths. They execute through
    typed reusable workflow calls with read-only repository authority and no
    Intentional-provided secrets. Success passes the corresponding transition;
    failure or cancellation blocks it. The Custom Release Unit Record Gate can
    emit namespaced Evidence Contributions through the contribution contract.
    Maintained delivery Actions and repository-owned
    delivery Actions explicitly admitted by a maintained recipe execute only as
    typed steps within generated destination jobs. A repository-owned delivery
    Action receives only that target's declared credential and sealed inputs;
    Intentional retains artifact verification, record assembly, and closure.

  evidence-transport: >-
    Jobs write schema-backed records to their runner workspace. Cross-job inputs
    move through narrowly named temporary GitHub Actions artifacts whose contents
    are inventoried and validated after download. Release Unit assembly accepts
    exactly one expected fragment per identity. Final Release Evidence and
    attachments move to that unit's draft GitHub Release before closure.
    Distribution jobs produce no durable evidence bundle. Temporary artifact
    retention has no role in durable verification.

  namespace: >-
    Workflow paths, support paths, job-role identifiers, protected environment
    name, generated script conventions, and logical credential identifiers are
    protocol constants. Release Workspace settings select one workspace-wide
    artifact namespace prefix and can override the maintained `INTENTIONAL_`
    physical credential-secret prefix. Generation derives every concrete name
    through the canonical escaping and collision rules. This lets generation,
    checking, repository governance, and operator documentation refer to stable
    logical names while repositories retain their configured physical namespace.

  repository-settings: >-
    Operators and governance tooling own GitHub App installation, rulesets,
    protected environments, secrets, variables, registry trust, and immutable
    Release settings. The robust posture requires a repository-owner GitHub App
    installed for the repository with the repository-content authority needed to
    publish release commits and tags. Active rulesets protect the default branch
    and every generated managed tag namespace. The App is the named bypass actor.
    Global release tag rules restrict creation, update, and deletion so another
    actor cannot forge the managed-processing trigger. Credential-bearing repository
    jobs use the fixed protected release environment and mint short-lived App
    tokens only after their inputs verify. Intentional derives the selected
    posture's complete setting contract from its remaining protocol roles and
    recipes, observes what GitHub exposes, and reports missing, unverifiable, or
    incompatible state through initialization and conformance diagnostics.

  conformance: >-
    Workflow generation renders deterministic bytes from canonical Release
    Workspace configuration, repository capability evidence, and generator
    identity. `intentional check` regenerates in memory and compares every owned
    path byte for byte, validates the ownership manifest, finds stale or foreign
    paths in the owned namespace, validates typed extension interfaces, resolves
    every configured maintained recipe, and reports required GitHub settings.
    Normal Git diff presents every generated change for review.
