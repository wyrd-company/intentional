$schema: https://refinery.systems/ontology/technical-design
relationships: { part-of: ecosystem-recipes, realizes: intentional }
objective: Specialize Intentional for Dev Container Features and Templates.
proposed-design:
  native-authority: >-
    Tracked devcontainer-feature.json and devcontainer-template.json files define
    identities, versions, options, dependencies, and contents. Collections are Package candidates.
  build: >-
    Dev Container CLI 0.88.0 packages exact selected collections as Open
    Container Initiative layouts transported as files, verifies native metadata and install contents,
    and records one sealed artifact per collection.
  distribution: >-
    Feature and Template layouts use the selected Open Container Initiative
    registry recipe. Native major and major-minor aliases are plan-owned mutable aliases.
  conformance: >-
    Fixtures cover collections, dependencies, options, templates, metadata,
    aliases, unsafe content, and exact layout digests.
  specification-topology: devcontainer-package uses colocated prose, config, and recipe assets.
