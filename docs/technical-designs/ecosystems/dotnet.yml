$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: ecosystem-recipes
  realizes: intentional
objective: >-
  Specialize Intentional's recipe protocol for .NET packages and NuGet distribution.
proposed-design:
  native-authority: >-
    Tracked SDK-style project files are Package candidates. MSBuild evaluation
    under the resolved SDK supplies package identity, target frameworks,
    dependencies, pack properties, and output inventory without building.
  package-build: >-
    .NET SDK 10.0.110 and NuGet 7.0.3 restore from the locked dependency graph,
    pack exact nupkg and optional snupkg files, and validate package metadata,
    file inventory, signatures, symbols, and dependency groups.
  distribution: >-
    The nuget.org recipe exchanges repository-bound OpenID Connect identity for
    a one-use temporary API key and pushes the sealed set without a named secret.
    Consumer verification reads the service index, registration data, and exact
    package bytes without receiving distributor authority.
  conformance: >-
    Fixtures cover multi-targeting, central package management, lock failures,
    pack metadata, symbols, duplicate versions, delayed indexing, and retry.
  specification-topology: >-
    dotnet-package and nuget-registry each use colocated prose, config, and recipe assets.
