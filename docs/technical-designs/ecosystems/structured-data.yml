$schema: https://refinery.systems/ontology/technical-design
relationships: { part-of: intent-and-versioning, realizes: intentional }
objective: >-
  Project Release Unit versions through explicitly configured JSON, TOML, and
  YAML fields without assigning Package or artifact semantics to those files.
proposed-design:
  projection: >-
    Release Workspace configuration names an exact tracked file, structured
    adapter, explicit pointer, and committed, injected, or tag-only mode.
    Planning reads only the selected scalar version field. Materialization
    updates only that field and preserves unrelated formatting, comments, field
    order, quoting, and whitespace.
  release-unit-boundary: >-
    A structured projection belongs to a Release Unit. The projected file is
    source authority for that version field and is not thereby a Package,
    Release Artifact, build input, or distributable output. A Release Unit can
    use the projection without declaring a Package.
  package-boundary: >-
    Package discovery, build behavior, artifacts, and Distribution Targets require
    a separately selected maintained Package recipe. JSON, TOML, and YAML
    projection support supplies only version projection capability.
  conformance: >-
    Fixtures cover all three adapters, absent and non-scalar pointers, formatting
    preservation, exact-path enforcement, committed and injected modes, and
    exclusion of unconfigured files.
  contract-ownership: >-
    Release Workspace and Initialization Plan specifications own the adapter,
    file, pointer, and mode fields. Intent and versioning owns projection
    semantics.
