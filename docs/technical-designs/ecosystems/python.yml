$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: ecosystem-recipes
  realizes: intentional
objective: >-
  Specialize Intentional's maintained recipe protocol for Python projects,
  wheels, source distributions, and PyPI distribution.
proposed-design:
  package-boundary: >-
    Every tracked `pyproject.toml` with `[project]` identity is a Package
    candidate. Workspace configuration from uv, Poetry, or PDM supplies
    membership without replacing project identity. Dynamic versions require one
    recipe-supported provider whose resolved version equals the Release Unit.

  discovery-and-native-authority: >-
    Discovery reads project name, version source, build backend, build-system
    requirements, Python requirement, dependencies, optional dependencies,
    entry points, package inventory configuration, license, readme, classifiers,
    and repository lock state without importing project code. `pyproject.toml`,
    backend configuration, and the selected lockfile remain authoritative.

  tool-and-lock-resolution: >-
    Version 1 uses Python 3.14.6 and uv 0.11.21 as maintained defaults. Exact
    project Python pins replace the default. A tracked uv, Poetry, or PDM lock
    must close build requirements whenever the backend needs dependencies beyond
    the standard library. Planning records the exact interpreter, frontend,
    backend requirements, and lock digest.

  build-and-validation: >-
    The canonical entrypoint invokes the declared PEP 517 backend through uv in
    frozen mode and emits selected wheel and source-distribution artifacts. Build
    executes without publication authority. Intentional parses wheel and sdist
    metadata, verifies normalized project name, semantic release version,
    `Requires-Python`, file inventory, RECORD hashes, archive safety, and exact
    output cardinality. A named Task target is the custom entrypoint and declares
    exact distribution paths.

  pypi-distribution: >-
    The PyPI recipe consumes the complete sealed distribution set and publishes
    through repository-bound OpenID Connect trusted publishing. It requests only
    `id-token: write` and receives no named secret. Preflight and observation use
    PyPI's project JSON and normal file download paths. Existing files agree only
    when every filename, size, SHA-256 digest, and downloaded byte sequence match.

  conformance: >-
    Fixtures cover package and workspace roots, static and supported dynamic
    versions, backend and lock conflicts, universal and platform wheels, source
    distributions, entry points, metadata normalization, custom Task builds,
    trusted publishing, delayed index visibility, and idempotent multi-file retry.

  specification-topology: >-
    `python-package.yml` specifies Python build artifacts and `pypi-registry.yml`
    specifies PyPI distribution. Each has colocated config and recipe assets.
