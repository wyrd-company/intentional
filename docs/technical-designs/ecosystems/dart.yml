$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: ecosystem-recipes
  realizes: intentional
objective: >-
  Specialize Intentional's recipe protocol for Dart packages and pub.dev.
proposed-design:
  native-authority: >-
    Each tracked pubspec.yaml with a name and version is a Package candidate.
    Pub workspace membership, dependency constraints, SDK constraints, topics,
    executables, files, and publish_to remain native authority.
  package-build: >-
    Dart 3.12.2 and the maintained pub packaging primitive resolve the exact
    publishable inventory without network access, reject ignored secrets and
    unsafe paths, and seal one deterministic dart-package-archive artifact.
  distribution: >-
    The pub.dev recipe uploads the sealed archive through repository-bound
    OpenID Connect, then verifies package version, archive digest, metadata, and
    consumer-visible contents through public pub.dev interfaces. The package's
    first version is established manually before managed Distribution adoption.
    Planning requires the published Release Unit tag version to equal the package
    version so the workflow event satisfies pub.dev's tag-bound authorization.
  conformance: >-
    Fixtures cover workspaces, publish_to restrictions, SDK constraints,
    inventory exclusions, archive determinism, trusted publishing, conflicts,
    delayed visibility, and idempotent retry.
  specification-topology: >-
    dart-package and pubdev-registry each use colocated prose, config, and recipe assets.
