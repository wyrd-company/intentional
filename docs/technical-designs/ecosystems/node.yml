$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: ecosystem-recipes
  realizes: intentional
objective: >-
  Specialize Intentional's maintained recipe protocol for Node workspaces, npm
  packages, package tarballs, npmjs, and GitHub's npm package registry.
proposed-design:
  package-boundary: >-
    Every tracked `package.json` with a non-empty `name` is a Package candidate.
    npm, pnpm, and Yarn workspace declarations supply membership without merging
    Package identity. One native version field has one Release Unit owner;
    several Packages can share that Release Unit through explicit projections.

  discovery: >-
    Discovery reads tracked package manifests, workspace declarations, package
    identity, version, privacy, files, bin and exports maps, engines, publishConfig,
    scripts, dependencies, peer dependencies, bundled dependencies, and the
    selected lockfile. It runs no lifecycle script. Initialization emits one
    Package suggestion and one npm package-tarball artifact candidate per
    publishable manifest. Private packages remain valid Packages but cannot
    select a public registry target until policy changes.

  native-authority: >-
    `package.json`, the selected workspace manifest, lockfile, and package-manager
    configuration remain authoritative. Recipe configuration stores only release
    choices: package manager when ambiguous, build script, pack directory,
    access policy, and explicit output contract for a custom Task entrypoint.
    Planning records digests only for native fields that affect the package
    identity, inventory, dependency closure, scripts, or registry compatibility.

  tool-and-lock-resolution: >-
    Version 1 supports Node 24.18.0 and npm 11.16.0 as maintained defaults.
    `packageManager` and Corepack pins select exact npm, pnpm, or Yarn versions.
    The plan rejects mutable pins, multiple competing lockfiles without explicit
    resolution, and lockfiles that disagree with tracked manifests. Dependency
    installation uses the package manager's immutable or frozen mode.

  build-and-pack: >-
    The canonical entrypoint installs locked dependencies, runs one configured
    package script when present, and invokes `npm pack` for the exact Package.
    Lifecycle code executes only in the credential-free build role. npm's JSON
    pack report supplies the final inventory, name, version, size, and integrity.
    Intentional records the generated `.tgz` unchanged as an
    `npm-package-tarball` Release Artifact. A custom entrypoint is a named Task
    target and must declare one exact tarball path.

  registry-distribution: >-
    npmjs and GitHub npm distribution are separate maintained Distribution recipes
    so generated jobs receive only destination-specific authority. Both publish
    the sealed tarball path with lifecycle scripts disabled. npmjs uses OpenID
    Connect trusted publishing and can receive a conditional bootstrap token only
    when the package identity does not yet exist. GitHub Packages uses the job's
    packages-write token scoped to the source repository owner.

  observation: >-
    Registry verification reads exact package name and version through a clean
    npm client configuration, compares `dist.integrity` with the sealed tarball's
    SHA-512 integrity, downloads the package through the normal client path, and
    verifies exact bytes and package metadata. Stable and channel dist-tags are
    mutable aliases updated only after immutable version agreement.

  changesets-import: >-
    Changesets import uses this design's manifest identity, workspace membership,
    dependency categories, native ranges, private-package facts, and projection
    ownership. One detector candidate holds one Package and projection suggestion.
    Import parity never treats a workspace root as a Package unless it has its own
    package identity.

  conformance: >-
    Fixtures cover npm, pnpm, and Yarn workspaces; scoped names; private packages;
    bundled files; bins and exports; lifecycle isolation; lock conflicts; package
    manager pins; exact tarballs; npmjs bootstrap and trusted publishing; GitHub
    Packages authority; dist-tags; public readback; and idempotent retries.

  specification-topology: >-
    `docs/specifications/ecosystems/node-package.yml` specifies package build and
    tarball production. `npmjs-registry.yml` and `github-npm-registry.yml`
    specify the two maintained Distribution families. Each uses colocated config
    and recipe assets.
