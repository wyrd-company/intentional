$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: intent-driven-polyglot-release
  realizes: intentional
objective: >-
  Define maintained recipe contracts that translate native project
  evidence and explicit Release Workspace choices into deterministic planning,
  build, signing, Distribution, observation, and verification operations.
proposed-design:
  high-level-overview: >-
    Intentional compiles declarative recipe catalogs into each released binary.
    A Package recipe resolves native project evidence into build units and
    Release Artifacts. A Signing recipe transforms one sealed artifact into a
    separately identified signed artifact. A Distribution recipe submits one
    compatible immutable Release Record content set to one Distribution Target and verifies the
    consumer-visible result. Release Workspace configuration records recipe
    identities; initialization normally recommends and writes those selections
    after user acceptance. The Release Plan seals their resolved configuration,
    release-specific outputs, and exact producing Intentional version.

  recipe-roles: >-
    Every recipe declares exactly one role. A Package selects one Package recipe
    and can declare several artifacts. A Signing recipe consumes one declared
    artifact contract and produces another Release Artifact with a provenance
    relationship to its input. A Distribution Target selects one Distribution
    recipe and consumes one compatible immutable Release Record content set accepted by that
    recipe. A set normally contains one artifact; destinations such as a release
    asset collection can require several named variants. Several Distribution
    Targets can consume the same sealed artifacts. Outputs with
    independent package identity or release lifecycle are separate Packages
    under the same or different Release Units.

  recipe-family-assets: >-
    Every recipe family consists of three specification artifacts with one
    stable stem. `<recipe>.yml` specifies the family in prose,
    `<recipe>.config.yml` defines its closed role-named configuration schemas,
    and `<recipe>.recipe.yml` defines its declarative recipe catalog. Package
    configuration assets expose `package` and `artifact` fragments. Signing
    assets expose `configuration`. Distribution assets expose `configuration`
    and `destination`. Shared definitions can be included through exact local
    references without introducing another public version axis.

  compiled-catalog: >-
    Recipe assets are Intentional-maintained source inputs. The build resolves
    their local references, validates every catalog entry, binds every named
    primitive, and compiles the closed catalog into the binary. Runtime recipe
    resolution selects a compiled entry by stable recipe identifier and role.
    Repository configuration supplies values accepted
    by that entry rather than executable recipe definitions. The Release Plan
    records the exact Intentional generator version and each selected recipe
    identifier.

  recipe-compatibility: >-
    A recipe identifier has the meaning compiled into one exact Intentional
    version. Recipe shape and behavior contribute directly to the Intentional
    semantic version. A deprecated recipe can be removed under the backward
    compatibility standard without providing a replacement. Historical Release
    Plans execute through their exact producing Intentional binary. Catalog tests
    expand every recipe and compare its canonical contract and behavioral
    fixtures with committed expectations.

  primitive-model: >-
    Recipe catalogs compose maintained, typed primitives rather than shell text.
    Each primitive has an internal stable identifier whose behavior is owned by
    the exact Intentional binary. Changed primitive behavior contributes to the
    Intentional semantic version. Process primitives
    declare executable, argument vector, working directory, environment, input
    paths, output paths, timeout, and retry behavior as structured values. The
    compiler rejects missing primitives, reference cycles, unbound
    values, undeclared inputs and outputs, and role-incompatible operations.

  role-contracts: >-
    Recipe assets share an identity envelope and use role-specific
    contracts. Package recipes define discovery, planning, build, collection,
    and artifact validation. Signing recipes define input validation, signing,
    and signed-output validation. Direct Distribution recipes define preflight,
    submission, observation, and verification. Review-gated Distribution recipes
    define preflight and submission followed by a callback containing validation,
    observation, and verification. The compiled model therefore represents only
    operations valid for the selected recipe role.

  configuration-boundary: >-
    Release Workspace schema owns Release Unit, Package, artifact, Distribution
    Target, recipe-reference, projection, and exclusion envelopes. A recipe
    config asset owns only recipe-specific configuration and recipe-specific
    artifact configuration. A user-authored Package, Signing selection, or
    Distribution Target uses `uses: <recipe-id>` and one flat `with` mapping. A Signing
    mapping validates against the authorable projection of its one closed
    configuration fragment. The catalog identifies any read-only configuration
    properties injected from workspace settings. Intentional rejects authored
    values for those properties, injects them from the named setting, then
    validates the complete resolved configuration. Catalog
    compilation requires a Distribution recipe's configuration and destination
    fragments to have disjoint top-level property names; Intentional validates
    their combined closed mapping and normalizes each value into its owning
    fragment. A Signing recipe can also receive a workspace-owned identity value
    and a recipe-fixed organization variable contract during resolution.
    Intentional reads other
    producing recipe identifiers, then validates their `with` values against the
    corresponding role-named fragments. Every
    fragment is closed to unknown fields. Omitted
    configuration is accepted only when the selected fragment accepts an empty
    object; the Release Plan records the normalized resolved object.
    Package identifiers are local to their containing Release Unit. Canonical
    Distribution and artifact references therefore qualify Package identity
    with Release Unit identity.

  native-tag-contracts: >-
    A Package recipe can select one of its native tag primitives when its
    ecosystem assigns consumer semantics to Git tags. Release Unit tag templates
    can use otherwise discouraged syntax only when that contract requires it.
    The managed global workspace tag retains Intentional's plain
    semantic-version form. Other workspace streams can add a configured
    namespace around the version.

  artifact-configuration: >-
    A Package lists managed artifacts under `packages.<package>.artifacts`. Each
    artifact has a stable Intentional identifier and optional recipe-specific
    configuration. Initialization normally derives the proposed identifier from
    native evidence. A native selector is recorded only when the stable
    Intentional identifier differs from the native identity or native evidence
    is ambiguous. The Package recipe derives artifact kind and output contract
    from native evidence. A custom entrypoint requires explicit output contract
    values when that evidence cannot determine them. Qualified artifact
    exclusions are durable Release Workspace policy; candidates that are neither
    managed nor excluded remain unresolved Initialization Plan decisions.
    `settings.artifact-namespace-prefix` overrides the maintained workspace-wide
    artifact-name prefix for every selected recipe.

  asset-names: >-
    Every artifact kind declares `native` or `intentional` asset-name authority.
    Native authority preserves filenames verified from the package format.
    Intentional authority renders lowercase hyphen-separated workspace prefix,
    Release Unit, Package, artifact, and non-empty variant tokens, then appends
    the recipe-declared extension. Multi-file records append content identity.
    Generation rejects path separators, non-portable names, and collisions across
    the complete Release Plan.

  derived-artifacts: >-
    A Package recipe can declare accepted input artifact kinds. Each derived
    artifact names qualified Package and artifact identities in configuration and the
    sealed plan. Its Release Artifact provenance embeds references to every
    consumed Release Artifact record. Generation creates artifact prerequisite
    edges and gives the derivation job no distribution or signing credential.

  executable-archive-contract: >-
    Any compatible Package recipe, including Rust and Go, can emit the shared
    executable-archive artifact kind. Each variant is one deterministic ZIP or
    compressed-tar file for one target platform. Its directory-prefixed payload
    contains exactly one declared executable with canonical permissions. The
    Release Artifact records platform identity, asset name, archive inventory,
    executable identity, byte digests, source identity, and producing recipe.
    Destination Package recipes, including native repository packages and npm
    executable wrappers, consume this common contract without depending on the
    source ecosystem's build behavior.

  native-evidence: >-
    Package recipes define the native manifests, workspace metadata, lockfiles,
    toolchain pins, package identities, build targets, output capabilities, and
    distribution facts they understand. Initialization uses those facts to
    propose Package, artifact, projection, and exclusion decisions. Planning
    reads current tracked inputs and can invoke recipe-approved metadata commands
    whose contracts are side-effect-free, credential-free, and network-free.
    Metadata commands execute under the exact toolchain resolved by the selected
    recipe. Native files remain authoritative for native facts. Release Workspace
    configuration records policy choices, selectors, constraints, and overrides.
    The Release Plan records the exact release-specific facts and source inputs
    resolved from both.

  planning-contract: >-
    Planning resolves every selected recipe before project code executes. The
    Package recipe produces the complete set of expected build units, artifacts,
    variants, target platforms, tool versions, locked dependency inputs, normal
    output locations, collection operations, attached components, and compatible
    Distribution Targets. Matrix dimensions come from the recipe; Release
    Workspace configuration selects the intended values. Native configuration
    can prove available values and explicit native release intent. The sealed
    Release Plan contains the exact selected matrix and artifact set, and build
    rejects missing, extra, renamed, or incompatible outputs.

  build-entrypoints: >-
    Each Package recipe defines a canonical native build entrypoint and can expose
    a typed custom entrypoint that names a supported project task or package
    script. A custom entrypoint receives fixed Release Plan, Package, artifact,
    version, variant, expected-output, and collection values. Custom outputs use
    exact workspace-relative paths. One build unit has one resolved toolchain,
    matrix cell, and entrypoint invocation and can produce several declared
    artifacts. Build environment consists of recipe-declared values and typed
    non-secret parameters sealed by the plan.

  build-and-collection: >-
    Project builds write to their normal repository-relative output locations.
    Intentional validates those exact outputs and copies or hard-links them into
    isolated staging owned by the build operation. Collection, canonical archive
    construction, checksums, image construction, attached-component inventory,
    and artifact validation finish before destination credentials become
    available. The result is final publishable content plus its Release Artifact
    record. Release Record assembly preserves those bytes, and Distribution
    consumes them without rebuilding or repacking them.

  local-and-managed-builds: >-
    `intentional build --plan <path>` executes the build units sealed in a Release
    Plan and is the managed-workflow build interface. `intentional build --local`
    computes candidate expectations from current Release Workspace and native
    state and executes the same selected Package recipe for developer testing.
    Native build commands remain usable. Local execution uses the current work
    tree; a dirty tree produces an explicit warning and records dirty and
    untracked state in its development result. Only a build against authoritative
    sealed source can produce a Release Artifact record accepted into Release
    Evidence. Local builds produce and verify unsigned precursors for planned
    signing transformations and report signing as deferred.

  tool-resolution: >-
    A Package recipe resolves an exact toolchain from a supported project-native
    pin and otherwise from the compiled recipe's exact default. Local execution
    verifies the resolved tools already available to the developer. Managed
    disposable runners install the exact resolved tools. Each artifact kind has
    a recipe-defined locked-input policy. Applicable builds require a valid
    lockfile and invoke native tooling in its locked or frozen mode without
    rewriting dependency state.

  signing-boundary: >-
    A Signing recipe verifies the unsigned Release Artifact, receives only its
    declared signing authority, performs one typed transformation, and verifies
    the resulting signed bytes. It emits a new Release Artifact identity and
    provenance record that names the unsigned input. Package build roles do not
    receive signing credentials. Distribution roles receive only the signed
    artifact selected by the sealed plan and their destination authority.
    Destination-native signatures and platform attestations remain destination
    or Release Record attestations rather than Signing recipe output.
    `intentional sign --plan <path> --artifact <qualified-id>` executes exactly
    one planned Signing transformation through the public recipe-generic
    interface used by generated workflows. It requires the authority declared by
    the resolved recipe and never falls back to unsigned output.

  distribution-boundary: >-
    A Distribution recipe declares accepted released-content contracts, concrete
    destination identity, immutable version identity, mutable aliases, client
    tools, submission operation, idempotency probe, observation deadline,
    consumer retrieval, verification criteria, and logical
    credential identifiers. Planning rejects an incompatible artifact set and
    target pairing. Distributor execution supplies the sealed destination
    explicitly, disables native distribution lifecycle hooks, verifies immutable
    Release Record inputs, and submits that content through the maintained
    operation. Consumer observation determines completed Distribution validation
    and supplies live badge status. A review-gated recipe can end its initial
    credential-bearing workflow at submitted and define a separate untrusted
    callback contract that must be validated before credential-free consumer
    observation.

  authority-routing: >-
    Distribution recipes name logical credentials without naming repository
    secrets. Managed generation derives each GitHub secret name from
    `settings.credential-secret-prefix`, Distribution Target identifier, and
    logical credential identifier through canonical uppercase underscore
    escaping. The maintained prefix is `INTENTIONAL_` when configuration omits
    it. The generated job maps that physical secret to the fixed process variable
    named by the recipe. Generation applies its canonical escaping and collision
    check to every derived physical secret name and rejects distinct logical
    identities that produce the same name. Each credential is available only to
    the Distribution Target role that declares it. A Signing recipe can instead
    declare fixed `INTENTIONAL_` organization variables and GitHub OpenID Connect
    permission. Generation exposes only those variables to its protected Signing
    job and records their logical contract without sealing current operator
    values.

  security-postures: >-
    Each recipe classifies operational requirements, authority requirements, and
    subtractable security controls. Every allowed control subtraction names the
    guarantees it removes. Managed generation combines those declarations with
    the selected security posture and rejects combinations that lack a required
    operation, authority path, released-content validation, or consumer
    observation. Recipe behavior remains fixed for every accepted posture combination.

  conformance: >-
    Each recipe carries hermetic fixtures for discovery, planning,
    configuration validation, deterministic rendering, build and collection,
    signing where applicable, consumer observation parsing, and status evaluation.
    Distribution recipes also expose a live destination conformance operation that
    exercises credential mapping, absence or exact-state probing, submission,
    eventual-consistency polling, consumer retrieval, digest and identity
    readback, alias readback, and idempotent retry. The operation emits the
    structured record defined by `docs/specifications/conformance-evidence.yml`;
    product policy interprets its conformance evidence and recipe support metadata.

  documentation-topology: >-
    `docs/technical-designs/ecosystems/` contains native ecosystem designs such
    as Rust and Node. Native registry distribution belongs to its ecosystem design.
    `docs/technical-designs/destinations/` contains cross-ecosystem destinations.
    Cross-ecosystem Signing recipe designs use a `signing/` child directory.
    `docs/specifications/` mirrors each populated subdirectory. Each recipe family in a
    specification directory uses the three-file prose, config, and recipe asset
    structure. Child designs and specifications declare their relationship to
    this shared design and contain the concrete native commands,
    artifact contracts, destinations, credentials, and verification rules they
    own.
