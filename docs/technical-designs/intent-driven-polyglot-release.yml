$schema: https://refinery.systems/ontology/technical-design
relationships:
  realizes: intentional
objective: >-
  Define Intentional as one coherent release protocol that turns change intent
  into authoritative versions and, when managed workflow is adopted, preserves
  one immutable GitHub Release record per affected Release Unit before
  distributing its released content through maintained ecosystem integrations.
proposed-design:
  architecture: >-
    Intentional consists of a native command-line interface, deterministic
    release-domain mechanisms, optional generated GitHub Actions workflows,
    maintained ecosystem recipes, and typed repository extension points. The
    command-line interface provides the portable protocol. Managed workflow
    coordinates GitHub authority, per-Release Unit records, destination
    credentials, Distribution, and verification around the same release rules.

  core-protocol: >-
    Intentional's core protocol requires Git and no hosting platform. It owns
    Release Workspace initialization, Change Intents, status, semantic-version
    computation, Release Plans, materialization, changelogs, and annotated tag
    records. The surrounding harness creates the materialized commit.
    `intentional tag --plan` verifies that commit and creates the authoritative
    tags that establish the Release. This tag-backed Release is complete without
    generated workflow, managed Release Record, or external Distribution.

  domain-state: >-
    Release Workspace, Change Intent, Release, and Distribution are the domain
    aggregates. Release Workspace owns configuration. Change Intent owns pending
    release input. Release owns established source identity, its sealed global
    plan, and the managed Release Records created for affected Release Units.
    Distribution owns one released artifact or logical content graph's delivery
    and current consumer-path verification at one destination.

  release-authority: >-
    Annotated Git tags are version authority. A computed Release Plan and its
    materialized tree are candidates. Making the verified release commit and
    annotated identity tags authoritative repository objects establishes the
    Release and seals the plan as durable identity. A channel-less Release
    consumes its Change Intents. The portable command-line protocol prepares and
    verifies these objects for an operator or another automation system. Managed
    GitHub workflow performs the same transition through repository-owner App
    authority and continues into per-Release Unit records and Distribution.

  interpretation-contract: >-
    A versioned interpretation contract defines bump aggregation, dependency
    propagation, release-group behavior, pre-1.0 semantic-version mapping,
    changelog construction, canonical serialization, tag records, and recovery.
    Release Workspace configuration names the contract. Release Plans and tags
    carry it. A supporting Intentional binary applies the named semantics rather
    than substituting behavior from its own release version.

  initialization: >-
    `intentional init` always configures the core protocol. The same
    Initialization Plan separately resolves managed GitHub workflow adoption.
    GitHub origin detection supplies a recommendation. `--workflow` opts in and
    `--no-workflow` opts out. Declining workflow generation preserves every core
    release capability.

  change-intent-and-planning: >-
    Change Intents, semantic-version computation, dependencies, release groups,
    projections, changelogs, channels, and status form one portable versioning
    design. Release Plans and tag records bind those calculations to authority.

  managed-workflow: >-
    Managed GitHub workflow is an optional layer projected from Release Workspace
    state into two protocol entrypoints, independently triggered Distribution
    Target workflows, and owned support files. Release workflow
    automates the core establishment protocol through remote repository authority.
    Release Record workflow builds and signs Release Artifacts and closes each
    affected Release Unit's immutable GitHub Release record independently.
    Each Distribution Target workflow consumes the applicable immutable record
    independently. Managed workflow does not redefine
    version computation, Release Plans, materialization, or tag identity.
    Protected managed tag namespaces are the trust root for tag-triggered
    workflow execution.

  security-posture: >-
    Managed workflow supports explicit named security postures derived by
    subtracting controls from its canonical robust posture.

  ecosystem-integrations: >-
    Per-ecosystem designs specialize the shared protocol with complete discovery,
    projection, build, packaging, Distribution, retrieval, verification, and
    credential recipes.

  implementation-topology: >-
    A Rust core library implements the domain model, deterministic computation,
    adapters, canonical records, and validation. A thin Rust command-line binary
    exposes those operations and embeds its agent-facing usage skill. Published
    schemas define configuration, plans, records, evidence, and extension
    contracts. Generated repository scripts call the binary and project the
    required GitHub step outputs. The setup Action installs an exact released
    binary; the contribution Action carries typed Evidence Contributions;
    Intentional-owned delivery Actions and repository-owned pinned delivery
    Actions admitted by a maintained recipe implement bounded destination steps
    inside generated jobs.
