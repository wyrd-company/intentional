$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: ecosystem-recipes
  realizes: intentional
objective: >-
  Derive RPM packages from sealed executable archives and distribute them to a
  configured RPM repository.
proposed-design:
  artifact: >-
    The rpm-package Package recipe selects one sealed executable archive per
    architecture and emits exact RPM package bytes whose identity, stable
    version, architecture, dependencies, installed paths, and scripts agree with
    the sealed Release Plan.
  authority: >-
    The distributor receives only the configured target delivery secret. A
    repository-owned delivery Action is allowed only through the maintained
    pinned-Action extension contract and receives no release App token, signing
    credential, or other destination credential.
  distribution: >-
    Preflight reads the configured channel metadata. Absence permits delivery,
    exact package identity and SHA-256 agreement satisfy retry, and a differing
    existing package is conflict. The pinned Action receives the exact sealed
    package and closed destination inputs at the fixed submission point.
  observation: >-
    An independent public client polls the channel metadata, downloads the
    package through the consumer path, and verifies repository metadata and exact
    bytes against the sealed artifact.
  operational-result: >-
    Public metadata and downloaded-byte agreement makes the Distribution job
    succeed and its live status green. Failure leaves the immutable Release
    Record unchanged.
  conformance: >-
    Fixtures cover native package validation, root and subpath Action pins,
    target-secret isolation, absent and agreeing packages, conflict rejection,
    public metadata propagation, downloaded-byte agreement, and idempotent retry.
  specification-topology: >-
    rpm-package defines credential-free derivation and rpm-repository defines
    credential-isolated distribution. Each uses colocated prose, config, and
    recipe assets.
