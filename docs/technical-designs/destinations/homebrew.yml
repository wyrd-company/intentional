$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: ecosystem-recipes
  realizes: intentional
objective: >-
  Derive a Homebrew formula from sealed executable archives and publish it to a
  configured tap.
proposed-design:
  artifact: >-
    The homebrew-formula Package recipe emits one formula whose immutable source
    URLs and SHA-256 checksums identify the sealed executable archives named by
    its prerequisite artifact records.
  distribution-prerequisite: >-
    Distribution begins from an immutable Release Record containing the sealed
    formula and every source archive it names.
  authority: >-
    The distributor receives a short-lived GitHub App token scoped to the configured
    tap repository. It receives no package-manager, signing, or other destination
    credential.
  promotion: >-
    Preflight reads the configured formula path. Absence permits creation, exact
    byte agreement satisfies retry, and differing bytes are conflict. Promotion
    writes the exact sealed formula through one deterministic Git commit and
    never force-updates conflicting history.
  observation: >-
    An independent public Git read verifies the commit object, formula path and
    bytes, source URLs, and checksums. The deterministic commit and formula bytes
    are immutable state; the tap branch head is a mutable alias.
  operational-result: >-
    Public formula and source agreement makes the Distribution job succeed and
    its live status green. Failure leaves the immutable Release Record unchanged.
  conformance: >-
    Fixtures cover exact formula derivation, absent and agreeing paths, conflict
    rejection, deterministic commits, public readback, and idempotent retry.
  specification-topology: >-
    homebrew-formula defines credential-free derivation and homebrew-tap defines
    credential-isolated distribution. Each uses colocated prose, config, and
    recipe assets.
