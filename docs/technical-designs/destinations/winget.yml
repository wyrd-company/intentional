$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: ecosystem-recipes
  realizes: intentional
objective: >-
  Derive sealed WinGet manifests from released Inno Setup installers, submit
  those exact manifests to the community repository through an organization-owned
  fork, and verify merged packages through the consumer path.
proposed-design:
  manifest-derivation: >-
    The repository owns tracked WinGet YAML template files containing stable
    package metadata. The winget-manifest Package recipe parses those files and
    writes only release-specific version, installer URL, architecture, and
    SHA-256 values derived from the Release Plan and final inno-installer
    artifacts. It validates the complete manifest set with maintained WinGet
    tooling and emits one deterministic ZIP using exact winget-pkgs repository
    paths. Each released installer produces one manifest installer node per
    architecture declared by its Release Artifact. Nodes expanded from one
    multi-architecture installer repeat its exact Release Record URL and SHA-256
    digest while naming distinct architectures.
  release-record: >-
    The immutable Release Unit record attaches the exact inno-installer
    executable or executables and the winget-manifest-archive ZIP. Release
    Artifact inventories bind every manifest path and digest, installer URL and
    digest, package identifier, version, and architecture. WinGet Distribution
    consumes those released files without rebuilding or rewriting them.
  repository-contract: >-
    Distribution targets `microsoft/winget-pkgs` through a configured
    organization-owned fork of that repository. The source repository and fork
    have the same organization owner. The package identifier uniquely selects
    the target manifest path. The configured fork is validated through GitHub
    repository metadata before authority is minted.
  submission-authority: >-
    A GitHub App installed on the organization fork has repository Contents read
    and write and Pull requests read and write. Configuration carries the App ID
    and contributor name and email. The protected Distribution job receives the
    App private key secret, mints a short-lived installation token scoped to the
    fork, and gives no credential to manifest derivation or consumer observation.
  submission: >-
    The distributor fetches upstream master, creates the deterministic branch
    `{source-repo}/{release-unit}/{version}/{package}`, materializes the exact
    sealed manifest archive without modification, commits with the configured
    contributor as author and committer, pushes the branch to the fork, and opens
    the upstream pull request with maintainer modification disabled. The App is
    the pusher and pull-request opener; commit identity remains the contributor
    identity used by Microsoft's Contributor License Agreement check. Retry
    accepts the exact existing branch and pull request and rejects conflicting
    bytes or identity.
  submission-result: >-
    An opened or exactly matching pull request makes the submission workflow
    succeed with outcome submitted. Submitted is an operational workflow outcome,
    not consumer-visible Distribution state and not part of the immutable Release
    Record. The workflow stops at submitted.
  callback-contract: >-
    Generation creates one source-repository validation workflow for the
    `intentional-winget-manifest-merged` repository_dispatch event. Its client
    payload contains only schema-version 1 and pull-request-number. The callback
    is an untrusted wake-up. Intentional supplies no monitor or sender; the user
    decides how the upstream repository is observed and how the event is sent.
  callback-validation: >-
    The callback workflow reads the upstream pull request, infers exactly one
    configured target, and proves that the pull request is merged, its head is
    the configured fork and deterministic branch, and its merged manifest bytes
    exactly match the archive in the immutable Release Record. It reconstructs
    Release Unit, version, package, and target from trusted records rather than
    callback claims. An unrelated pull request exits without a target result.
    Stale, ambiguous, or conflicting identity fails before consumer observation.
  consumer-observation: >-
    After callback validation, a credential-free Linux job polls the WinGet
    catalog until the exact package version and architectures are visible. A
    Windows job then runs an exact non-interactive `winget download` for each
    package, version, and architecture and compares downloaded SHA-256 values
    with the released installers. Agreement makes the validation workflow
    succeed. Missing callback or failed validation leaves Distribution
    unverified and does not alter the Release Record.
  conformance: >-
    Hermetic fixtures cover manifest rendering, archive paths, branch identity,
    fork and callback rejection, merged-byte comparison, catalog polling, exact
    download, hash agreement, conflict rejection, and idempotent retry. Live App
    submission conformance uses an organization fork of
    `microsoft/winget-pkgs-submission-test` and proves token-scoped push,
    cross-fork pull-request creation with maintainer modification disabled,
    configured author and committer attribution, Contributor License Agreement
    status, and retry behavior. The submission-test repository does not prove
    public catalog visibility; production conformance proves observation and
    download on the first real Distribution.
  specification-topology: >-
    winget-manifest defines credential-free artifact derivation and
    winget-community-repository defines submission and callback validation. Each
    family uses colocated prose, config, and recipe assets.
