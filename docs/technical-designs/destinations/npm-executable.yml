$schema: https://refinery.systems/ontology/technical-design
relationships:
  part-of: ecosystem-recipes
  realizes: intentional
objective: >-
  Derive a portable npm executable package from sealed executable archives and
  distribute it through a configured npm registry.
proposed-design:
  artifact: >-
    The npm-executable-package Package recipe emits one npm-package-tarball. The
    tarball contains a generated package manifest, maintained installer, and
    maintained command launcher. It contains no platform executable. Its sealed
    platform map identifies every prerequisite executable archive by target,
    immutable release-asset URL, asset name, archive layout, executable name,
    and SHA-256 digest.
  derivation: >-
    Planning requires one stable package identity, one command name, and a
    complete non-overlapping mapping from supported Node platform and
    architecture pairs to sealed executable-archive variants. Derivation uses
    maintained templates and exact Release Plan values. It executes no project
    lifecycle code and receives no repository, registry, or release credential.
  consumer-installation: >-
    The package postinstall script selects the current platform mapping,
    downloads its archive over HTTPS with bounded redirects and timeout,
    verifies the sealed SHA-256 digest, rejects unsafe or unexpected archive
    entries, and installs the exact executable with canonical permissions. The
    command launcher forwards arguments, inherited standard streams, signals,
    and exit status to that installed executable. When lifecycle scripts are
    disabled or installation is incomplete, the launcher fails with an
    actionable missing-executable diagnostic.
  distribution-prerequisite: >-
    Each npm Distribution Target consumes the wrapper and every archive it names
    from the immutable Release Record. Those exact asset URLs are publicly
    retrievable before the wrapper is submitted.
  distribution: >-
    npmjs and GitHub npm distribution use the maintained Distribution
    recipes. They submit the sealed npm-package-tarball without running its
    lifecycle scripts and retain their destination-specific credential,
    observation, alias, and retry contracts.
  operational-result: >-
    Release Artifact provenance references every consumed executable archive.
    Registry agreement for the exact wrapper tarball makes the Distribution job
    succeed and its live status green.
  conformance: >-
    Fixtures cover scoped and unscoped package identities, complete platform
    maps, exact generated package contents, lifecycle isolation, platform
    selection, bounded HTTPS retrieval, digest rejection, archive traversal
    rejection, executable extraction, argument and signal forwarding,
    unsupported platforms, and exact npm pack output.
  specification-topology: >-
    npm-executable-package uses colocated prose, config, and recipe assets.
    npmjs-registry and github-npm-registry remain the independent Distribution
    recipe families.
