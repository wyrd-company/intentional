$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - intent-driven-polyglot-release
objective: >-
  Provide a GitHub Actions executor that derives, reconciles, and verifies an
  inspectable release and publication protocol from Intentional configuration
  while keeping repository mutation, publisher credentials, and publication
  side effects inside repository-owned workflows.
background:
  current-design: >-
    Intentional computes release versions, materializes projections, seals a
    canonical release plan, and creates annotated Git tags. A surrounding
    repository harness creates and pushes the release commit, pushes tags,
    publishes packages, and records destination results. The plan and tag
    contracts make these operations verifiable, but each repository currently
    has to design and maintain its own GitHub workflow choreography.
  problems:
    - >-
      Release correctness depends on repository-specific workflow code for
      branch protection, source validation, release-commit construction,
      publication ordering, retry recovery, and evidence collection.
    - >-
      Package metadata proves that a release unit can be packaged but does not
      state whether Intentional is authorized to establish publication
      automation for it.
    - >-
      Whole-workflow generation erases repository-owned triggers, jobs,
      comments, and gates, while unstructured snippets cannot be checked for
      drift or updated consistently.
    - >-
      Remote maintainer-controlled Actions are an unsuitable place for
      repository-write credentials, publisher secrets, or OpenID Connect
      identity because their executable contents can change independently of
      the consuming repository.
    - >-
      Publication APIs can accept a package before it becomes observable to
      normal clients, and independent registries cannot provide an atomic
      cross-registry transaction.
    - >-
      An immutable GitHub Release cannot receive final publication evidence
      after it is published, although downstream publishers can require its
      assets before release closure.
design-challenges:
  workflow-ownership: >-
    Intentional must own complete authority-bearing workflow slices without
    taking ownership of the repository's complete workflow documents.
  protected-default-branch-mutation: >-
    A release must preserve the identity of the accepted default-branch commit
    while deriving and publishing a release commit through an authority that is
    compatible with branch protection.
  declarative-publication-intent: >-
    The executor must distinguish native packaging configuration from an
    explicit request to create publication automation and must reject
    publisher combinations for which it has no complete maintained recipe.
  recipe-selection: >-
    Generated steps depend jointly on the release unit's capabilities, its
    applicable packager, the publisher protocol, and the concrete destination,
    while only publication intent and non-derivable target data belong in
    repository configuration.
  privileged-code-visibility: >-
    Users must be able to inspect and update every secret-bearing,
    OpenID Connect-enabled, and repository-mutating operation as ordinary code
    in their repository.
  resumable-publication: >-
    The executor must distinguish an accepted but not yet observable
    publication from an absent publication and must resume without blindly
    submitting an immutable version twice.
  immutable-release-closure: >-
    GitHub Release publication must freeze a complete asset and evidence set,
    while publishers that consume GitHub-hosted deliverables need access before
    that final transition.
  extensible-evidence: >-
    Repository-owned jobs need to contribute Release attachments and structured
    evidence values without receiving Release write authority or extending
    Intentional into the producer's assessment and policy domain.
proposed-design:
  high-level-overview: >-
    Intentional defines a canonical GitHub release state machine and derives
    managed GitHub Actions slices that execute it. The release workflow proves
    an accepted source commit S, seals one release plan, deterministically
    constructs release commit R with S as its sole parent, verifies the
    candidate, and atomically pushes R with the global annotated release tag.
    The tag-triggered publication workflow validates that release identity,
    builds each subject once, publishes the same subject to every configured
    destination, verifies destination readback and the recipe's consumer
    retrieval contract,
    creates phase-dependent tags, assembles affirmative release evidence, and
    publishes an immutable GitHub Release as the closure transition. Intentional
    supplies syntax-aware workflow comparison and mutation; the resulting
    privileged commands remain visible and executable in the repository.

  executor-configuration: |-
    A top-level `github` property in `.intentional/config.yml` opts the
    repository into the GitHub executor. It identifies the repository-owned
    release and publish workflows and the repository-owned jobs that gate each
    workflow's Intentional authority transition. The configured workflow paths
    are defaults for executor commands rather than fixed filenames.

    The optional `prefix` reserves Intentional job, step, and environment
    variable identifiers. A scalar is normalized to lower snake case for jobs
    and steps and to upper snake case for environment variables. A mapping with
    `job` and `envvar` members sets the namespaces independently. Intentional
    appends the required separator and validates the resulting identifier
    forms. The default reserves `intentional_` for jobs and steps and
    `INTENTIONAL_` for environment variables. The protected release environment
    name is the job prefix converted to kebab case with `-release` appended.

    A release unit is the versioning boundary. It owns one version, projections,
    dependency edges, and tags. Its optional `packages` mapping declares the
    packaging boundaries that publish that version. Each package has a stable
    identifier, a release-unit-relative `path`, and optional `npm`, `cargo`,
    `homebrew`, `rpm`, `apt`, `aur`, and `oci` publisher properties. Publisher
    properties are invalid on a release unit and invalid unless the top-level
    `github` configuration is present. Package discovery and native publisher
    settings never create publication intent implicitly.

    Package paths may coincide when distinct native artifacts at that path
    derive distinct capabilities. A package declaration must resolve to exactly
    one publishable capability. Zero matches report the package path and the
    evidence considered. Multiple matches report every candidate capability and
    refuse configuration until the declarations name unambiguous packaging
    boundaries.

    The packages of one release unit are also constrained as a set, because a
    per-declaration rule cannot see a duplicate. Two declarations resolving to
    one native artifact are refused, naming both packages and the artifact they
    share. Without that rule two packages differing only in name publish the
    same bytes twice under distinct identities, which collides nowhere and so
    would be reported by nothing.

    Executor initialization proposes the packages rather than requiring an
    operator to find them. It enumerates every publishable artifact inside each
    configured release unit — each manifest of a workspace, each image
    definition, each command of a module — and offers one package candidate per
    artifact, with its proposed identifier taken from the artifact's own
    directory or native name and its publisher choices taken from the capability
    that artifact derives. The accept or decline plan carries one resolution per
    candidate, so accepting writes the package and its publisher opt-in while
    declining is remembered and the candidate is not offered again. A repository
    whose packages are all resolved converges and is asked nothing further.
    Proposed identifiers are subject to the same set-level constraint as
    declared ones, so two artifacts whose names would collide inside one release
    unit are reported rather than silently distinguished.

    Both answers are recorded in configuration, because configuration is what
    the repository keeps. Accepting writes the package. Declining writes a
    discovery receipt for the declined path. A receipt for an accepted candidate
    names the package that owns it rather than the release unit alone, since a
    path now belongs to a packaging boundary inside a versioning one, and a
    receipt that resolved only to the release unit could not say which of its
    packages claimed the path. The initialization plan holds answers in flight;
    it is not where a decision comes to rest.

  publisher-adapter-configuration: |-
    A package-ecosystem adapter reads identity and compatible settings from its
    native package files. Its Intentional property contains only the explicit
    opt-in and data that those files cannot express. npm, Cargo, and OCI
    destinations are named inside their publisher mappings. `npm.npmjs` selects
    npmjs, `npm.github` selects GitHub Package Registry, and `cargo.registry`
    selects the registry identified by native Cargo metadata. An empty `npm` or
    `cargo` mapping selects nothing and is reported by executor initialization
    and checking. Selection reads only named configuration and never derives
    targets from the maintained recipe catalog. Adding a maintained target to
    an adapter therefore cannot create a publication in a repository that has
    not named that target.

    Homebrew configuration contains the tap repository. Intentional derives the
    formula identity and packager from release-unit evidence. AUR configuration
    is an explicit opt-in. Its package repository is derived from the native
    packager identity: GoReleaser's Arch package name for a Go application, or
    the one Cargo binary name with the `-bin` suffix for a Rust command.

    RPM and APT read the package they distribute from native packager
    configuration and everything about where it goes from their own mapping,
    because their formats define no destination to derive one from. Each mapping
    names the repository-owned delivery Action, the base URL its consumers read,
    the URL serving the public signing key that authenticates its index, the
    deadline its arrangement requires expressed in seconds, and the index
    coordinates the format needs: a suite and component for APT, a channel for
    RPM. These adapters support public repositories, and their consumer
    retrieval is always anonymous. A mapping missing any required member is a
    semantic configuration failure, because each one is a thing no evidence can
    supply.

    A mapping also carries the `with:` block its delivery Action requires,
    written as the workflow would spell it. Delivery is the one step whose
    authority Intentional does not derive, so the credential it presents is
    written here as an ordinary workflow expression and reaches the step
    unread. The block is empty for an Action needing nothing beyond the reserved
    inputs, and an empty block is written rather than omitted, because a
    delivery that needs nothing and one whose configuration forgot to say are
    different claims.

    Every concrete publisher target supports a target-scoped `omit` list when
    its maintained recipe defines attached components. A recipe defines the
    finite component names valid for each target; an unsupported name is a
    semantic configuration error.

    OCI has no implicit destination. Its mapping contains at least one explicit
    peer target named `dockerhub` or `ghcr`. Each target owns authentication,
    promotion, readback, retrieval, and evidence. Target order is insignificant.
    GHCR derives its owner and subject from GitHub and release-unit identity when
    its mapping is empty. Docker Hub configuration supplies a repository when
    that identity is not derivable. Each peer target owns its own `omit` list.

  intentional-package-configuration: |-
    Intentional is the worked example, because it is the repository the
    single-slot identity could not express at all. It has one release unit and
    three packages.

    The release unit `intentional` is rooted at the workspace root and owns the
    one version and the projections that carry that version into the Cargo
    workspace manifest, the CLI crate's dependency on the core crate, and the
    npm launcher manifest. Nothing about that changes: both crates carry
    `version.workspace = true`, so the version boundary is the workspace and the
    configuration says so.

    Its tags take the shape the release workflow requires. The unphased
    workspace tag `{version}` is the global release tag every plan seals, and
    the release unit carries its own `intentional@{version}` tag phased
    `before-publication`. The two namespaces are separate because a release unit
    must declare a tag and the global tag may not be a release-unit tag; the
    release-unit namespace needs a baseline tag before its first release, since
    release-unit versions derive from the release-unit tag rather than the
    workspace tag.

    Three packages sit inside it. `core` at `crates/core` and `cli` at
    `crates/cli` each name `cargo.registry`; `launcher` at `npm` names
    `npm.npmjs`; and `cli` also declares a `homebrew` mapping naming the tap.
    Together they yield
    four publications: `intentional/core/cargo/primary`,
    `intentional/cli/cargo/primary`, `intentional/launcher/npm/primary`, and
    `intentional/cli/homebrew/primary`. The two Cargo publications differ in
    their package alone, which is the collision that motivated the axis — the
    release unit, publisher and target of the two crates are identical.

    The Homebrew formula is built from the command this repository ships and
    consumes the `cli` package's native release archives from the draft GitHub
    Release. The version boundary makes that safe, since one version reaches
    every destination.

    The contract token moves before the package declarations do. Every command
    refuses a document whose contract is not the one the binary implements, so
    the token in this repository's configuration is raised in the same change
    that raises `CURRENT_CONTRACT`, or the tool cannot read its own workspace.
    The package declarations follow separately, because a configuration carrying
    no publisher blocks is already a valid document under the new contract apart
    from the token.

    Record interpretation is not separable from that bump. A record names the
    contract it was sealed under, and nothing may compare that against the
    contract the binary would write today. The rule reaches every such
    comparison rather than the ones that announce themselves, and there are four
    kinds: the workspace validation that reports a record's fields as
    unexpected, the verification that reads a published record, the acceptance
    of a supplied release plan, and the relevance filter that decides which
    records at a commit describe the release being resumed.

    The last kind is the one a remedy shaped around refusals will miss, and it
    is the one on the release path. It does not refuse a record whose contract
    differs; it skips it. A skipped record is an invisible record, so an
    already-released commit reads as unreleased, the recovery path builds a
    fresh plan from intents rather than resuming the sealed one, and the guard
    that compares a recovered plan against existing records never fires, because
    it fires only when a record was found. A refusal is loud and a filter is
    silent, and the silent one re-releases.

    So the contract change is one change across both populations: the constant,
    the configuration token, and every place a record's own contract is read —
    each interpreting under the contract the record names, whether that reading
    refuses, verifies, accepts, or selects.

  publication-identity: |-
    A publication is identified by release unit, package, publisher, and target.
    The package segment is what makes the identity total: without it a release
    unit publishing two artifacts to one publisher and target has one name for
    two things, and every consumer of the identity inherits that collision.

    The identity is one contract with several consumers, and each spells all
    four segments. Publisher evidence fragments record it, so a fragment names
    the package whose artifact it observed. Phase-tag evidence keys its intended
    destinations on it, so a before-publication tag states which package it
    intends to publish where. Publication observation documents carry it.
    `intentional verify publication` matches on it and takes a `--package`
    option beside `--release-unit` and `--publisher`, with the target selector
    still optional. Derived workflow jobs are named from it, so the managed
    publication and consumer-retrieval job identifiers each carry the package
    segment between the release unit and the publisher.

    Job naming is the consumer that fails loudest and earliest, and what it does
    on a collision is refuse. Job identifiers are derived rather than authored,
    and a workflow document cannot hold two jobs of one name, so derivation
    collects every managed publication and consumer-retrieval identifier and
    reports a job-identifier collision naming the second publication to claim
    one. The comparison is blocked and no workflow is produced. A repository
    whose publications cannot be told apart therefore gets no derived workflow
    at all, rather than a workflow that quietly publishes one artifact where two
    were configured.

    That refusal is the guarantee, and it remains required under the four-segment
    identity rather than being replaced by it. Derived identifiers are escaped
    from the identity, and the escape is not injective: it folds every character
    a job identifier may not carry into one, while configured identifiers admit
    several such characters. Adding the package segment adds another boundary
    across which distinct identities can fold together, so it removes the
    collision this design exists to fix without making derived identifiers
    unique. Uniqueness is held by the refusal, and only by the refusal. A design
    that read the extra segment as sufficient would invite an implementation to
    drop the check that is actually protecting it.

    The publication identity is a format with no recorded instances. No release
    has cut evidence under any publication identity, so the change carries no
    compatibility burden, needs no dual-read period, and migrates nothing. The
    identity is stated once and every producer and consumer is written to it.
    That argument is specific to this identity and does not extend to the
    interpretation contract, which is sealed into records that already exist.

  recipe-catalog: >-
    Intentional maintains publication recipes indexed by package capability,
    packager, publisher adapter, and target. Native project evidence derives one
    capability for each declared package; publisher properties and target
    mappings express intent and destination data. The catalog can carry several
    routes to one publisher when their capability and packager differ. Homebrew,
    RPM, APT, and AUR therefore admit maintained routes for native packagers
    that can produce their required distribution input instead of inheriting a
    GoReleaser-only entry point. A Rust crate with one binary selects the Cargo
    archive packager for those four publishers. That packager builds Linux
    x86-64 and Linux Arm64 through digest-pinned Cross 0.2.5 images and builds
    macOS Arm64 with Cargo. GitHub executor configuration may override each
    Linux Cross image independently; omission uses Intentional's repository
    baseline for that target. Its aggregate build creates only the configured
    descriptors and native packages, and seals them with the three archives
    before promotion. A Go application selects GoReleaser, a
    Dockerfile-backed runnable image selects its supported
    Buildx recipe, and a Dev Container Feature selects the Dev Container CLI.
    Exactly one maintained recipe must match every configured publication.
    Missing and ambiguous matches are semantic configuration failures. A recipe
    fixes generated jobs and steps, permissions, authentication, packaging,
    promotion, attached metadata, provenance, signing, readback, consumer
    retrieval, retry policy, and evidence shape. A format that defines no
    publishing protocol leaves its recipe no destination to fix; such a recipe
    fixes every one of these except delivery, and its configuration supplies the
    destination that delivery reaches.

  native-packager-contract: |-
    Initialization can propose or create the baseline native configuration
    required by a derived packager. Intentional check validates that native
    configuration against the selected recipe. Workflow reconciliation reads
    compatible native configuration but limits its mutation to the selected
    GitHub workflow. Packager configuration therefore remains native project
    state rather than duplicated executor configuration.

    Validation reaches the members a recipe depends on rather than the presence
    of the configuration file. A Go release unit's GoReleaser configuration
    declares the project name the recipes seal as the subject identity, the
    distribution pipe each configured publisher promotes, and the system-package
    format each system-package publisher distributes. Every finding names a
    member of the packager's own configuration; none of them becomes a value
    Intentional configuration supplies.

    A Rust native-distribution package derives its subject identity from exactly
    one explicit Cargo binary, or from the package name when `src/main.rs`
    declares the package binary. The Cargo archive packager builds Linux x86-64
    and Linux Arm64 through digest-pinned Cross 0.2.5 images and builds macOS
    Arm64 with Cargo in separate unprivileged jobs. One aggregate build creates
    the configured outputs from those archives and seals the combined subject.
    Homebrew and AUR receive descriptors that resolve the sealed archives. RPM
    and APT receive packages produced from the sealed Linux x86-64 executable by
    digest-pinned nFPM. Their maintainer metadata comes from the Cargo package's
    declared authors; absent authors refuse those routes. Publisher jobs promote
    or deliver those outputs and never rebuild an archive.

    The Cargo AUR destination is `<binary>-bin`. Descriptor generation removes
    that final suffix to obtain the non-empty base package identity, then writes
    it as both `provides` and `conflicts` in the generated `PKGBUILD` and
    `.SRCINFO`. A destination without a removable `-bin` suffix cannot identify
    the source-built counterpart and is refused rather than emitted with an
    unrelated or empty identity.

    Capability derivation consumes the same detector evidence produced by
    `intentional init`. It filters that lossless evidence to the declared package
    path and resolves the native artifact there; it does not probe a list of
    fixed filenames at the release-unit root. npm workspaces, Cargo workspaces,
    image definitions, and command packages therefore retain their distinct
    packaging boundaries inside one version boundary.

    Workflow derivation resolves package-owned native configuration from the
    selected package path. npm and Cargo manifests, Dockerfiles, and Dev
    Container Feature manifests therefore name distinct subjects when packages
    share one release unit and recipe. GoReleaser configuration remains owned by
    the release unit because its one project name and distribution graph govern
    every command package in that version boundary. The packager invocation uses
    the same owner path as the configuration from which its subject was derived.

    Locating an artifact is not the same as being allowed to publish it, and the
    change of mechanism keeps both. A manifest that declines publication derives
    no publishable capability: an npm manifest marked private or naming no
    package, and a Cargo manifest whose own publish setting withholds it, each
    derive nothing regardless of what the detector evidence found there. A
    package declared on such an artifact reports that its manifest declines
    publication, rather than resolving. Reading richer evidence must not turn a
    manifest's own refusal into a publication.

    A Go module is a versioning boundary and each command inside it is a
    packaging boundary, so one module holds as many packages as it holds
    commands. Go command discovery returns every main package admitted by native
    configuration and the bounded detector walk, and initialization proposes each
    one as its own package candidate rather than reporting the module alone.
    Recipe selection joins those candidates to declared package paths. It never
    selects the first match. A declaration matching no command or more than one
    command is a semantic configuration failure that names every candidate path.

    Enumerating them is what lets one command publish where another does not.
    Three commands in one module are three artifacts, and each declares its own
    publishers, so one may reach a tap while its siblings reach nothing. Their
    identities differ in the package segment alone, which is the same shape as
    two crates in one Cargo workspace and is exactly the collision the package
    axis exists to resolve.

    They share the module's version, because versioning in Go is per module and
    a command ships at the version of the module containing it. Independent
    publication and independent versioning are different requests: the first is
    a package-level decision this model expresses, and the second requires
    nested modules, which are separate versioning boundaries and therefore
    separate release units.

    Every refusal that enumerates candidates enumerates only live ones.
    Configuration already records what an operator has declined, as a discovery
    receipt naming a detector and an exact path, and a candidate carrying such a
    receipt is not a candidate. So a declaration is ambiguous only when more than
    one *unexcluded* candidate remains, and a repository that has already
    declined the artifacts it does not publish sees no finding about them. An
    exclusion is pinned to the evidence digest it was taken against, so it
    silences a candidate without silencing a later change to it: when the
    artifact changes, the receipt lapses and the candidate returns to be decided
    again. Exclusion is a decision about a known artifact, not a permanent
    blindfold.

    Discovery therefore detects commands, not only modules. A module detector
    that identifies a module and nothing inside it cannot supply evidence at a
    command's path, so a package declared there would resolve against nothing
    and derive no capability. Detection produces candidates at both levels: the
    module as a versioning boundary, and each command within it as a packaging
    boundary. Capability derivation reads one body of evidence and finds every
    declared package in it, whatever kind of artifact that package is.

    That is also what makes a refusal durable, and durability is the property
    that matters. A decision to publish is recorded by the package that
    configuration declares. A decision *not* to publish has nowhere to live
    unless discovery can name what was declined, and an initialization plan
    cannot carry it: the plan is a working file for a resolve-then-rerun loop on
    one machine's disk, so a fresh clone, another contributor, and every CI run
    begin with no plan and are asked again. A refusal that survives only on the
    disk that made it is not a refusal the repository has made.

    A declined command is therefore recorded as a discovery receipt in
    configuration, which is the tracked artifact, alongside the receipts that
    decline any other candidate path. It is pinned to the evidence digest it was
    taken against, so it silences that command while the command is unchanged
    and returns it to be decided when it changes. One vocabulary covers both
    levels, because both levels are discovery candidates.

  workflow-reconciliation: |-
    The executor derives the required release or publish workflow contract from
    `.intentional/config.yml`, native package evidence, and the maintained
    recipe catalog. It parses the configured workflow as YAML and computes a
    semantic comparison while preserving its original formatting and comments.

    Intentional owns required entries under `on`, the release concurrency
    policy, the safe top-level permission default, and every job whose
    identifier begins with the configured job prefix or carries the stable
    sentinel step ID `intentional_executor_contract`. Every managed job carries
    that sentinel. It is reserved independently of the configurable prefix and
    identifies Intentional ownership across prefix changes, so a repository job
    that takes a reserved identifier or carries the sentinel is Intentional's
    however it came to be there. Ownership is decided per job and never per
    step. An owned job is replaced in full and its steps are derived from the
    contract, so no step is claimed on its own; a step inside a job Intentional
    does not own is repository content whatever it is named. The configurable
    prefix therefore reserves nothing inside a repository-owned job, and the
    sentinel reaches into one only by making the whole job Intentional's rather
    than by editing a step within it. A missing reserved job is inserted and an
    existing reserved job is replaced in full. Additional triggers,
    repository-owned jobs and their steps, expressions, comments, and unrelated
    metadata are preserved. Configured gate job identifiers are added to the
    `needs` lists of
    the reserved jobs their authority governs, without modifying the gate jobs
    themselves. A release gate precedes the reserved authority transition. A
    publish gate precedes both evidence assembly and closure, so a gate
    contributor's evidence is assembled and the gate governs the final
    transition. Release-tag verification precedes every other reserved
    publication job, so closure can never mint repository authority
    concurrently with the check that proves the tag it closes.

    Read-only comparison emits a unified patch by default and can emit a
    structured JSON result. The result binds the proposed transformation to a
    digest of the exact workflow input. Explicit apply performs the same
    syntax-aware transformation and prints the applied diff. Applying a prefix
    change removes jobs carrying the stable ownership sentinel and inserts the
    newly prefixed slices as one workflow migration. Jobs under an old prefix
    without the sentinel remain repository-owned and are never inferred as
    stale managed slices. Routine initialization and checks never
    apply workflow mutations.

    Comparison accepts at most 2,000 workflow lines because its line diff is
    quadratic over repository-supplied input. The same limit applies to the
    proposed transformation before it can be returned or applied. A derived
    document that exceeds the limit is blocked, so reconciliation never writes
    a workflow the next comparison refuses to read. Configured gates are also
    checked against the repository jobs in the compared document before their
    identifiers enter a managed `needs` list; a missing gate blocks the same
    comparison used by diff, apply, and executor check.

    Recipe shapes have different line costs, so the 2,000-line document limit
    is the portable contract and publication count alone is not. Intentional's
    configured four-publication mix is 1,651 lines. Adding its Cargo-shaped AUR
    publication produces a five-publication mix of 1,859 lines. Both fit. The
    five-publication fixture plus 141 repository-owned lines lands exactly on
    the bound, and one more repository-owned line is refused.
    Any prospective publication expansion derives the complete workflow and
    proves it fits instead of inferring capacity from that count.

    Trigger shorthand keeps its repository meaning when an owned filter is
    introduced. In particular, `on: push` becomes explicit all-branch and
    derived release-tag filters; adding the tag filter never silently removes
    branch pushes used by repository-owned jobs.

  command-boundaries: |-
    The `intentional executor` command group manages executor integration only.
    Its operations are `init`, `diff`, and `check`; applying a workflow patch is
    the explicit `--apply` mode of `executor diff`. Runtime release jobs use
    provider-neutral commands: `intentional release prepare`,
    `intentional evidence built-subject`, `intentional evidence contribute`,
    `intentional evidence assemble`, `intentional tag --phase`,
    `intentional verify handoff`, `intentional verify release-tag`,
    `intentional verify publication`, and `intentional verify release`.

    `verify publication` identifies the expected contract through required
    `--release-unit`, `--package`, and `--publisher` options and an optional
    `--target`.
    Omitting `--target` or passing `primary` selects an adapter's configured
    primary destination. The npm-specific `npmjs` spelling aliases its primary.
    `crates.io` aliases Cargo's primary only when the concrete configured
    primary is crates.io; otherwise selection fails rather than redirecting to
    a different Cargo registry. OCI has no primary, so its verification always
    requires `--target dockerhub` or `--target ghcr`. Publisher evidence uses
    `primary` as the canonical target identity for every selected primary and
    records the concrete registry or repository destination separately.
    `verify release` verifies durable recorded evidence by default; `--live`
    additionally performs fresh destination readback. These portable commands
    contain no GitHub workflow-discovery or workflow-patching behavior.

    Thin credential-free Actions invoke the portable commands and transfer
    their files through GitHub workflow artifacts. Each one is published from
    the Intentional repository at `actions/<action-name>`, installs a checksum-
    verified released binary, and projects step outputs only from validated
    identity lines the command printed after it succeeded. Their exact output
    contracts are:

    - `assemble-evidence`: no outputs.
    - `contribute`: no outputs.
    - `prepare-release`: `candidate-path`, `source-sha`, `release-sha`, `global-tag`, and `plan-digest`.
    - `record-built-subject`: `built-subject-path`, `digest`, and `version`.
    - `seal-phase-tags`: `sealed-phase-evidence`.
    - `verify-handoff`: `source-sha`, `release-sha`, `global-tag`, and `plan-digest`.
    - `verify-publication`: `evidence-path`.
    - `verify-release-tag`: `source-sha`, `release-sha`, `global-tag`, `global-tag-object`, and `plan-digest`.

    The seal-phase-tags Action never pushes, because tag creation is local and
    the repository-owned job that consumes it holds the push authority.
    Schema-backed files are the
    authoritative handoff and evidence contracts. Downstream operations read
    and verify those files; GitHub outputs route selected identities and paths
    through the workflow and never replace file contents.

    These Actions are the only way a managed job invokes a portable command. A
    managed step that spelled a command in a `run:` body would assume an
    executable a stock runner does not carry and would expose no step outputs
    for the next step to read, so the step form is not a matter of taste.
    Repository-owned steps remain free to invoke the commands however they
    like. Derivation resolves each Intentional Action at the released version
    that derived the workflow and passes that same version as the binary the
    Action installs, so one derivation names one Action revision and one binary
    revision and the two cannot drift apart.

  release-workflow: |-
    The release workflow selects source commit S from the current remote
    default branch. A preparation job checks out S without persisted
    credentials and runs `intentional release prepare`. Resolving and verifying
    S is an invariant of that command: it proves that the remote default branch
    identifies S before sealing the canonical release plan. The command applies
    the plan and creates deterministic release commit R and its local annotated
    global release tag without performing network mutation. R has exactly one
    parent, S. The candidate handoff contains S, R, the plan and digest,
    changed-tree evidence, the global tag identity, the materialized release
    candidate, and a digest-inventoried Git bundle carrying the exact R commit
    and annotated tag objects.

    R is a pure function of S. Preparation requires a workspace that still
    matches S, derives R's tree from S's tree and the applied release without
    writing into the workspace, and records a fixed protocol Git identity with
    S's committer time as both the author and committer timestamp of R.
    Preparation records the annotated global tag under a reserved ref rather
    than under its rendered release tag name: tags carry version authority, so
    writing that name before the release is accepted would change the plan a
    repeated preparation seals. The global release tag is the single workspace
    tag that declares no required publication phase; every other tag, workspace
    or release-unit, declares the phase that creates it. Executor conformance
    reports a workspace with no such tag, or with more than one unphased
    workspace tag, and names every unphased release-unit tag separately, so
    the constraint surfaces where it can be fixed rather than inside a
    privileged pipeline. A multi-release-unit repository adopting the executor
    moves its global release tag under workspace-tags rather than leaving it on
    a release unit.
    The bundle is thin: it declares S as its prerequisite, carries the objects R
    and its tag introduce, and is bounded so an untrusted handoff cannot become
    an unbounded object-ingestion surface.

    Repository-owned release gates consume the handoff and decide whether S is
    accepted after preparation but before any authority transition. The
    configured protected environment guards the publication job. That job
    independently runs `intentional verify handoff`, which first verifies the
    bundle as untrusted input, imports it into the fresh clone, proves the
    imported commit and tag objects reproduce every candidate identity and
    invariant, and only then exposes their pushable identities. Verification
    proves the transported file set is exactly the inventoried set, validates
    the bundle and its declared heads before importing it into a throwaway
    clone with Git object checking enabled, and rebuilds the candidate from S
    alone in a separate isolated clone so a forged manifest cannot describe its
    own verification. Only after both clones agree does it copy the proven
    release commit and annotated tag from the throwaway clone into the
    privileged clone, so the privileged repository receives objects reachable
    from refs that were already verified rather than the untrusted pack, and
    the handoff is never read a second time. It re-reads both imported refs
    afterwards and accepts an identical existing record so a retry recovers
    rather than conflicts. It mints a short-lived GitHub App installation token
    and uses only the verified handoff Action's `source-sha`, `release-sha`,
    `global-tag`, and `plan-digest` outputs for the authority transition. It
    checks immediately before mutation that the remote default branch still
    equals the verified source SHA and uses `git push --atomic` to update the
    default branch to the verified release SHA and publish the verified global
    tag. It then creates the draft GitHub Release for that verified tag, so the
    draft publication depends on exists before the tag can trigger it, and is
    created by a job already holding the installation token rather than by a
    second minting of repository authority. Creation follows the push because a
    draft cannot be created for a tag the remote does not carry. It is
    create-if-absent, so a rerun after a failure resumes against the draft the
    previous attempt left; a Release for that tag that is no longer a draft has
    already closed, and the transition refuses rather than carrying on toward
    publishers that would write onto frozen assets. Because verification
    rebuilds the candidate from S, and release-unit versions are derived from
    annotated tags, the privileged job's checkout must carry complete history
    and every tag. A shallow or tagless checkout makes verification fail rather
    than succeed incorrectly, so reducing that checkout is a breaking change to
    this protocol rather than an optimization. A branch race, tag mismatch,
    non-deterministic candidate, or failed gate prevents the mutation. Manual
    and recovery invocations execute this same protocol.

  publication-workflow: |-
    The global annotated release tag triggers publication. The initial job
    runs `intentional verify release-tag` and verifies that the tag targets R,
    that R has sole parent S, and that the tag, tree, plan digest, projections,
    changelogs, and consumed intents agree. Intentional derives the publication
    dependency graph from the selected recipes and configured publish gates.

    Each distinct publishable subject is built once from R and assigned an
    immutable digest before distribution. A subject is one release unit and one
    packager, so two destinations of one packager are one subject and two
    package formats of one release unit are two. Each derives one build job that
    produces the subject's bytes and runs `intentional evidence built-subject`,
    which reads the version the verified global release tag reproduces and
    computes the digest over the bytes the build emitted. The bytes and the
    built-subject document travel together as one workflow artifact the
    publisher jobs receive; the before-publication tag job reads a
    document-only artifact of the same build, because it compares documents and
    does not need the bytes. The build job also projects the version and digest
    it recorded as job outputs, because the publisher recipes write both into
    their observations and assembly compares them against what the phase tag
    sealed.

    A release that builds a GitHub-hosted deliverable derives a managed upload
    job that depends on every build job and precedes every publisher job. It is
    repository-local and runs inside the configured protected environment, like
    every other job that mints write authority. It resolves the draft for the
    verified global release tag once, refusing a Release that has already closed
    or that carries another tag before any asset is written, then uploads every
    GitHub-hosted deliverable to it, so a publisher whose consumer path resolves
    a Release asset finds it there and no publisher job holds `contents: write`.
    Uploading replaces what is already present, so a rerun after a partial
    failure places its deliverables again and succeeds. A release whose every
    deliverable reaches a registry derives no such job, because deriving one
    would hold repository content-write authority for the duration of an upload
    with nothing in it.

    That makes it an unconditional barrier between every build job and every
    publisher job: the slowest build gates the first publication. One job per
    subject would narrow the barrier, because a publisher only reads its own
    subject's asset, but it would multiply the jobs holding `contents: write`
    by the number of subjects. Fewer jobs holding repository write authority is
    worth more than publisher concurrency, so the barrier is one job.

    A Release asset name is flat, so two subjects that produce one basename
    would place one over the other and leave a handoff inventorying an
    identifier that holds another subject's bytes. The upload refuses the
    second rather than replacing the first, because nothing downstream of a
    silent replacement reports it as anything but a digest disagreement at a
    publisher.

    A packager names its files from templates a repository controls, and each
    name is written into a quoted scalar of the handoff and passed as its own
    argument, so a name outside what those carry is refused before anything is
    placed. Refusing it while writing the document would be too late: the job
    has spent its repository write authority by then and the draft holds an
    asset no handoff can name.

    The same job writes each draft-dependent publication's asset handoff, once
    its assets are on the draft. The stable asset identifier a consumer resolves
    is GitHub's and exists only after the upload, so the inventory is read back
    from the Release rather than predicted, while the digest beside it is taken
    from the local bytes the job uploaded: that is what makes the consumer's
    download a proved round trip rather than agreement with whatever the Release
    now holds. The release identity the document declares is the one the tag
    verification job proved and projected, because a downstream publisher proves
    each of those identities against its own checkout before it trusts an asset.
    A deliverable the draft does not carry fails the job rather than being
    omitted, because a handoff inventorying a subset is indistinguishable at the
    consumer from one whose publication legitimately consumes fewer assets. Each
    handoff travels to its publisher as its own workflow artifact, so a
    publisher receives the document for its own publication and no other.

    A publisher job receives those bytes on disk and names them to its publish
    step as `<prefix>SUBJECT`. A maintained recipe's publish command consumes
    that path and promotes what the build produced; it does not rebuild from
    source. A recipe that rebuilds produces a second artifact whose digest
    cannot equal the one recorded for the subject, so assembly's subject
    cross-check reports it. Publisher jobs consume or promote that subject;
    separate destinations never rebuild it.

    A subject's identity is the name its destinations resolve. Where the
    packager's native manifest carries that name the derivation reads it; where
    the format has none the release-unit id stands in. That stand-in is
    deliberately fail-closed rather than silent: a publisher fragment recording
    the destination-native identity disagrees with the sealed subject, and
    assembly reports it, so a format in that state cannot complete a publication
    run until the identity is derived.

    Deriving it is a change to the derivation, not a value configuration
    supplies. The packager set is the maintained recipe catalog, so an
    underived identity is a packager the derivation has not learned to read; an
    identity a workspace could assert would let a release name a subject its
    destination does not resolve, which is the disagreement the sealed subject
    exists to catch. A recipe reaching its destination therefore refines the
    derivation. It never resolves the disagreement from the other side by
    recording the release-unit id in its fragment: that agrees with the seal by
    making both sides wrong and retires the cross-check for that subject.

    A phase the configuration declares derives a managed tag job that runs
    `intentional tag --phase`. The before-publication job depends on every build
    job, so it seals the subjects that exist and the destinations the release
    intends before any publication has occurred. The after-publication job
    depends on every publication-completion verifier and therefore transitively
    on every publisher job, so it seals the accepted fragments only once they
    exist. Tag creation is local and credential-free; each tag job then
    mints the short-lived installation token and pushes the annotated tags that
    point at R through the repository-owned privileged step, so no
    Intentional-owned Action holds repository-write authority. All tags target R
    and bind the same release plan.

    Each tag job writes what its phase sealed as its own phase-tag-evidence
    document and uploads it as an evidence artifact, because assembly recognizes
    evidence by document identity and cannot read a tag message. The document is
    written whether or not the invocation created a tag, so a retried
    publication reaches assembly with the evidence the release carries.

    Between receiving the subject and verifying the publication, managed jobs
    run the steps their maintained recipe derives. Registry authentication,
    publication, signing, and repository mutation are inline workflow shell so
    their authority-bearing commands stay visible at the point that grants
    authority. Where the destination permits credential-free retrieval, the
    first-party `verify-publication` Action runs portable, non-mutating
    destination readback and pre-closure consumer retrieval, writes the
    publication observation, and invokes the binary that adjudicates it.
    Credential-requiring readback remains inline and passes only its completed
    observation to the Action. The Action contains no publication or
    destination-mutation command and receives no publisher credential.

    Authenticated observation uses a separate job only when the destination
    supplies a maintained read-only identity. GitHub Package Registry does: its
    downstream retrieval job's `GITHUB_TOKEN` has `packages: read`, while the
    publisher job retains `packages: write`, so the client that reads the
    package cannot publish one. The retrieval job depends directly on both the
    publisher and build jobs and consumes the version and digest the build
    projected. An alternate Cargo registry supplies no standard read-only token
    or identity mint. Its authenticated observer therefore stays inline in the
    protected publisher job and reuses the credential already present there;
    derivation neither copies that write-capable secret into a second job nor
    passes it to the first-party Action. Its credential-free downstream verifier
    receives the completed observation with observation disabled and only
    adjudicates it. Public observers run in the corresponding credential-free
    verifier after it downloads that publication's sealed subject. Each recipe
    derives the portable observer's non-baseline client requirements and the
    credential-free installer steps from one typed list. Those installers run
    in that verifier before the first-party Action checks that every required
    client is present. A missing client therefore fails immediately with its
    name rather than entering the destination-consistency retry policy. Every value an inline body
    reads arrives through `env:` because an expression expanded inside a script
    is substitution into shell source. A name a repository supplies is
    substitution into shell source for the same reason, so a configured registry
    or secret identifier is validated at derivation and reaches its command as a
    quoted variable.

    A recipe's consumer retrieval is performed under the identity its recorded
    mode names. A retrieval that claims the public consumer path runs under a
    scratch client configuration rather than the job's, because a bootstrap
    credential written earlier in the job would otherwise still be presented.

    A recipe observes and does not adjudicate. A destination that has not
    indexed the release yet is recorded as pending and one holding different
    bytes as conflict, and the step succeeds either way, so the decision about
    whether a publication completed stays in the command that reads the
    observation.

    Nothing a recipe writes about the release is asserted by the recipe where
    the graph already proved it. The subject's version and digest are projected
    from the build job that recorded them, which derived the version from the
    verified global release tag and the digest from the bytes it emitted. A
    recipe reading a version out of its own package manifest instead could
    publish under a version the plan never assigned and record that as
    agreement.

    Where a packager has no upload-only client and publication necessarily
    re-packages the sources, notably Cargo, no single check can establish that
    the uploaded bytes are the sealed subject, because the upload packages once
    more of its own. Two halves establish it together. Before uploading, the
    recipe re-packages and refuses to publish unless the result is byte-identical
    to the subject the build produced, which is what makes the packaging
    demonstrably reproducible in that job. After uploading, the destination
    readback compares the checksum the destination publishes against the sealed
    subject and records a conflict if they differ. The first half is what
    prevents an immutable version being burned on bytes the release never sealed;
    the second is what makes a divergence impossible to miss if it happens
    anyway. Neither half is sufficient alone, and the residual — a divergent
    third packaging fails the release rather than shipping quietly — is the
    honest ceiling for a packager with no upload-only path.

    A later managed consumer job then runs `intentional verify publication`
    with explicit release-unit, package, and publisher identity and the target
    selector required by the adapter. The command produces the
    schema-backed publisher evidence fragment consumed by
    `intentional evidence assemble`.

  privileged-execution-boundary: >-
    Intentional-owned reusable Actions perform credential-free plumbing and
    preparation, including destination observation where the destination
    permits credential-free retrieval. Credential-free means that the Action
    cannot reach a
    destination secret, destination-write workflow token, OpenID Connect
    identity, or minted repository token; it does not mean a GitHub runner has
    no read-only runtime or artifact credential. Repository-mutating,
    secret-bearing, and OpenID Connect-enabled commands are materialized in
    repository-local reserved jobs. A publisher writes its schema-backed
    observation to a short-lived artifact after the repository-local recipe
    finishes. Intentional verifies each observation in that publication's
    downstream job, which has
    read-only contents permission and no protected environment, destination
    secret, package-write scope, or identity-mint scope. A destination whose
    consumer read requires narrower read authority performs that retrieval and
    verification in its separate read-scoped job. Checkout disables persisted
    credentials and states its release-tag requirement explicitly rather than
    inheriting tags from an unrelated fetch depth, because the commands these
    jobs run derive version authority and resolve the global release tag from
    the repository's tags. Permissions are
    set per job and default to read-only. Reconciliation reports the
    workflow-level scopes its safe default withdraws, so a repository declares
    them per job deliberately. Write authority is minted only after validation,
    configured gates, and protected-environment approval. Every publisher job
    also declares the configured protected environment. The environment is the
    boundary for irreversible external publication as well as repository and
    Release mutation: its reviewers, wait timer, and branch rules govern the
    step that spends each destination credential. Destination secrets and
    variables belong to that environment. A repository migrating an existing
    managed workflow copies each destination credential under the same name to
    the environment, applies the derived workflow, proves one protected
    publication, and then removes the repository-level copy. Repository-level
    fallback during that sequence keeps the workflow runnable, but retains the
    broader read surface until removal. Declaring the environment also adds its
    name to the OpenID Connect claim set and changes the default subject of each
    publisher identity. The npmjs and crates.io trusted-publisher records name
    that exact environment before the regenerated workflow is applied; an
    existing record created for a job with no environment no longer matches.
    External Actions are
    pinned to complete commit identities. Intentional's own Actions are pinned
    to the released version that derived the workflow, because derivation must
    name a revision carrying the release this build belongs to and that commit
    does not exist when the workflow is derived. A version is a tag and a tag
    can be repointed, so every consuming repository holds a reference the
    publishing repository can move after the fact. That is the property this
    pinning gives up, and it is accepted on the same ground the trust boundary
    below rests on: the publishing repository already supplies the binary whose
    verification decides whether the authority transition happens at all, so a
    repointed tag reaches a repository that was already trusting that channel.

    A privileged job that reaches a portable command through an Action fetches
    and executes Intentional-owned code and installs a released binary over the
    network inside the job that later mints repository-write authority. The
    install is required wherever the command runs, so it is the placement rather
    than the network dependency that is chosen here. Three properties bound it.
    The Action receives no credentials and the job mints none until after the
    Action has finished, so no write token exists on the runner while
    Intentional's own code is first fetched and executed. The installed archive is verified
    against its published checksum before use. The mutating step is a
    repository-local `run:` body that the Action never sees. What remains is
    that runner state persists across steps within a job, so an install that was
    compromised despite checksum verification could leave behind something a
    later privileged step executes. Ordering narrows that window; it does not
    close it. The residual exposure is accepted because the same repository and
    the same release channel already supply the binary whose verification
    decides whether the authority transition happens at all.

  goreleaser-distribution: |-
    A Go release unit's Homebrew, RPM, APT, and AUR deliverables are one
    subject: one packager builds them together and one build job produces them.
    The packager offers no way to publish a distribution tree a previous
    invocation built, so a job that ran the packager again would rebuild from
    source and produce a subject whose digest cannot equal the one the release
    sealed. Everything downstream of the build therefore promotes what that
    build produced. The build job installs the packager, because a stock runner
    does not carry it and this job is the sole producer of every Go deliverable.

    The deliverables come in two shapes, and the shape decides who distributes
    them. A Homebrew formula and an Arch package's sources are descriptors that
    point at a release; their destination is a repository, and their publisher
    job promotes the generated files into it. An RPM and a Debian package are
    the released bytes themselves; they are GitHub-hosted deliverables, so the
    managed upload job places them on the draft Release, and their publisher
    job resolves them from there before delivering them to a system-package
    repository.

    The packager decides which files are which, and the derivation reads that
    rather than listing extensions the packager could add to. What the packager
    distributes it writes at the top of its distribution tree and everything
    else below it, so the GitHub-hosted deliverables are the files at that top
    level: the release archives, the published checksums, and the native
    packages. The descriptors are excluded because they live in directories.
    The three documents the packager writes to describe its own run are named
    and excluded, because build metadata is not something a consumer resolves
    and a release that placed it would inventory the packager's internal state
    as a deliverable.

    Which of those a draft-dependent publication consumes is the same split
    read from the other side. A system-package adapter consumes exactly the
    native format it distributes, and a Homebrew formula or an Arch `PKGBUILD`
    resolves the release archives its descriptor points at. Handing an adapter
    the other half would make it download and digest bytes its consumer path
    never resolves and record that as its retrieval.

    Which files are native packages is read from the formats the release unit
    declared rather than from the two formats the system-package adapters
    distribute, because the packager builds any of the formats it supports and a
    fixed pair is a denylist over a growing set. Each declared format is
    recognised by the derivation and mapped to the extension its package
    carries; a format the derivation does not recognise is refused where the
    diagnostic names the file that declared it, because the alternative is a
    native package handed to a descriptor adapter as one of the archives its
    formula resolves.

    The packager decides the layout on both sides and the recipes read it
    rather than choosing one, so the build job installs a pinned GoReleaser
    rather than whatever the installer would resolve on the day a release runs.
    Every path and name below is a claim about that release: the recipes are
    written against one packager version, and moving it is a change to this
    contract rather than an upgrade beneath it. It is also what lets the same
    source build the same subject twice.

    A formula is written to
    `homebrew/<directory>/<name>.rb` and published at that same relative path in
    the tap, so a tap whose formulas do not live under `Formula` is stating
    where they live. Every generated formula is promoted, because a release unit
    with two `brews` entries publishes two. An Arch package's sources are
    written as `aur/<package>.pkgbuild` and `aur/<package>.srcinfo` and are
    required at the destination as `PKGBUILD` and `.SRCINFO`, so both sides are
    named exactly. That package identity is the packager's rather than the
    repository's: an entry naming no package takes the project name, and every
    name is given a `-bin` suffix unless it already carries one, because an Arch
    package built from released binaries is named that way. The derivation
    applies the same rule, because a destination derived from the declaration
    alone names a package the packager never wrote and the Arch User Repository
    never carried. GoReleaser also applies its template language to a declared
    package name. Maintained Arch publication requires a literal name and
    conformance reports a templated declaration instead of deriving a different
    destination from it. Naming both sides exactly is also what keeps a sibling
    entry out: reading one package's own two files leaves the other's alone, and
    installing them under their required names is what makes the result a
    package `makepkg` can read. Multiplicity is where the two adapters differ:
    `brews` publishes every entry, while one Arch publication reaches one
    package, so a second `aur` entry is built and never published and
    conformance reports it.

    Authority follows the destination. Homebrew's tap is a GitHub repository, so
    its recipe mints an installation token naming that repository alone. The
    Arch User Repository is a Git host of its own, so its recipe uses an SSH key
    the repository supplies under the conventional secret name
    `INTENTIONAL_AUR_KEY`, and pins the host key rather than accepting whatever
    answers on the runner: an authority scoped this narrowly must not be handed
    to an unauthenticated peer. A package the Arch User Repository does not yet
    carry is created by its initial push, which is how that repository registers
    one. None of these destinations accepts a workflow identity token, so none
    of their jobs requests one; trusted publishing is a registry capability, and
    a tap and the Arch User Repository are repositories.

    A rerun that finds a destination already carrying this release commits
    nothing and still succeeds. After either a changed or unchanged push, a
    fresh clone compares every promoted descriptor byte for byte. A clone that
    cannot yet see the push, or still carries earlier bytes, is retried under
    the repository adapter's configured interval, backoff, maximum interval,
    and deadline. The retrieved descriptor tree supplies both the destination
    and retrieval digests in the observation that publication verification
    reads; the separately recomputed local subject digest checks that promotion
    consumed the sealed subject.

  system-package-distribution: |-
    An APT repository and an RPM repository are directories of files served over
    HTTPS. Neither format defines a publishing protocol: no command uploads a
    package, and no destination answers one. Publication is writing files,
    regenerating an index, signing it, and serving the result, and every part of
    that is the arrangement of whoever runs the repository. There is no
    destination a maintained recipe could aim at, which is why these two
    publishers reach one no other adapter does — the destination is supplied by
    the repository that configures the publication.

    What both formats do define is what a published repository looks like from
    outside, and that is the half a maintained recipe owns. The recipe resolves
    the package from the draft Release, establishes that it is the package this
    release built, hands it to the repository's own delivery step, reads the
    signed index back, retrieves the package the way a consumer does, and
    records the result. Only delivery varies, and only delivery is configured.

    Configuration supplies the delivery step, the repository's base URL, the
    URL its index signing key is served from, the observation deadline, and
    the inputs the delivery step takes. The delivery step is a
    repository-owned composite Action named by path, invoked as a step of the
    publisher job. It is a composite Action rather than a reusable workflow
    because delivery sits between establishment and readback: a job that calls a
    reusable workflow runs no steps of its own, so the two halves the recipe
    owns would become separate jobs and the established package and its sealed
    identity would cross a job boundary as an artifact. One primitive is named
    rather than either, because a definition that admitted both would leave the
    workflow's shape undecided.

    It is not an editable region of a derived file: reconciliation rewrites what
    it derives, so an edited body is either overwritten or turns every
    reconciliation into a merge. Naming a path keeps the delivery code in a file
    its own repository reviews and tests, and keeps the derived job regenerable.

    The seam has a stated contract in both directions, and it is expressed in
    the delivery Action's own inputs. Inward, the recipe supplies the
    established package's path on the runner, its format, the package name,
    version the release sealed, the architecture the package declares, the
    sealed digest, and the index coordinates the publication configured. These
    are facts about this release rather than settings: the path is where the
    job placed the asset it pulled from the draft Release, the identity is what
    establishment read out of the package, and the digest is the one the
    release sealed. They occupy a
    reserved input namespace the delivery Action declares, spelled as the
    configured job prefix in kebab case — the derivation the protected release
    environment name already uses — so a repository that renamed Intentional's
    namespace carries that name across jobs, steps, environment variables and
    inputs alike. Under it sit the package's path, format, name, version,
    architecture and digest, and the index coordinates each format needs: a
    suite and a component for APT, a channel for RPM. A delivery Action that
    does not declare the names a repository's prefix produces is one that
    repository cannot use, which is a property of the Action it chose rather
    than something the recipe reconciles. The publisher job itself holds
    `contents: read` and mints nothing.

    Whatever else the Action needs, configuration supplies as a literal `with:`
    block that the derived step carries unread. A credential, a plain value, a
    repository variable and a workflow expression are the same thing here,
    because the values are the configuring repository's to write and its
    delivery code's to interpret. Intentional generates a call, so the call
    being well formed is its concern and what populates it is not.

    Well formed is decided against the Action itself. Configuration names the
    Action's directory, because that is what a local `uses:` takes, and the
    derived step spells that directory. Its metadata is the `action.yml` or
    `action.yaml` within, discovered rather than configured; a directory holding
    both is refused, since nothing in the pair says which one a run would honour
    and guessing picks a contract the workflow may not use.

    Derivation reads that metadata and requires that it declares a composite
    Action, that it declares every reserved input the recipe supplies, that
    every key the configuration writes is an input it declares, that every input
    it requires without a default is covered by one side or the other, and that
    no configured key falls in the reserved namespace. Reserving a namespace
    rather than a list of names is what keeps that last check honest: it refuses
    whatever the recipe reserves today, so an input added later is covered
    without a second edit somewhere else. It is also the only one of these that
    guards more than a broken call. A configured key overwriting the sealed
    digest or the package path would hand delivery a package the establishment
    step never proved, which is a call that lies rather than a call that fails.

    Reading that metadata at derivation alone would bind nothing. The derived
    workflow spells a directory, so editing the Action changes the contract
    without changing a line of the file comparison reads, and a removed reserved
    input, a newly required one, or a rewritten Action kind all leave
    reconciliation green. Workflow comparison and `intentional check` therefore
    re-read the referenced metadata and refuse a contract the Action no longer
    satisfies, in the same way validation already reaches into native packager
    configuration rather than stopping at the workflow's surface. That is where
    the divergence is worth catching, because it is quiet: a delivery step
    handed an input its Action no longer declares is warned about rather than
    failed, so the run proceeds, delivers nothing the index will show, and
    surfaces as a publication that never appeared. The check names the Action.
    The deadline would have named the destination.

    What that reaches is the Action as comparison finds it on disk. The
    publisher job checks the released commit out, and steps running before
    delivery could rewrite the checked-out metadata the runner then loads; no
    revalidation the recipe performs sits above steps running beside it. That
    window is uncovered, and deliberately. Reaching it means a release job
    rewriting its own checkout mid-run, which is a repository undermining a
    workflow it owns rather than a destination, a packager, or a delivery step
    behaving badly, and these recipes draw their trust boundary where the rest
    of this design draws it.

    Outward, the recipe reads the step's success and nothing else. A delivery
    step that reported what it published would be reporting on itself, and no
    part of the observation may rest on it: the signed index is the only account
    of what reached the destination. This is the same rule every adapter follows
    when it declines to trust an accepted write, stated here because delivery is
    the one step the recipe does not own.

    Establishing the package precedes delivery, because a step that delivered
    first would have nothing left to refuse. The recipe reads identity out of
    the package itself — `dpkg-deb` for a Debian package, `rpm` for an RPM — and
    requires the name and version it reports to equal the ones the release
    sealed, against the digest the draft-asset handoff carries. A package whose
    own metadata disagrees with the release never reaches a destination.

    Architecture is read from the same place and compared with nothing, because
    it is an input rather than a claim. A pool path and a package directory are
    per-architecture, so delivery cannot place the file without knowing which
    one it holds, and the package's own declaration is the most authoritative
    account of that there is. Nothing above it seals an architecture to check it
    against, and nothing needs to: the digest already binds these bytes to the
    ones the release built, so an architecture read here is a fact about a file
    whose provenance is settled rather than an assertion awaiting one.

    Readback walks the format's published chain from the configured key, so what
    it proves is what a client would prove. For APT the recipe retrieves
    `dists/<suite>/InRelease`, verifies its signature with the configured key,
    and follows the digest it carries for a signed
    `<component>/binary-<architecture>/Packages.xz`, `Packages.gz`, or
    `Packages` member. An `Acquire-By-Hash: yes` index is retrieved through its
    SHA-256 path with canonical-path fallback, and compressed bytes are verified
    before decoding. Which form a hosted destination serves is unmeasured until
    readback; the signed index selects it. The decoded list must contain a stanza
    whose package, version, and SHA-256 are the ones just delivered. For RPM it
    retrieves
    `repodata/repomd.xml` with its detached signature, verifies that signature,
    follows the checksum `repomd.xml` records for its primary metadata, and
    requires an entry whose name, version, architecture, and checksum agree. An
    index served without a signature the configured key verifies is not a
    readback, because an unsigned list of packages is a file somebody served
    rather than a statement the repository stands behind.

    That key is fetched from its configured URL the way the destination's own
    install instructions tell a consumer to fetch it, and is not pinned. What
    the recipe answers is whether this release can be installed, so it asks it
    as a consumer arriving today would, and a consumer arriving today accepts
    the key the repository is serving. A destination that has rotated its
    signing key therefore reads as a success, correctly: a new consumer
    installs, while a consumer holding the old key sees a verification failure
    and updates the fingerprint they pinned. Whether a rotation kept the old key
    valid alongside the new one is a property of the repository's own rotation
    procedure and is tested where that procedure lives.

    Consumer retrieval installs the package through the format's ordinary client
    under a scratch configuration holding only the configured key and the
    configured repository: `apt` against the base URL, suite, and component, and
    `dnf` against a repository definition that verifies both package and
    repository signatures. Both retrievals digest what they retrieved and
    compare it with the sealed subject.

    The delivery step is required to have run without error and nothing more.
    Whether it wrote the index itself or started something that will reach it
    later is not a distinction this recipe can observe, and not one it needs:
    no destination reports its own publication, which is why every adapter
    reads its destination rather than trusting an accepted write. The
    observation deadline is configured rather than fixed, because the
    arrangement that determines it belongs to the repository. The recipe polls
    the signed index with the configured interval, backoff, maximum interval,
    and deadline. An index that is absent, incomplete, or names a followed file
    not yet served remains pending. An invalid signature or a same-name package
    whose version, architecture, or digest disagrees with the sealed package
    fails immediately. Reaching the deadline writes `pending` and reports that
    the publication was not observed, which is the honest claim — a repository
    that has not yet indexed the package and one whose
    delivery failed after the step returned are indistinguishable from outside,
    and verification treats that final observation as an immediate retryable
    failure so that a rerun reads the destination again without paying the same
    deadline twice.

  github-repository-authentication: >-
    A repository-installed GitHub App is the sole Git repository-write
    authority. It is explicitly configured as a bypass actor for the default
    branch ruleset and for rules protecting every Intentional-managed release
    tag namespace; repository contents permission alone is insufficient. Its
    application identifier and private key use prefix-derived
    conventional GitHub variable and secret names; the default names are
    `INTENTIONAL_GITHUB_APP_ID` and
    `INTENTIONAL_GITHUB_APP_PRIVATE_KEY`. Each privileged job mints a
    short-lived installation token scoped to the exact repository and
    permission needed for that operation. The App is installed only on source,
    tap, package-index, or other repositories selected by configuration.
    Executor initialization reports this ruleset prerequisite, and Airlock can
    audit the installed App, bypass scope, and repository settings.
    `GITHUB_TOKEN` is used for supported package capabilities such as GHCR with
    `packages: write` and `contents: read`, but never as Git repository-write
    authority.

  system-package-integration-authority: >-
    Package-scoped publication identity is authoritative for workflow and step
    derivation. RPM and APT recipe changes integrate on top of this contract and
    identify the package whose native artifact they distribute. Package identity
    changes selection and evidence addressing; it grants no retrieval authority.
    RPM and APT destinations are public. Intentional does not copy configured
    delivery inputs into the RPM or APT readback environment or body.

  external-publisher-authentication: >-
    Publisher adapters prefer registry-supported trusted publishing. Each
    adapter defines semantic credential roles and conventional secret names,
    and its configuration can override those names without containing secret
    values. Where a registry requires an existing package before trusted
    identity can be configured, the recipe exposes a protected bootstrap path.
    It proves that the target is absent before using the conventional token.
    Once the package exists, steady-state publication requires the trusted
    identity and never falls back to the bootstrap token after an identity
    failure. Docker Hub uses a username variable and personal access token by
    default, conventionally `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN`.

    npm's primary destination publishes through registry trusted publishing and
    conventionally names its bootstrap secret `NPM_TOKEN`. The recipe installs a
    client new enough to perform the exchange rather than trusting whichever
    client the runner image carries, because an older client looks for a token a
    trusted-publishing repository deliberately does not hold and reports the
    absence rather than the cause. GitHub Package Registry implements no trusted
    publishing and needs no secret: it accepts the repository-scoped workflow
    token, which expires with the job.

    Cargo's crates.io primary exchanges the run's workflow identity for a
    short-lived publish token and conventionally names its bootstrap secret
    `CARGO_REGISTRY_TOKEN`. A configured Cargo registry that is not crates.io
    defines its own trusted publishing, if any, so the maintained recipe
    authenticates it with the token every such registry does accept, read from
    the conventional or overridden secret and presented through the
    registry-specific `CARGO_REGISTRIES_<NAME>_TOKEN` variable. That registry's
    consumer path is authenticated too, so its retrieval is recorded as such
    rather than as the public retrieval the crates.io primary performs.

    A bootstrap path opens only on a probe that proved the destination does not
    hold the package. A probe that did not complete is not that proof: a
    registry client reports a missing package and a failed request the same way,
    and treating them alike turns any transient registry failure into a
    steady-state publication authenticated by a long-lived credential. Each
    recipe therefore separates the two outcomes from what its client reported
    and fails the job on an inconclusive probe, and it applies the same
    separation before submitting an immutable version. Where a client would
    report the two identically — an offline resolution and a missing package
    read the same — the recipe removes the condition rather than trying to tell
    the messages apart.

    Removing one such condition is not the same as removing the class. A client
    reads its configuration from two places, and a repository controls both: a
    file discovered by walking up from the working directory, and the process
    environment, which a repository's own workflow supplies through a top-level
    `env:` block the executor preserves deliberately. Either can make a client
    answer offline, substitute the source it reads, or replace the index
    outright, and each is the same misclassification by a different route.

    A maintained recipe's probe therefore reads no configuration it was not
    given. It runs outside the checkout so no file is discovered, and it runs in
    an environment cleared and rebuilt from what derivation names, so a variable
    nobody enumerated cannot reach it. That is the difference between an
    allowlist and a list of closed routes: the first is a property, the second
    is a record of what has been noticed. What an alternate destination needs in
    order to resolve — its registry index — is read at derivation, validated
    like every other repository-supplied value, and named in that environment as
    the one thing that crosses. A client that resolves a scoped name through
    configuration is told which registry serves the scope rather than being left
    to look it up.

    A small fixed set of process variables is still inherited, because a client
    cannot be found or run without them: the executable search path and the
    roots through which a proxied toolchain resolves the binary it stands in
    for. That set is enumerated in one place, its members are unconditional,
    and none of them is added by asking the process whether it carries it —
    membership decided by the environment is the environment deciding what the
    probe reads, which is the property being closed rather than an exception to
    it.

    Those members carry the runner's values, and a workflow-level `env:` applies
    to every job in the workflow. Convergence therefore refuses a repository
    workflow that declares any of them. That refusal is the exact complement of
    the inherited set rather than a list of keys judged dangerous, so the two
    cannot drift apart, and it is what makes calling that set the runner's
    contract true rather than merely intended.

    Every name a recipe reads out of the repository it releases is validated
    where it enters the model rather than escaped where it is used. These names
    reach shell bodies, interpreted arguments, YAML scalars and argument
    vectors, and a value safe for one of those is not safe for the next: quoting
    a name into a shell command does not stop that command from interpreting it.
    One rule per name, applied at the boundary, is what keeps a sink added later
    from inheriting a hazard its author never saw.

    The workflow identity is granted only to publisher jobs whose recipe
    presents one, whether to exchange it for a publish token or to bind a
    provenance attestation to the run. A destination authenticated by a
    repository-scoped or configured token is derived without it, because an
    identity a job never presents is still a credential every step of that job
    can reach.

  build-provenance-and-attached-metadata: >-
    Maintained recipes generate strong intrinsic release evidence when the
    selected packager and destination support it without unusual account
    requirements. OCI recipes attach source, revision, version, and created
    annotations where the format permits. Revision is R, and created derives
    from R's commit timestamp. OCI packagers generate an SBOM through their
    native supported mechanism and bind it to the subject digest. For a
    multi-platform index, every platform manifest has its own attestation
    manifest. The recipe verifies and records the SBOM and provenance predicate
    from each one rather than treating the first platform as evidence for the
    index. Each metadata reference names the platform attestation manifest that
    contains the predicate, not the published index. OCI destinations receive a
    keyless signature bound to their published subject by default. The recipe
    verifies generated provenance,
    attached metadata, annotations, and signatures and records their positive
    results. An explicit
    target omission suppresses the corresponding component for that target
    without producing a warning or waiver record. Release evidence remains
    affirmative and records only attached components that were produced.

  oci-distribution: |-
    OCI subjects can be runnable images, multi-platform image indexes, or
    non-image artifacts. Every configured destination resolves the exact
    release version to the content the release sealed, and is expected to
    resolve it under the same digest, pending the confirmations named below.
    Stable runnable-image recipes publish an immutable exact Semantic Version
    tag and monotonically advance compatible minor, major, and `latest`
    aliases. Major zero omits the broad `0` alias, prereleases do not advance
    stable aliases, and backports never move an alias backward. Dev Container
    Feature recipes maintain their native exact, minor, major, and `latest`
    aliases. Alias mutation promotes the existing subject and its final digest
    is read back and recorded. Platform matrices derive from the packager
    recipe and native packager configuration; platform-independent OCI
    artifacts have no artificial image platforms.

    Exact-version conflict detection lists the destination before promotion.
    The Distribution API's `NAME_UNKNOWN` response is the only failed listing
    treated as a repository with no tags; authentication, transport, and
    registry failures stop before any write.

    An OCI subject names itself in its own source. A Dev Container Feature
    carries its id, and a Dockerfile-backed image carries the last
    `org.opencontainers.image.title` label it declares, which is the one the
    image itself carries and also the annotation its destinations publish. A
    release unit whose source declares no such name, or declares one a build
    argument resolves, publishes nothing: the derivation reports it rather than
    substituting an identity the destinations do not resolve. A destination
    name remains destination state and is recorded as such, so one subject can
    be resolved as different repositories at Docker Hub and GHCR while every
    fragment agrees on the one subject the release sealed.

    A subject name is the one identity a release takes from repository source
    rather than from configuration, so it is accepted at the point it enters
    the model and nowhere else. It is held to the OCI repository-name grammar,
    which is narrower than the annotation permits, because it becomes a
    registry reference every destination has to resolve and a value the recipe
    bodies read beside a registry credential. Deciding its shape once, where a
    diagnostic can name the file and the label that declared it, is what makes
    those uses safe; a name that reached a recipe body and was escaped there
    would put the same decision in every future splice site.

    Alias entitlement is decided from the exact versions the destination
    already carries rather than from local state, which is what makes a
    backport, a rerun, and a first release reach the same decision from the
    same inputs. The version, revision, source, and created annotations are
    part of the sealed bytes rather than added at a destination, so annotating
    is not a per-destination mutation; each recipe proves the annotation the
    destination published is the version the built-subject document records.
    What a destination is compared against is the content the release sealed,
    not the digest of the sealed layout's own index. A registry re-serializes
    the index it is given, so that digest describes the bytes that landed
    rather than the bytes that were sent; the manifests the index references
    are carried through unchanged, and comparing those is what establishes that
    a destination holds this release's subject. Because every destination is
    handed the same layout, it is also what makes them hold the same one.

    Identical digests across destinations therefore rest on a property no
    fixture can establish: that the registries serialize one index the same
    way. Two confirmations against real registries settle it, and until they
    are made, equal content is what the protocol proves and equal digest is
    what it expects. The first is that Docker Hub and GHCR report the same
    index digest for one pushed layout. The second is that the push preserves
    the set of manifests the index references, which is the comparison every
    destination check rests on. The digest a destination reports is separately
    held to the bytes it serves, so a destination naming one subject and
    serving another is caught rather than recorded, and a destination already
    holding different content under the released version is reported as a
    conflict rather than overwritten.

    A native client that publishes from source rather than from the sealed
    bytes, notably the Dev Container CLI, is held to the same rules rather than
    trusted to follow them. The conflict decision is taken before it runs,
    because afterwards it would compare against bytes that client just pushed.
    Its native client owns alias mutation: stable releases carry exact, minor,
    major, and `latest`, while prereleases carry only exact. The recipe reads
    back the aliases that operation defines rather than
    applying Intentional's runnable-image entitlement policy to a client that
    does not implement it. What it published is compared against the packaged
    bytes, so a repackage that produced something else fails instead of passing
    as a promotion.

    An OCI destination's consumer path is public, so its clean-client retrieval
    runs with a scratch `DOCKER_CONFIG` whose credential store is empty: it
    resolves the release, retrieves the
    subject's own bytes, and checks that those bytes hash to the digest the
    destination published. Resolution alone would leave a destination that
    serves a tag publicly but refuses its content indistinguishable from one
    that serves both, which is a real state while a package's visibility is
    changing. A destination that is not publicly retrievable has been written
    but has not become observable, which is the pending state the protocol
    already bounds, so the recipe reports it as pending and says why rather
    than failing with its client's error and leaving verification nothing to
    read about a destination that was in fact fully published. Package
    visibility is therefore a prerequisite of publishing to a destination, and
    a release that has not met it says so.

    A Dev Container Feature is namespaced by the repository that publishes it,
    so its destination is not configurable. Its client resolves owner,
    repository and feature id, which a repository override can neither express
    nor change, and a configured one is refused where it is written rather than
    honoured by every readback while the client writes somewhere else.

  destination-verification-and-retry: >-
    A publisher command is followed by destination readback that verifies the
    expected identity, version, and observable immutable bytes or digest. A
    publisher whose consumer path is independent of GitHub draft assets then
    requires a clean client to resolve and retrieve the release through the
    destination's normal client path before closure. Most destinations serve
    that path anonymously and their evidence records public retrieval. A
    destination that admits no anonymous read at all, GitHub Package Registry
    among the maintained ones, has an authenticated normal client path, and its
    evidence says so rather than claiming a public retrieval nobody could
    perform or omitting the consumer check entirely. Its retrieval runs after
    publication in a separate job whose job-scoped `GITHUB_TOKEN` grants
    `packages: read` and cannot publish. Which of the three retrieval modes an
    evidence fragment may record is fixed before the retrieval runs, so a
    recipe never chooses between reporting its retrieval faithfully and passing
    verification. A recipe whose destination it knows fixes the mode itself. A
    system-package recipe reaches a public destination its configuration
    supplies and fixes public retrieval itself. Each adapter defines a bounded
    eventual-consistency policy containing retryable pending responses,
    intervals, backoff, and a deadline,
    and an adapter whose destination is configured takes its deadline from that
    configuration. A missing or not-yet-indexed result
    remains pending until the deadline, while an observable identity, checksum,
    or digest conflict fails immediately. A deadline produces a retryable
    workflow failure. On rerun, the adapter reads before writing, accepts an
    already visible matching publication, continues observation for a pending
    publication, and submits only when the destination can establish that it
    did not accept the original operation.

    Publisher evidence contains no observation timestamps or other wall-clock
    values. Before an after-publication tag exists, each recipe deterministically
    selects and orders evidence references before embedding the complete
    fragment in that tag. Once the tag exists, its embedded fragment is the
    sealed historical observation and is reused rather than regenerated. A
    retry revalidates the fragment's release bindings, immutable subject,
    immutable destination identity, and referenced evidence. It does not
    compare mutable aliases or the retry runner's packager and client versions
    with current observations. Fresh mutable state is reported only by live
    verification and never replaces the sealed fragment.

  immutable-github-release: |-
    A draft GitHub Release exists for the exact global release tag before
    publication begins, created by the authority transition that published that
    tag.

    Every GitHub-hosted deliverable is uploaded to that draft by a managed
    repository-local job that depends on every build job and precedes every
    publisher job. A GitHub-hosted deliverable is the release's own bytes
    reaching the release's own Release, so placing it is repository authority
    rather than destination authority. A release that builds none derives no
    such job.

    Writing to a Release is not a bounded scope. GitHub has no Release
    permission: creating a Release, uploading an asset to it, and publishing it
    are all governed by `contents: write`, the same permission that pushes
    commits and tags. A publisher job reaches a destination the release does not
    own, and it is the job most exposed to the packagers, registries, and
    third-party Actions a destination brings with it. Letting one place its own
    deliverable would give it authority to rewrite the repository's default
    branch and move its tags, and would give it to every publisher that happens
    to share the graph. That is the trade the upload job refuses. It costs a
    third managed job holding full repository content-write authority for the
    duration of its uploads, one more short-lived token mint, and one more job
    between the builds and the publishers; it buys that authority existing only
    in repository-local jobs the protected environment already gates. A
    publisher whose consumer path resolves a Release asset therefore reads it
    and never writes it.

    Publisher adapters complete distribution and their available pre-closure
    verification before Release closure. A publisher whose normal consumer
    path resolves a GitHub Release asset, notably Homebrew, cannot truthfully
    perform public clean-client retrieval while the Release is a draft. It
    receives stable Release and asset identities, obtains a read-only token from
    its narrowly installed GitHub App, downloads the asset through the
    authenticated draft Release API, verifies its digest, and performs every
    package-level resolution and integrity check available before closure. Its
    evidence records authenticated draft-asset retrieval and those package
    checks; it does not claim public clean-client retrieval.

    That claim is proved rather than asserted. The recipe reports which bytes it
    retrieved and their digest; the draft-asset handoff the upload job wrote
    states which assets belong to that publication and the canonical sha256 the
    release sealed for each. Publication verification joins the two: it proves the handoff against
    the repository and the live draft, and refuses a fragment whose retrieval
    digest no inventoried asset carries. A draft-dependent publisher verifies
    only with that handoff, and a publisher whose consumer path is public is
    refused one, because it consumes no draft asset.

    After all required publishers, applicable public clean-client checks,
    authenticated draft-asset checks, phase tags, configured gates, and evidence
    assembly succeed, a single closure job verifies the complete draft and
    publishes it. GitHub Release publication is the final authority transition
    and freezes its assets and associated tag. A failure before closure leaves a
    resumable draft. Matching publications already present at external
    destinations are recovered by destination readback; the executor does not
    represent cross-registry publication as an atomic rollback transaction.

  release-evidence: >-
    Every Intentional-owned publisher and verification job writes a
    schema-valid YAML fragment to a temporary workflow artifact. The fragments
    bind the release unit, package, publisher and target, S, R, global tag, plan digest,
    subject identity and digest, native provenance, destination readback, and
    the truthful consumer-verification mode and result. The assembly job rejects
    missing, duplicate, and unexpected publication identities, verifies fragment
    bindings and applicable
    phase-tag evidence, and orders the accepted fragments deterministically.
    `intentional evidence assemble` creates one human-readable
    `intentional-evidence.yml` containing the
    release identity, workflow identity, independently addressable release-unit
    and publisher evidence, and repository contributions. Evidence is
    affirmative and contains no omitted-component, warning, or posture fields.
    It also emits the complete attachment set. Repository-local closure steps
    upload and artifact-attest those files on the draft Release.

    Assembly proves the checkout it is given rather than trusting it or being
    handed a document about it. It resolves the annotated global release tag the
    checked-out commit publishes, rebuilds the release from the accepted source
    commit in an isolated local clone, and refuses the checkout unless the
    rebuilt plan digest, tree, commit, tag object and tag name all match what
    the published tag carries. That reproduction is credential-free, reaches no
    network, and is the same one tag verification performs, so the release
    identity and the sealed release plan both come from one derivation performed
    in the job that consumes them. A release that configures no publication
    assembles a complete statement, because naming the release does not depend
    on a publisher having run, and the statement's identity contract does not
    weaken to allow it: reproduction proves the annotated tag object the
    statement records. A fragment identifying some other release is refused
    however many other fragments agree with it.

    The plan digest every accepted fragment agrees on is the digest the
    reproduced plan's own payload determines, so the binding rests on a
    derivation rather than on agreement between claims. The global release tag
    is the one that plan seals, under the name it seals it by, and every
    published subject carries the version the plan assigns its release unit. The
    expected publication set is derived from the proved checkout's configuration
    and reconciled against the plan: a release unit with package publishers and no
    version bump is not in the plan, and a publication configured for it
    publishes nothing this release sealed. The plan itself is rebuilt from the
    configuration at the accepted source commit, not at the release commit, and
    the two are bound rather than identical: reproduction proves the rebuilt
    release tree is the released tree, so the configuration at the release
    commit is the deterministic product of the configuration the plan was
    rebuilt from.

    Reproduction proves a commit, and the configuration and every manifest the
    publication selection consults are read from the working tree. Assembly
    therefore proves each of those reads separately: for every path it opens it
    compares the bytes on disk with the blob the release commit carries, and
    refuses when a path differs or exists on only one side. The paths come from
    the selection itself, beside the probes that open them, so a probe added
    later is covered by the same comparison. Go discovery is the one read that
    opens files by pattern rather than by name, so its sources are taken from
    both the release commit and the disk and a source present on only one of
    them is a difference like any other.

    What is deliberately not asked is whether the checkout is dirty. That
    question is answered by rules outside the proved tree and writable by any
    step in the job — a repository-local exclude file never appears in the
    working tree, and an ignore file whose pattern matches everything silences
    a whole-tree sweep including itself. An ignore rule cannot hide a content
    mismatch on a path opened by name, so comparing reads closes the class
    rather than one input at a time. Scoping the comparison to what assembly
    reads is also what keeps repository state assembly never opens — a build
    directory, a scratch file — from converting a cosmetic condition into a
    release that cannot be closed. With every read held to the release commit,
    the configuration read is the configuration at the proved release commit,
    and a job checked out at another ref, or at the right ref with edited
    files, is refused outright rather than silently shifting what assembly
    expects.

    Evidence is not the only thing the draft carries. The GitHub-hosted
    deliverables are placed there before any publisher runs, by the managed
    upload job `immutable-github-release` names, so a publisher that consumes a
    Release asset finds it and no publisher writes one. Evidence arrives last,
    at closure, because it describes publications that have already completed.

    Assembly recognizes publisher and phase-tag evidence by document identity
    rather than by artifact name, so the derived workflow graph is what bounds
    which jobs can contribute it. Assembly depends on every phase tag job the
    configuration declares, and a declared phase whose sealed evidence never
    reaches assembly fails it. Every phase comparison iterates the documents
    supplied, so a run that supplies none would agree with everything. For the
    same reason a fragment naming a subject identity no sealed subject of its
    release unit names is a failure rather than a comparison against nothing.
    Closure depends transitively on every publisher job through the job that
    verifies its observation, and a publisher job that did not complete prevents
    closure. Removing that dependency would let any
    repository-owned job supply a fragment for a publication that never ran.

  repository-evidence-contributions: |-
    A standard credential-free contribution Action wraps
    `intentional evidence contribute` and accepts a required
    `namespace`, an optional `value-file`, and an optional newline-separated
    `attachments` list. At least one content input is present. The value file
    contains any valid YAML scalar, sequence, mapping, or null. Attachments are
    exact existing file paths; globs and directory inputs are not part of the
    contract. Each Release asset name is the attachment basename and the
    Release asset namespace is flat.

    The Action copies attachments into a temporary bundle, calculates SHA-256
    digests, and writes an internal YAML manifest identified by
    `$schema: https://intentional.foo/schemas/contribution/v1`. The manifest
    contains the namespace, parsed value when supplied, and each attachment's
    Release asset name, bundle-relative path, and digest. It uploads the bundle
    as a temporary workflow artifact whose name contains the contribution
    protocol, a filesystem-safe namespace hash, the GitHub job identifier, and
    workflow run-attempt number. The Action exposes no GitHub outputs; the
    manifest and attachment bundle are authoritative.

    `intentional evidence assemble` groups contribution artifacts by namespace
    and job, selects the
    highest available attempt for a retried job, and ignores that job's older
    attempts. A namespace claimed by different jobs after retry resolution, a
    repeated namespace within one job attempt, or duplicate Release asset
    basenames is a collision. Assembly verifies that YAML parses, files exist,
    and attachment digests agree, but does not interpret contributor values or
    gate their domain meaning. Accepted values are stored under
    `contributions.<namespace>` and accepted files enter the authoritative
    attachment set for repository-local closure steps to upload.

    A contributor job named in the configured publish gates is a required
    dependency of both evidence assembly and closure, so its contribution is
    present when assembly starts. Contributions from other jobs are
    best-effort: assembly consumes the set available when it starts and does
    not wait for or diagnose later artifacts. A configured publish gate
    therefore contributes evidence to assembly rather than inspecting the
    assembled result. Contributor Actions and the assembly command never
    create or mutate the draft Release. Repository-local privileged jobs divide
    that authority. The authority-transition job creates the draft for the
    global release tag it publishes: it already holds the installation token,
    and it is the last managed job that runs before any publisher needs the
    draft to exist. The closure job is the draft's sole finalizer, consumes the
    assembled files once, publishes it, and never replaces partial evidence
    incrementally. No other job creates or publishes the draft. The only
    writes it takes between those two points are the GitHub-hosted deliverables
    the managed upload job places on it, which is repository authority
    exercised in a repository-local job like the transitions on either side of
    it.

  evidence-consumption: >-
    `intentional verify release VERSION` resolves the GitHub Release and
    configured phase tags,
    downloads `intentional-evidence.yml`, verifies its GitHub artifact
    attestation and digest, accepts only the declared release-evidence schema
    and contract identities and only a document carrying the members that
    contract names, no member it does not name, and a value drawn from the
    closed set wherever it declares one, checks that every Git object and
    digest the release identity records is written in its complete form,
    validates the S-to-R-to-tag chain,
    compares applicable phase-tag evidence, and verifies publisher-native
    provenance and subject digests. `--live` repeats fresh destination readback
    and consumer retrieval. For a draft-dependent publisher, this is the first
    public client check after closure. Verification speaks no registry protocol
    itself, so that check reaches it the way a preclosure readback does: a
    public consumer client resolves and retrieves the release and writes a
    publication-observation document, and live verification reads each
    publication's document from the file its own identity names: that name is
    the identity with every character outside `A-Za-z0-9._-` written as `%` and
    its two uppercase hexadecimal digits, followed by `.yml`, so
    `component/package/homebrew/primary` is read from
    `component%2Fpackage%2Fhomebrew%2Fprimary.yml`. The encoding is reversible so that no
    two publications can resolve to one document, which is the property the
    observer exists for. A publication no supplied observation covers is
    reported rather than passed. The closed Release asset is read back whichever
    way the command is invoked, because it proves the recorded bytes are
    unchanged and claims nothing about what an unauthenticated consumer
    resolves; observations add the consumer claim rather than replacing that
    one. Its result is reported by verification
    and never rewrites `intentional-evidence.yml` or another immutable Release
    asset. The GitHub Release asset is the durable human- and
    machine-readable evidence record; temporary workflow artifacts are only
    transport between jobs.

  executor-conformance: >-
    Executor check uses the same derivation and semantic comparison engine as
    diff and apply. It reports missing or drifted reserved jobs, weakened
    permissions, missing configured gate dependencies, unsupported workflow
    contract revisions, and Action revisions that differ from the maintained
    recipe. The
    GitHub executor defines desired conformance when a repository invokes it;
    repository owners retain authority over their workflows and can remove the
    executor checks. Airlock consumes the installed contract to audit
    organizational requirements, GitHub environment protection, repository
    settings, credential posture, Action policy, and assessment gates without
    becoming a second authority for release semantics.

  external-action-pins: >-
    Every Action outside `wyrd-company/intentional/actions/` emitted into a
    managed job is declared by repository, upstream release tag, and complete
    commit identity in
    `github-action-pins.yml`. Offline conformance compares that authored table
    with the independently enumerated template constants in both directions and
    accepts only declared 40-hexadecimal commit identities in derived workflows.
    The evidence workflow itself participates in this census: its checkout step
    uses the complete commit declared for `actions/checkout`, and offline
    conformance binds that bootstrap use back to the declaration before the
    network reader runs.
    A network-only evidence workflow resolves each upstream tag on every pull
    request and push. Once merged to the default branch, it also runs every
    Monday. Each run reads the whole declaration before it resolves anything:
    every line is classified against a fixed grammar, and a line matching none
    of it fails the run naming that line, so no run can resolve part of the
    table and report success over the rest. Completeness there is
    exhaustiveness rather than agreement between two readings of the same text,
    and it holds against any edit including one that preserves the document's
    YAML meaning. Its price is that a declaration respelled in another valid
    YAML shape is refused rather than read. That reader is stdlib-only, because
    the workflow installs no dependencies. Each run fails when resolution no
    longer matches the declared commit. What that seam detects is upstream tag
    mutation: a retag, a
    force-push, a moved or deleted release tag. What it cannot detect is a
    declaration that was wrong when it was written, because each declared tag
    is chosen from the tags upstream already resolves to the pinned commit, so
    their agreement is a property of how the entry was authored rather than an
    independent confirmation of it. Offline conformance is bounded from the
    other side, comparing two hand-maintained halves that one mistake makes
    wrong consistently. Neither boundary is a defect in the declaration, and
    neither is grounds to repin an entry.

  npm-trusted-publishing-client: >-
    npm 11.5.1 is the exact client installed for npmjs trusted publishing. The
    client performs publication while the job carries publication authority,
    so the executor does not resolve an open range to a future client at run
    time. GitHub Package Registry does not implement trusted publishing and
    continues to use the runner's installed npm client.
