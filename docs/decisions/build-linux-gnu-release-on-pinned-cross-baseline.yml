$schema: https://refinery.systems/ontology/decision-record
name: Build Linux GNU release archives on a pinned cross-rs baseline

relationships:
  contextualizes:
    - intent-driven-polyglot-release

description: >-
  Intentional publishes dynamically linked GNU/Linux archives for x86_64 and
  ARM64. The x86_64 archive inherited the glibc requirements of the hosted
  release runner, which broke Ubuntu 22.04 consumers while ARM64 already built
  through cross-rs with an older GNU sysroot. The release contract must keep
  existing asset names and downstream consumers while making Ubuntu 22.04 an
  intentionally supported GNU/Linux environment with repeatable build inputs,
  documented minimum glibc requirements, and lifecycle policy for refreshing
  those inputs.

considered-options:
  1: >-
    Replace the GNU/Linux archives with musl static executables under the
    current asset names. Removes the glibc floor and adds Alpine support, but
    changes the ABI contract, shifts runtime security maintenance onto product
    rebuilds, and requires pinning mutable cross `main` image digests beside an
    older cross CLI.
  2: >-
    Add parallel musl archives and teach npm, Homebrew, the plumbing Action, and
    direct-download documentation to select a libc. Preserves GNU consumers but
    expands the release matrix, attestation surface, and consumer-selection
    policy permanently.
  3: >-
    Build both Linux GNU architectures through pinned cross-rs 0.2.5 images with
    digest-locked sysroots, document a maximum required GLIBC symbol version of
    GLIBC_2.18, and continuously verify Ubuntu 22.04 and the current Ubuntu
    environment against the release-profile artifacts. Preserves every existing
    consumer contract and extends the ARM64 cross strategy to x86_64.
  4: >-
    Declare a newer minimum glibc and exclude Ubuntu 22.04 from the supported
    GNU/Linux contract. Requires the least release-workflow change but leaves
    the reported compatibility defect unresolved.

decision-outcome:
  chosen-option: 3
  justification: >-
    Task 47 measured release-profile GNU, older-baseline GNU, and musl
    prototypes on both architectures. Older-baseline GNU matched current archive
    sizes and build durations, passed Ubuntu 22.04 and current Ubuntu smoke
    checks, and reached GLIBC_2.18 while the released x86_64 GNU artifact
    reached GLIBC_2.39 and failed Ubuntu 22.04. Musl removed the glibc floor
    but introduced static-runtime maintenance, non-PIE ARM64 linkage, and
    consumer-contract changes without a demonstrated product requirement for
    Alpine support. Pinning cross-rs 0.2.5 images by digest for both GNU
    targets keeps asset names, checksum layout, npm mapping, Homebrew URLs, and
    Action selection unchanged while making the compatibility floor explicit
    and testable.

expected-outcomes:
  positive:
    - >-
      Ubuntu 22.04 x86_64 consumers run the same `intentional-linux-x86_64.tar.gz`
      asset name without a libc-selection dimension.
    - >-
      x86_64 and ARM64 Linux GNU builds share one documented baseline policy,
      cache-invalidation inputs, and linkage verification gate.
    - >-
      Host operating-system glibc updates continue to satisfy the documented
      GLIBC_2.18 symbol ceiling on supported Ubuntu environments.
  negative:
    - >-
      Baseline refresh requires a deliberate digest bump, full linux-gnu evidence
      rerun, and coordinated updates to `Cross.toml`, `linux-gnu-baseline.env`,
      and release cache keys.
    - >-
      Alpine and other musl-only environments remain outside the GNU/Linux
      support contract until a separate product decision adds them.
