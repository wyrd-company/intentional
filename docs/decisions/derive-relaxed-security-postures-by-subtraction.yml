$schema: https://refinery.systems/ontology/decision-record
name: Derive relaxed security postures by subtracting controls

relationships:
  contextualizes:
    - intent-driven-polyglot-release
    - managed-workflow

description: >-
  Intentional must support repositories whose owners want different levels of
  release-security ceremony. Wyrd Company is adopting the complete managed
  security model for the 0.2.0 workflow: repository-owner GitHub App authority,
  protected branch and tag rulesets with App-scoped bypass, protected
  environments, immutable GitHub Releases, and artifact attestations. Airlock is
  being designed to make this posture straightforward for Wyrd Company to
  provision and maintain. A relaxed posture is required for broader 1.0.0
  adoption because external repository owners may prefer conventional GitHub
  release security and may not accept every control in Wyrd Company's model. The
  implementation needs one direction for composing these postures without
  silently weakening a repository or maintaining divergent release protocols.

considered-options:
  1: >-
    Begin with a traditional relaxed workflow and add stronger controls as
    independent optional features. This lowers initial setup cost, but makes the
    weakest model define the graph and treats Wyrd Company's required guarantees
    as extensions that can interact in combinations the base protocol does not
    exercise.
  2: >-
    Begin with the complete robust workflow and define every supported relaxed
    posture by explicitly removing controls and the guarantees coupled to them.
    The robust graph remains canonical. Generation, conformance, and evidence
    interpret one named posture and never infer relaxation from missing settings.
  3: >-
    Implement traditional and robust postures as independent peer workflow
    designs. Each can fit its audience directly, but authority ordering,
    publication behavior, recovery, and evidence semantics can drift between two
    implementations of the same release protocol.
  4: >-
    Detect available GitHub features and generate the strongest workflow the
    repository can currently support. This minimizes explicit configuration, but
    repository-setting drift can silently change security guarantees and make
    identical Release Workspace configuration produce different authority and
    evidence contracts.

decision-outcome:
  chosen-option: 2
  justification: >-
    Wyrd Company needs and is adopting the complete security model now. It can
    exercise that model on real releases, and Airlock will reduce its setup and
    maintenance cost. Relaxed security is an external adoption need rather than
    Wyrd Company's operating need. Making the exercised robust protocol canonical
    keeps its guarantees structural. A relaxed posture can then identify every
    removed control and lost guarantee directly. This avoids designing the
    product around a weaker workflow and later layering Wyrd Company's actual
    requirements onto it as interacting options. Explicit named posture selection
    also prevents missing or changed GitHub settings from causing an automatic
    security downgrade.

expected-outcomes:
  positive:
    - >-
      Wyrd Company's real release process exercises the canonical workflow graph
      and its strongest authority, isolation, durability, and verification
      guarantees from the first managed release.
    - >-
      Every relaxed posture has a reviewable delta from one robust protocol and
      can state exactly which settings, jobs, evidence, and guarantees it removes.
    - >-
      Workflow generation, conformance, recovery, and evidence remain one shared
      implementation instead of separate traditional and robust protocols.
    - >-
      Missing GitHub settings fail the configured posture rather than selecting a
      weaker posture implicitly.
  negative:
    - >-
      The robust posture imposes the complete GitHub setup contract on managed
      workflow adoption until relaxed postures are implemented.
    - >-
      Each supported relaxation requires an explicit security analysis that maps
      removed controls to lost guarantees and proves the remaining workflow graph
      is coherent.
    - >-
      Evidence consumers must interpret posture identity and guarantee inventory
      when comparing releases created under different postures.
