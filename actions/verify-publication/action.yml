# ---
# relationships:
#   implements: github-release-executor
# ---
name: "intentional verify publication"
description: "Verify one destination publication and expose its affirmative evidence fragment"
author: "wyrd-company"
branding:
  icon: "shield"
  color: "orange"

inputs:
  release-unit:
    description: "Release-unit identifier whose publication is verified"
    required: true
  package:
    description: "Package identifier whose publication is verified"
    required: true
  publisher:
    description: "Configured publisher adapter identifier"
    required: true
  target:
    description: "Publisher target selector; a publisher with a primary target accepts omission"
    required: false
    default: ""
  observation:
    description: "Publication-observation document the recipe's readback steps produced"
    required: true
  output:
    description: "File the schema-backed publisher evidence fragment is written to"
    required: true
  draft-handoff:
    description: "Draft-Release asset handoff document a draft-dependent publisher consumed"
    required: false
    default: ""
  working-directory:
    description: "Repository directory holding the released commit and its tags"
    required: false
    default: "."
  intentional-version:
    description: "Released intentional version without a v prefix, or latest"
    required: false
    default: "latest"

outputs:
  evidence-path:
    description: "Path of the completed publisher-evidence fragment"
    value: ${{ steps.verify.outputs.evidence-path }}

runs:
  using: "composite"
  steps:
    - name: Install intentional
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.intentional-version }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/../../scripts/action/install-intentional.sh" "$REQUESTED_VERSION"

    - name: Verify the publication
      id: verify
      shell: bash
      env:
        INPUT_RELEASE_UNIT: ${{ inputs.release-unit }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_PUBLISHER: ${{ inputs.publisher }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_OBSERVATION: ${{ inputs.observation }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_DRAFT_HANDOFF: ${{ inputs.draft-handoff }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # An omitted selector must reach the command as an absent option rather
        # than as an empty one, because omission is what selects an adapter's
        # configured primary destination.
        SELECTOR=()
        if [[ -n "$INPUT_TARGET" ]]; then
          SELECTOR=(--target "$INPUT_TARGET")
        fi
        # Only a draft-dependent publisher consumes a handoff, and supplying one
        # for any other publisher is refused, so an empty input has to reach the
        # command as an absent option rather than as an empty path.
        HANDOFF=()
        if [[ -n "$INPUT_DRAFT_HANDOFF" ]]; then
          HANDOFF=(--draft-handoff "$INPUT_DRAFT_HANDOFF")
        fi
        intentional --directory "$INPUT_WORKING_DIRECTORY" verify publication \
          --release-unit "$INPUT_RELEASE_UNIT" \
          --package "$INPUT_PACKAGE" \
          --publisher "$INPUT_PUBLISHER" \
          ${SELECTOR[@]+"${SELECTOR[@]}"} \
          --observation "$INPUT_OBSERVATION" \
          --output "$INPUT_OUTPUT" \
          ${HANDOFF[@]+"${HANDOFF[@]}"} |
          "$GITHUB_ACTION_PATH/../../scripts/action/project-identities.sh" "$GITHUB_OUTPUT" \
            evidence-path
