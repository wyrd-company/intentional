# ---
# relationships:
#   implements: github-release-executor
# ---
name: "intentional observe and verify publication"
description: "Read back one destination publication and expose its affirmative evidence fragment"
author: "wyrd-company"
branding:
  icon: "shield"
  color: "orange"

inputs:
  release-unit:
    description: "Release-unit identifier whose publication is verified"
    required: true
  package:
    description: "Package identifier whose publication is verified"
    required: true
  publisher:
    description: "Configured publisher adapter identifier"
    required: true
  target:
    description: "Publisher target selector; a publisher with a primary target accepts omission"
    required: false
    default: ""
  observation:
    description: "Publication-observation document this Action verifies and, when credential-free, writes"
    required: true
  output:
    description: "File the schema-backed publisher evidence fragment is written to"
    required: true
  draft-handoff:
    description: "Draft-Release asset handoff document a draft-dependent publisher consumed"
    required: false
    default: ""
  working-directory:
    description: "Repository directory holding the released commit and its tags"
    required: false
    default: "."
  subject:
    description: "Built subject bytes to read back from the destination"
    required: true
  subject-kind:
    description: "Publication-observation subject kind"
    required: true
  subject-identity:
    description: "Identity a consumer resolves at the destination"
    required: true
  subject-version:
    description: "Version sealed by the built-subject document"
    required: true
  subject-digest:
    description: "Digest sealed by the built-subject document"
    required: true
  packager:
    description: "Packager whose sealed output was published"
    required: true
  destination:
    description: "Destination identity the selected publication resolves"
    required: true
  retrieval-mode:
    description: "Consumer retrieval mode fixed by the selected recipe"
    required: true
  retrieval-client:
    description: "Client that retrieves the published subject"
    required: true
  work:
    description: "Scratch directory for destination readback"
    required: true
  interval:
    description: "Initial destination-observation retry interval in seconds"
    required: true
  backoff:
    description: "Destination-observation retry multiplier"
    required: true
  maximum-interval:
    description: "Maximum destination-observation retry interval in seconds"
    required: true
  deadline:
    description: "Destination-observation deadline in seconds"
    required: true
  observe:
    description: "Whether this credential-free Action writes the observation before verifying it"
    required: false
    default: "true"
  registry:
    description: "Registry endpoint or Cargo registry identity"
    required: false
    default: ""
  scope:
    description: "npm package scope, including the leading at sign"
    required: false
    default: ""
  registry-name:
    description: "Cargo alternate-registry name"
    required: false
    default: ""
  registry-index-variable:
    description: "Cargo environment key naming an alternate registry index"
    required: false
    default: ""
  registry-index-url:
    description: "Cargo alternate-registry index URL"
    required: false
    default: ""
  public-key-url:
    description: "System-package repository signing-key URL"
    required: false
    default: ""
  apt-suite:
    description: "APT suite containing the publication"
    required: false
    default: ""
  apt-component:
    description: "APT component containing the publication"
    required: false
    default: ""
  rpm-channel:
    description: "RPM channel containing the publication"
    required: false
    default: ""
  components:
    description: "Space-separated attached OCI components selected for this destination"
    required: false
    default: ""
  intentional-version:
    description: "Released intentional version without a v prefix, or latest"
    required: false
    default: "latest"

outputs:
  evidence-path:
    description: "Path of the completed publisher-evidence fragment"
    value: ${{ steps.verify.outputs.evidence-path }}

runs:
  using: "composite"
  steps:
    - name: Install intentional
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.intentional-version }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/../../scripts/action/install-intentional.sh" "$REQUESTED_VERSION"

    - name: Observe the publication
      id: observe
      if: inputs.observe == 'true'
      shell: bash
      env:
        INPUT_RELEASE_UNIT: ${{ inputs.release-unit }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_PUBLISHER: ${{ inputs.publisher }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_OBSERVATION: ${{ inputs.observation }}
        INPUT_SUBJECT: ${{ inputs.subject }}
        INPUT_SUBJECT_KIND: ${{ inputs.subject-kind }}
        INPUT_SUBJECT_IDENTITY: ${{ inputs.subject-identity }}
        INPUT_SUBJECT_VERSION: ${{ inputs.subject-version }}
        INPUT_SUBJECT_DIGEST: ${{ inputs.subject-digest }}
        INPUT_PACKAGER: ${{ inputs.packager }}
        INPUT_DESTINATION: ${{ inputs.destination }}
        INPUT_RETRIEVAL_MODE: ${{ inputs.retrieval-mode }}
        INPUT_RETRIEVAL_CLIENT: ${{ inputs.retrieval-client }}
        INPUT_WORK: ${{ inputs.work }}
        INPUT_INTERVAL: ${{ inputs.interval }}
        INPUT_BACKOFF: ${{ inputs.backoff }}
        INPUT_MAXIMUM_INTERVAL: ${{ inputs.maximum-interval }}
        INPUT_DEADLINE: ${{ inputs.deadline }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_REGISTRY_NAME: ${{ inputs.registry-name }}
        INPUT_REGISTRY_INDEX_VARIABLE: ${{ inputs.registry-index-variable }}
        INPUT_REGISTRY_INDEX_URL: ${{ inputs.registry-index-url }}
        INPUT_PUBLIC_KEY_URL: ${{ inputs.public-key-url }}
        INPUT_APT_SUITE: ${{ inputs.apt-suite }}
        INPUT_APT_COMPONENT: ${{ inputs.apt-component }}
        INPUT_RPM_CHANNEL: ${{ inputs.rpm-channel }}
        INPUT_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/../../scripts/action/observe-publication.sh"

    - name: Verify the publication
      id: verify
      shell: bash
      env:
        INPUT_RELEASE_UNIT: ${{ inputs.release-unit }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_PUBLISHER: ${{ inputs.publisher }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_OBSERVATION: ${{ inputs.observation }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_DRAFT_HANDOFF: ${{ inputs.draft-handoff }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # An omitted selector must reach the command as an absent option rather
        # than as an empty one, because omission is what selects an adapter's
        # configured primary destination.
        ARGS=(--directory "$INPUT_WORKING_DIRECTORY" verify publication
          --release-unit "$INPUT_RELEASE_UNIT"
          --package "$INPUT_PACKAGE"
          --publisher "$INPUT_PUBLISHER"
          --observation "$INPUT_OBSERVATION"
          --output "$INPUT_OUTPUT")
        if [[ -n "$INPUT_TARGET" ]]; then
          ARGS+=(--target "$INPUT_TARGET")
        fi
        # Only a draft-dependent publisher consumes a handoff, and supplying one
        # for any other publisher is refused, so an empty input has to reach the
        # command as an absent option rather than as an empty path.
        if [[ -n "$INPUT_DRAFT_HANDOFF" ]]; then
          ARGS+=(--draft-handoff "$INPUT_DRAFT_HANDOFF")
        fi
        intentional "${ARGS[@]}" |
          "$GITHUB_ACTION_PATH/../../scripts/action/project-identities.sh" "$GITHUB_OUTPUT" \
            evidence-path
