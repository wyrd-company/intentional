# ---
# relationships:
#   implements: github-release-executor
# ---
name: "intentional verify release-tag"
description: "Verify the current global release tag and expose its verified identities"
author: "wyrd-company"
branding:
  icon: "shield"
  color: "orange"

inputs:
  working-directory:
    description: "Repository directory holding the released commit and its tags"
    required: false
    default: "."
  intentional-version:
    description: "Released intentional version without a v prefix, or latest"
    required: false
    default: "latest"

outputs:
  source-sha:
    description: "Verified accepted source commit"
    value: ${{ steps.verify.outputs.source-sha }}
  release-sha:
    description: "Verified deterministic release commit"
    value: ${{ steps.verify.outputs.release-sha }}
  global-tag:
    description: "Verified name of the annotated global release tag"
    value: ${{ steps.verify.outputs.global-tag }}
  global-tag-object:
    description: "Verified identity of the annotated global release tag object"
    value: ${{ steps.verify.outputs.global-tag-object }}
  plan-digest:
    description: "Verified digest sealed inside the release plan"
    value: ${{ steps.verify.outputs.plan-digest }}

runs:
  using: "composite"
  steps:
    - name: Install intentional
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.intentional-version }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/../../scripts/action/install-intentional.sh" "$REQUESTED_VERSION"

    - name: Verify the global release tag
      id: verify
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        intentional --directory "$INPUT_WORKING_DIRECTORY" verify release-tag |
          "$GITHUB_ACTION_PATH/../../scripts/action/project-identities.sh" "$GITHUB_OUTPUT" \
            source-sha release-sha global-tag global-tag-object plan-digest
