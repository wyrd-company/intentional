# ---
# relationships:
#   implements: github-release-executor
#   verifies: github-action-pins
# ---
name: GitHub Action pin evidence

on:
  pull_request:
  push:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tags:
    name: Resolve declared references
    runs-on: ubuntu-latest
    # Bounded retry gives every declared repository its own attempt ceiling, so
    # a total upstream outage now costs wall-clock rather than failing fast.
    # This bound is held above that worst case by
    # scripts/release/test-action-pin-evidence.sh.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Compare upstream references with declared commits
        run: scripts/release/verify-github-action-pins-online.py
