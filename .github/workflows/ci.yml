# ---
# relationships:
#   implements: intent-driven-polyglot-release
# ---
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-ci:
    name: Repository CI through Task
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install repository CI tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gifsicle ripgrep
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          go install github.com/mikefarah/yq/v4@v4.53.3
          cargo install ryl --version 0.21.0 --locked
          cargo install rumdl --version 0.2.48 --locked
          scripts/ci/install-workflow-test-tools.sh .ci-tools/bin
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$PWD/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Allow Mermaid's Chromium sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the repository CI contract
        run: task ci

  minimum-rust:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - name: Install workflow test tools
        run: |
          scripts/ci/install-workflow-test-tools.sh .ci-tools/bin
          echo "$PWD/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Test the locked workspace with Rust 1.85
        run: cargo test --workspace --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install workflow test tools
        run: |
          scripts/ci/install-workflow-test-tools.sh .ci-tools/bin
          echo "$PWD/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Exercise Cargo Homebrew emitted bodies
        env:
          LC_ALL: C
        run: >-
          cargo test -p intentional-core cargo_homebrew_platform_contract
          -- --ignored --nocapture
      - name: Test
        run: cargo test --workspace
      - name: Check this repository with intentional
        run: cargo run --bin intentional -- check

  npm-launcher:
    name: npm launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Test launcher, installer, and package allowlist
        run: npm test --prefix npm

  release-automation:
    name: Release automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate script syntax and version agreement
        shell: bash
        run: |
          bash -n scripts/release/*.sh
          python3 scripts/release/verify-versions.py
      - name: Exercise matching, conflicting, and retry paths
        run: scripts/release/test-retry.sh
      - name: Guard Linux GNU release baseline and consumer contract
        run: |
          scripts/release/assert-release-workflow-baseline.sh
          scripts/release/assert-linux-gnu-baseline-provenance.sh
          scripts/release/assert-consumer-contract.sh
