# ---
# relationships:
#   implements: intent-driven-polyglot-release
# ---
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  minimum-rust:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test the locked workspace with Rust 1.88
        run: cargo test --workspace --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check this repository with intentional
        run: cargo run --bin intentional -- check

  path-semantics:
    name: Path semantics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-14 ]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test projection path resolution and file identity
        run: >-
          cargo test --locked -p intentional-core --lib --
          projection_file:: config::tests:: ownership:: workspace_files::
      - name: Test shared projection files end to end
        run: cargo test --locked -p intentional-cli --test shared_projections
        env:
          INTENTIONAL_TEST_CASE_INSENSITIVE: "1"

  npm-launcher:
    name: npm launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Test launcher, installer, and package allowlist
        run: npm test --prefix npm

  release-automation:
    name: Release automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate script syntax and version agreement
        shell: bash
        run: |
          bash -n scripts/release/*.sh
          python3 scripts/release/verify-versions.py
      - name: Exercise matching, conflicting, and retry paths
        run: |
          scripts/release/test-retry.sh
          scripts/release/test-homebrew-publication.sh
      - name: Guard Linux GNU release baseline and consumer contract
        run: |
          scripts/release/assert-release-workflow-baseline.sh
          scripts/release/assert-linux-gnu-baseline-provenance.sh
          scripts/release/assert-consumer-contract.sh
