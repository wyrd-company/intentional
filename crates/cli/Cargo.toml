# ---
# relationships:
#   implements: intent-driven-polyglot-release
# ---
[package]
name = "intentional-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Polyglot intent-driven release CLI"

[[bin]]
name = "intentional"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
intentional-core = { path = "../core", version = "0.1.6" }
semver.workspace = true

[dev-dependencies]
# The workflow-derivation fixture the invocation gate and the end-to-end
# release-handoff test both derive from lives in the core crate, so both read
# one representative workspace rather than two transcriptions of it.
intentional-core = { path = "../core", version = "0.1.6", features = [ "test-support" ] }
assert_cmd = "2.0"
predicates = "3.1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
shell-words = "1.1"
tempfile = "3.8"
