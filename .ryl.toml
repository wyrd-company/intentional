# ---
# relationships:
#   implements: intent-driven-polyglot-release
# ---
#
# RYL 0.21.0 rule baseline. Every rule shipped by the installed version is
# enabled below or excluded here. scripts/ci/assert-ryl-rule-baseline.sh keeps
# this census closed when the pinned RYL version changes.
# excluded-rule: anchors - Anchor and alias use remains available for shared YAML fragments.
# excluded-rule: block-scalar-chomping - Existing command blocks use YAML's clip default.
# excluded-rule: comments - Existing workflow pin annotations use one separating space.
# excluded-rule: comments-indentation - Comments follow the source construct they explain.
# excluded-rule: float-values - Numeric scalar spelling remains owned by each file's domain.
# excluded-rule: key-ordering - Domain and GitHub mappings use reader-first key order.
# excluded-rule: merge-keys - Merge-key use remains available for shared YAML mappings.
# excluded-rule: new-lines - Git owns repository line-ending normalization.
# excluded-rule: octal-values - Numeric scalar spelling remains owned by each file's domain.
# excluded-rule: quoted-strings - Plain scalars keep workflow and Taskfile source readable.
# excluded-rule: tags - Custom YAML tags are not prohibited by repository policy.
# excluded-rule: truthy - Workflow source keeps plain `on`, which YAML 1.1 treats as truthy.
# excluded-rule: unicode-line-breaks - Git owns repository line-ending normalization.

[files]
yaml = ["*.yml", "*.yaml", "**/*.yml", "**/*.yaml"]

[rules.braces]
level = "error"
forbid = false
min-spaces-inside = 1
max-spaces-inside = 2
min-spaces-inside-empty = 0
max-spaces-inside-empty = 0

[rules.brackets]
level = "error"
forbid = false
min-spaces-inside = 1
max-spaces-inside = 1
min-spaces-inside-empty = 0
max-spaces-inside-empty = 0

[rules.colons]
level = "error"
max-spaces-before = 0
max-spaces-after = 1

[rules.commas]
level = "error"
max-spaces-before = 0
min-spaces-after = 1
max-spaces-after = 1

[rules.empty-lines]
level = "error"
max = 1
max-start = 0
max-end = 0

[rules.hyphens]
level = "error"
max-spaces-after = 1
dash-on-own-line = false

[rules.indentation]
level = "error"
spaces = 2
indent-sequences = true
check-multi-line-strings = true

[rules.line-length]
level = "warning"
max = 100
allow-non-breakable-words = true
allow-non-breakable-inline-mappings = true

[rules.new-line-at-end-of-file]
level = "error"

[rules.trailing-spaces]
level = "error"

[rules.document-end]
level = "error"
present = false

[rules.document-start]
level = "error"
present = false

[rules.empty-values]
level = "error"
forbid-in-block-mappings = false
forbid-in-flow-mappings = true
forbid-in-block-sequences = true

[rules.key-duplicates]
level = "error"
forbid-duplicated-merge-keys = false
check-canonical = false
forbid-merge-key-shadowing = false
